<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>犬クイズ モニター</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px;
      font-size: 48px;
    }

    /* 全体グリッド */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      padding: 20px;
    }

    /* 通常枠 */
    .cell {
      border: 2px solid #999;
      border-radius: 15px;
      padding: 10px;
      min-height: 120px;

      font-size: 20px;
      transition: all 0.4s ease; /* ★アニメーション */
    }

    /* 番号と犬名（通常） */
    .cell .num {
      font-size: 26px;
      font-weight: bold;
    }

    .cell .dog {
      font-size: 22px;
    }

    /* ✅正解枠：ドン！と巨大化 */
    .answered {
      background: #d4f8d4;
      border: 5px solid green;

      min-height: 200px;      /* ★大きくする */
      font-weight: 900;

      transform: scale(1.12); /* ★拡大演出 */
    }

    /* 正解枠の番号は超巨大 */
    .answered .num {
      font-size: 52px;
      font-weight: 900;
    }

    /* 正解枠の犬名も大きく */
    .answered .dog {
      font-size: 32px;
      font-weight: 800;
    }

    /* 正解マークも大きく */
    .answered .mark {
      font-size: 28px;
      margin-top: 6px;
    }

    /* 写真も少し大きく */
    img {
      margin-top: 10px;
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<h1>🐶 犬クイズ</h1>

<div id="grid" class="grid"></div>

<script>
/* ★あなたのGAS URL */
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbysC8_DE3KENuaTbOynEviquqjhPVcSCxXo6zIREjkKnVrYrHdLey4vH0G8ARhHPPOo/exec";

/* モニター更新処理 */
async function load() {

  const res = await fetch(GAS_URL + "?mode=monitor");
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  data.questions.forEach(q => {

    const num  = q[0];   // 番号
    const name = q[1];   // 犬名
    const img  = q[2];   // 写真ファイル名（任意）

    const div = document.createElement("div");
    div.className = "cell";

    /* 通常表示 */
    div.innerHTML = `
      <div class="num">${num}</div>
      <div class="dog">${name}</div>
    `;

    /* 正解していたら演出表示 */
    if (data.correctMap[num]) {

      div.classList.add("answered");

      div.innerHTML += `
        <div class="mark">✅ 正解！</div>
      `;

      /* 写真が設定されていれば表示 */
      if (img) {
        div.innerHTML += `<img src="images/${img}">`;
      }
    }

    grid.appendChild(div);
  });
}

/* 最初に読み込み */
load();

/* 3秒ごとに更新（リアルタイム風） */
setInterval(load, 3000);

</script>

</body>
</html>
