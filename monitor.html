<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クイズモニター</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f5f5f5;
}

h1 {
  margin: 20px 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding: 20px;
}

.cell {
  background: white;
  border-radius: 20px;           /* ★丸角 */
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  padding: 15px;
  min-height: 220px;             /* ★高さ確保 */
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.answerLine {
  margin-top: 10px;
  color: green;
  font-size: 16px;
}

img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  margin-top: 10px;
}
</style>

</head>

<body>

<h1 id="mainTitle">クイズ</h1>

<div class="grid" id="grid"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

async function load() {

  const res = await fetch(GAS_URL);
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  let stageTitle = "クイズ";

  /* ★ここが今回の核心（correctMapを作る） */
  let correctMap = {};

  data.answers.forEach(row => {

    const player   = row[0];
    const selected = Number(row[1]);
    const correct  = row[3];
    const stage    = Number(row[4]);

    if (correct === true || correct === "TRUE") {

      const key = stage + "-" + selected;

      if (!correctMap[key]) {
        correctMap[key] = player;
      }

    }

  });
  
  
  /* 問題表示 */
  data.questions.forEach(q => {

    const stage  = Number(q[0]);
    const number = q[1];
    const title  = q[3];
    const name   = q[4];
    const img    = q[5];

　　if (stage !== Number(data.currentStage)) return;
    
    stageTitle = title || "クイズ";

    const div = document.createElement("div");
    div.className = "cell";

    div.innerHTML = `<div class="title">【${number}】${name}</div>`;

    const key = stage + "-" + number;

    if (correctMap[key]) {

      div.innerHTML += `
        <div class="answerLine">
          ✅正解 → ${correctMap[key]}
        </div>
      `;

      if (img) {
        div.innerHTML += `<img src="images/${img}">`;
      }

    }

    grid.appendChild(div);

  });

  document.getElementById("mainTitle").innerText = stageTitle;

}

load();
setInterval(load, 1500);

</script>

</body>
</html>
