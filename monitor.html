<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>犬クイズ モニター</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      margin: 20px;
      font-size: 42px;
    }

    /* 10枠表示 */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      padding: 15px;
    }

    /* 枠は拡大しない */
    .cell {
      border: 3px solid #666;
      border-radius: 18px;
      padding: 10px;
      height: 180px;   /* 正方形寄り */
      font-size: 22px;
      overflow: hidden;
    }

    .num {
      font-size: 30px;
      font-weight: bold;
    }

    .name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    /* 正解＋あだ名を横並び */
    .correctRow {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
      margin-top: 4px;
    }

    /* 写真（将来） */
    img {
      margin-top: 8px;
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<h1>🐶 犬クイズ</h1>

<div id="grid" class="grid"></div>

<script>
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbysC8_DE3KENuaTbOynEviquqjhPVcSCxXo6zIREjkKnVrYrHdLey4vH0G8ARhHPPOo/exec";

async function load() {

  const res = await fetch(GAS_URL + "?mode=monitor");
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  data.questions.forEach(q => {

    const num  = q[0];
    const name = q[1];
    const img  = q[2];

    const div = document.createElement("div");
    div.className = "cell";

    div.innerHTML = `
      <div class="num">【${num}】</div>
      <div class="name">${name}</div>
    `;

    if (data.correctMap[num]) {

      const winner = data.correctMap[num];

      div.innerHTML += `
        <div class="correctRow">
          <span>✅正解</span>
          <span>${winner}</span>
        </div>
      `;

      if (img) {
        div.innerHTML += `<img src="images/${img}">`;
      }
    }

    grid.appendChild(div);
  });
}

load();
setInterval(load, 1500);
</script>

</body>
</html>
