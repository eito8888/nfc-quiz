<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>回答画面（最強B完成版）</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 0;
}

#chosen {
  font-size: 36px;
  font-weight: bold;
  padding: 15px;
  margin: 15px;
  border: 3px solid black;
  border-radius: 15px;
}

/* ボタン配置（横4列） */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 20px;
}

/* ★電卓型：押しやすい正方形 */
button {
  width: 100%;
  aspect-ratio: 1 / 1;
  font-size: 46px;
  font-weight: bold;
  color: black;
  background: #ffe066;
  border-radius: 18px;
}
</style>
</head>

<body>

<div id="chosen">番号を選んでください</div>

<div class="grid" id="buttons"></div>

<script>
/* ★初回だけあだ名入力 */
let player = localStorage.getItem("player");
if (!player) {
  player = prompt("名前（あだ名）を入力してください");
  localStorage.setItem("player", player);
}

/* 表示 */
const chosenDiv = document.getElementById("chosen");
const btnArea = document.getElementById("buttons");

/* ボタン生成 */
for (let i = 1; i <= 10; i++) {

  const btn = document.createElement("button");
  btn.innerText = i;

  btn.onclick = () => {
    localStorage.setItem("selectedNumber", i);
    chosenDiv.innerText = `🎯 選択中：${i}番`;
  };

  btnArea.appendChild(btn);
}
</script>

</body>
</html>
