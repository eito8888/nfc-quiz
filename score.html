<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>正解数一覧</title>

<style>

body{

    font-family:sans-serif;
    background:#ffffff;
    text-align:center;

}

h1{

    font-size:50px;
    margin-top:30px;

}

pre{

    text-align:left;
    font-size:22px;
    width:90%;
    margin:auto;
    border:1px solid #999;
    padding:20px;
    background:#f5f5f5;

}

</style>

</head>

<body>

<h1>★★★★ 正解数一覧 ★★★★</h1>

<pre id="result">読込み中...</pre>

<script>

const GAS_URL=https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec

fetch(GAS_URL+"?mode=score")

.then(r=>r.json())

.then(data=>{

document.getElementById("result").innerText=
JSON.stringify(data,null,2);

})

.catch(e=>{

document.getElementById("result").innerText=e;

});

</script>

</body>

</html>
