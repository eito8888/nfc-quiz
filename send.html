<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>
<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding-top:25px;
  margin:0
}
h1{
  font-size:42px;
  margin:0 0 18px
}
#msg{
  font-size:38px;
  font-weight:bold;
  margin-top:10px
}
#debug{
  margin:18px auto 0;
  font-size:24px;
  line-height:1.22;
  font-weight:bold;
  white-space:pre-line;
  text-align:left;
  padding:0 12px;
  max-width:900px
}
</style>
</head>

<body>

<h1 id="msg">📡 送信中…</h1>
<div id="debug"></div>

<script>

const GAS_URL="https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msgDiv=document.getElementById("msg");
const debugDiv=document.getElementById("debug");

const player=localStorage.getItem("player");
const selected=localStorage.getItem("selectedNumber");

const params=new URLSearchParams(location.search);

const dog=params.get("dog");
const number=params.get("number");
const tagStage=params.get("stage");

const sendNumber=number||dog;

const sendKey=
  "sending_"+
  String(player||"")+"_"+
  String(selected||"")+"_"+
  String(sendNumber||"")+"_"+
  String(tagStage||"");


/*
=========================================================
今回の変更①
requestIdは「1回の送信ごと」に必ず新しく作る
=========================================================
*/

let requestId=
  (window.crypto&&crypto.randomUUID)
    ? crypto.randomUUID()
    : ("req_"+Date.now()+"_"+Math.random().toString(36).slice(2));


function saveSendRecord(record){

  try{

    const key="NFC_SEND_HISTORY";

    let history=
      JSON.parse(
        localStorage.getItem(key)||"[]"
      );

    history.push(record);

    if(history.length>100){
      history=history.slice(-100);
    }

    localStorage.setItem(
      key,
      JSON.stringify(history)
    );

  }catch(e){

    console.error("【診断保存ERROR】",e);

  }

}


function saveLastDiagnostic(record){

  try{

    localStorage.setItem(
      "NFC_LAST_DIAGNOSTIC",
      JSON.stringify(record)
    );

  }catch(e){

    console.error("【診断保存ERROR】",e);

  }

}


function showDiagnostic(lines){

  debugDiv.innerText=
    lines.join("\n");

}


function ms(v){

  return
    typeof v==="number" &&
    Number.isFinite(v)
      ? Math.round(v)
      : "取得不可";

}


function getBrowserState(){

  let c=null;

  try{

    c=
      navigator.connection ||
      navigator.mozConnection ||
      navigator.webkitConnection;

  }catch(e){}

  return{

    online:navigator.onLine,

    visibility:
      document.visibilityState,

    readyState:
      document.readyState,

    effectiveType:
      c&&c.effectiveType
        ? c.effectiveType
        : "",

    downlink:
      c&&typeof c.downlink==="number"
        ? c.downlink
        : null,

    rtt:
      c&&typeof c.rtt==="number"
        ? c.rtt
        : null,

    saveData:
      c&&typeof c.saveData==="boolean"
        ? c.saveData
        : null,

    userAgent:
      navigator.userAgent

  };

}


function browserLines(s){

  return [

    "【スマホ・ブラウザ状態】",

    "navigator.onLine："+
      String(s.online),

    "画面状態："+
      String(s.visibility),

    "document.readyState："+
      String(s.readyState),

    "通信方式："+
      (s.effectiveType||"取得不可"),

    "推定下り速度："+
      (
        s.downlink!==null
          ? s.downlink+" Mbps"
          : "取得不可"
      ),

    "推定RTT："+
      (
        s.rtt!==null
          ? s.rtt+" ms"
          : "取得不可"
      ),

    "SaveData："+
      (
        s.saveData!==null
          ? String(s.saveData)
          : "取得不可"
      )

  ];

}


function getResourceTiming(target){

  try{

    const entries=
      performance.getEntriesByType("resource");

    const list=
      entries.filter(
        e=>e.name.indexOf(target)===0
      );

    if(!list.length){
      return null;
    }

    list.sort(
      (a,b)=>
        b.startTime-a.startTime
    );

    const e=list[0];

    return{

      startTime:e.startTime,

      duration:e.duration,

      redirectStart:e.redirectStart,

      redirectEnd:e.redirectEnd,

      workerStart:e.workerStart,

      fetchStart:e.fetchStart,

      domainLookupStart:
        e.domainLookupStart,

      domainLookupEnd:
        e.domainLookupEnd,

      connectStart:
        e.connectStart,

      connectEnd:
        e.connectEnd,

      secureConnectionStart:
        e.secureConnectionStart,

      requestStart:
        e.requestStart,

      responseStart:
        e.responseStart,

      responseEnd:
        e.responseEnd,

      transferSize:
        e.transferSize,

      encodedBodySize:
        e.encodedBodySize,

      decodedBodySize:
        e.decodedBodySize,

      nextHopProtocol:
        e.nextHopProtocol||"",

      initiatorType:
        e.initiatorType||""

    };

  }catch(e){

    return null;

  }

}


function resourceLines(rt){

  if(!rt){

    return[
      "【ブラウザ通信計測】",
      "Resource Timing：記録なし"
    ];

  }

  return[

    "【ブラウザ通信計測】",

    "Resource開始："+
      ms(rt.startTime)+" ms",

    "Resource duration："+
      ms(rt.duration)+" ms",

    "fetchStart："+
      ms(rt.fetchStart)+" ms",

    "DNS開始："+
      ms(rt.domainLookupStart)+" ms",

    "DNS終了："+
      ms(rt.domainLookupEnd)+" ms",

    "接続開始："+
      ms(rt.connectStart)+" ms",

    "接続終了："+
      ms(rt.connectEnd)+" ms",

    "TLS開始："+
      ms(rt.secureConnectionStart)+" ms",

    "HTTP request開始："+
      ms(rt.requestStart)+" ms",

    "HTTP response開始："+
      ms(rt.responseStart)+" ms",

    "HTTP response終了："+
      ms(rt.responseEnd)+" ms",

    "転送サイズ："+
      ms(rt.transferSize)+" bytes",

    "protocol："+
      (rt.nextHopProtocol||"取得不可"),

    "initiator："+
      (rt.initiatorType||"取得不可")

  ];

}


/*
=========================================================
URL作成
=========================================================
*/

function makeUrl(){

  return `${GAS_URL}?player=${encodeURIComponent(player)}`+
    `&selected=${encodeURIComponent(selected)}`+
    `&number=${encodeURIComponent(sendNumber)}`+
    `&tagStage=${encodeURIComponent(tagStage)}`+
    `&clientSendMs=${encodeURIComponent(window.__sendStartMs)}`+
    `&requestId=${encodeURIComponent(requestId)}`+
    `&_=${Date.now()}_${Math.random().toString(36).slice(2)}`;

}


/*
=========================================================
今回の変更②
通信を1本だけ待つのではなく、
2本目を2秒後に開始する
=========================================================
*/

function send(){

  const measureStart=
    performance.now();

  const sendStartMs=
    Date.now();

  window.__sendStartMs=
    sendStartMs;

  const startTime=
    new Date(sendStartMs).toISOString();

  const browserState=
    getBrowserState();

  console.log(
    "【SEND開始】",
    sendStartMs,
    player,
    selected,
    sendNumber,
    tagStage,
    requestId
  );


  msgDiv.innerText=
    "📡 送信中…";


  /*
  二重タップ防止
  */

  if(
    sessionStorage.getItem(sendKey)==="sending"
  ){

    debugDiv.innerText=
      "二重送信防止";

    return;

  }


  sessionStorage.setItem(
    sendKey,
    "sending"
  );


  const fetchStartMs=
    Date.now();

  const fetchStart=
    performance.now();


  const sendToFetchMs=
    Math.max(
      0,
      fetchStartMs-sendStartMs
    );


  console.log(
    "【SEND送信→fetch開始】",
    sendToFetchMs+" ms"
  );


  const firstUrl=
    makeUrl();


  /*
  =======================================================
  通信1本目
  =======================================================
  */

  let finished=false;

  const controllers=[];


  function finishWithSuccess(
    response,
    responseNumber
  ){

    if(finished){

      return null;

    }

    finished=true;


    controllers.forEach(
      controller=>{

        try{

          controller.abort();

        }catch(e){}

      }
    );


    const responseMs=
      Date.now();

    const responseElapsed=
      performance.now()-measureStart;


    window.__sendResponseMs=
      responseMs;

    window.__sendResponseElapsed=
      responseElapsed;

    window.__sendResponseStatus=
      response.status;


    console.log(
      "【SEND GAS応答】",
      "通信"+responseNumber,
      response.status,
      responseMs,
      responseElapsed
    );


    if(!response.ok){

      throw new Error(
        "HTTP "+response.status
      );

    }


    return response.json();

  }


  function handleData(
    data,
    responseNumber
  ){

    if(!data){

      throw new Error(
        "GAS response empty"
      );

    }


    const jsonEnd=
      performance.now();

    const jsonEndMs=
      Date.now();

    const fetchTime=
      jsonEnd-fetchStart;


    const gasReceiveMs=
      Number(data.gasReceiveMs)||0;

    const gasCompleteMs=
      Number(data.gasCompleteMs)||0;


    const answerId=
      String(
        data.answerId||""
      ).trim();


    const gasInternalMs=
      (
        gasReceiveMs &&
        gasCompleteMs
      )
        ? gasCompleteMs-gasReceiveMs
        : 0;


    const fetchToGasReceiveMs=
      (
        gasReceiveMs &&
        fetchStartMs
      )
        ? Math.max(
            0,
            Math.round(
              gasReceiveMs-fetchStartMs
            )
          )
        : 0;


    const sendToGasReceiveMs=
      gasReceiveMs
        ? Math.max(
            0,
            Math.round(
              gasReceiveMs-sendStartMs
            )
          )
        : 0;


    const gasCompleteToResponseMs=
      (
        gasCompleteMs &&
        window.__sendResponseMs
      )
        ? Math.round(
            window.__sendResponseMs-
            gasCompleteMs
          )
        : 0;


    const gasOutsideMs=
      Math.max(
        0,
        Math.round(
          fetchTime-gasInternalMs
        )
      );


    const sentDisplayMs=
      Date.now();


    const sendDisplayTime=
      performance.now()-
      measureStart;


    const responseElapsed=
      window.__sendResponseElapsed||0;


    const jsonParseMs=
      Math.max(
        0,
        Math.round(
          jsonEnd-
          (
            measureStart+
            responseElapsed
          )
        )
      );


    const rt=
      getResourceTiming(GAS_URL);

    const bs=
      getBrowserState();

    const status=
      window.__sendResponseStatus;


    /*
    ================================================
    「送信しました」は成功した通信の結果だけ
    ================================================
    */

    msgDiv.innerText=
      "📩 送信しました！";


    showDiagnostic([

      "【今回の送信診断】",

      "成功した通信："+responseNumber,

      "answerId："+answerId,

      "requestId："+requestId,

      "送信開始 → fetch開始："+
        sendToFetchMs+" ms",

      "fetch開始 → GAS受信："+
        fetchToGasReceiveMs+" ms",

      "fetch開始 → GAS応答："+
        Math.round(fetchTime)+" ms",

      "送信開始 → GAS受信（目安）："+
        sendToGasReceiveMs+" ms",

      "GAS受信 → GAS処理完了："+
        Math.round(gasInternalMs)+" ms",

      "GAS処理完了 → HTTP応答（目安）："+
        gasCompleteToResponseMs+" ms",

      "GAS外の時間："+
        gasOutsideMs+" ms",

      "送信開始 →「送信しました」："+
        Math.round(sendDisplayTime)+" ms",

      "HTTP："+status,

      "JSON解析："+jsonParseMs+" ms",

      ...browserLines(bs),

      ...resourceLines(rt)

    ]);


    const diagnostic={

      result:"GAS_RESPONSE",

      time:startTime,

      sendStartMs,

      fetchStartMs,

      requestId,

      responseMs:
        window.__sendResponseMs||0,

      jsonEndMs,

      sentDisplayMs,

      answerId,

      player,

      selected,

      dog,

      number:sendNumber,

      tagStage,

      fetchMs:
        Math.round(fetchTime),

      sendToFetchMs,

      fetchToGasReceiveMs,

      gasInternalMs:
        Math.round(gasInternalMs),

      sendToGasReceiveMs,

      gasCompleteToResponseMs,

      gasOutsideMs,

      sendToDisplayMs:
        Math.round(sendDisplayTime),

      httpStatus:status,

      jsonParseMs,

      responseNumber,

      browserState:bs,

      resourceTiming:rt

    };


    saveLastDiagnostic(
      diagnostic
    );

    saveSendRecord(
      diagnostic
    );


    /*
    「送信しました」の時刻をGASへ記録
    これは画面表示を止めない
    */

    if(answerId){

      const displayUrl=
        `${GAS_URL}?event=sentDisplay`+
        `&answerId=${encodeURIComponent(answerId)}`+
        `&sentDisplayMs=${encodeURIComponent(sentDisplayMs)}`+
        `&_=${Date.now()}`;

      fetch(
        displayUrl,
        {
          method:"GET",
          cache:"no-store",
          keepalive:true
        }
      ).catch(
        e=>
          console.error(
            "【SEND sentDisplay送信エラー】",
            e
          )
      );

    }


    /*
    成功後15秒待ってから戻す処理は残す。
    これは15秒通信待ちではなく、
    「送信しました」を表示している時間。
    */

    setTimeout(
      ()=>{
        location.href="player.html";
      },
      15000
    );

  }


  function startRequest(
    requestNumber,
    url
  ){

    const controller=
      new AbortController();

    controllers.push(
      controller
    );


    console.log(
      "【通信開始】",
      requestNumber,
      Date.now(),
      requestId
    );


    return fetch(
      url,
      {
        method:"GET",
        cache:"no-store",
        signal:controller.signal
      }
    )
    .then(
      response=>
        finishWithSuccess(
          response,
          requestNumber
        )
    )
    .then(
      data=>{

        if(data){

          handleData(
            data,
            requestNumber
          );

          return true;

        }

        return false;

      }
    );

  }


  /*
  1本目を即開始
  */

  const firstPromise=
    startRequest(
      1,
      firstUrl
    );


  /*
  =======================================================
  2本目
  2秒待っても1本目が完了していなければ開始
  =======================================================
  */

  setTimeout(
    ()=>{

      if(finished){

        return;

      }


      const secondUrl=
        makeUrl();


      console.log(
        "【通信救済開始】",
        "2本目",
        Date.now(),
        requestId
      );


      startRequest(
        2,
        secondUrl
      )
      .catch(
        error=>{

          console.error(
            "【通信2 ERROR】",
            error
          );

        }
      );

    },
    2000
  );


  /*
  =======================================================
  通信1のエラー
  通信2が動いているので、
  ここでは画面を終了させない
  =======================================================
  */

  firstPromise.catch(
    error=>{

      if(finished){

        return;

      }


      console.error(
        "【通信1 ERROR】",
        error
      );


      showDiagnostic([

        "【送信診断】",

        "通信1でエラー",

        "requestId："+requestId,

        "通信2を継続して待機しています。",

        "error："+String(error)

      ]);

    }
  );

}


send();

</script>

</body>
</html>
