<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>犬クイズ モニター</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      padding: 20px;
    }

    .cell {
      border: 2px solid #999;
      border-radius: 10px;
      padding: 10px;
      min-height: 120px;
      font-size: 18px;
    }

    .answered {
      background: #d4f8d4;
      font-weight: bold;
    }

    img {
      margin-top: 8px;
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h1>🐶 犬クイズ</h1>

<div id="grid" class="grid"></div>

<script>
/* ★あなたのGAS URLをここに入れる */
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbysC8_DE3KENuaTbOynEviquqjhPVcSCxXo6zIREjkKnVrYrHdLey4vH0G8ARhHPPOo/exec";

/* モニター更新処理 */
async function load() {

  const res = await fetch(GAS_URL + "?mode=monitor");
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  data.questions.forEach(q => {

    const num  = q[0];   // A列 number
    const name = q[1];   // B列 name
    const img  = q[2];   // C列 image（なくてもOK）

    const div = document.createElement("div");
    div.className = "cell";

    /* 通常表示 */
    div.innerHTML = `
      <div>【${num}】</div>
      <div>${name}</div>
    `;

    /* 正解していたら表示を変える */
    if (data.correctMap[num]) {
      div.classList.add("answered");
      div.innerHTML += `<div>✅ 正解！</div>`;

      /* 写真が設定されていれば表示 */
      if (img) {
        div.innerHTML += `<img src="images/${img}">`;
      }
    }

    grid.appendChild(div);
  });
}

/* 最初に読み込み */
load();

/* 3秒ごとに更新（リアルタイム風） */
setInterval(load, 3000);

</script>

</body>
</html>
