<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クイズモニター</title>

<style>
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h1 {
  margin: 20px 0;
  font-size: 36px;
  color: #333;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding: 10px;
}

.cell {
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  padding: 15px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.answerLine {
  margin-top: 10px;
  color: green;
  font-size: 16px;
  font-weight: bold;
}

img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  margin-top: 10px;
}

.score-container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  padding: 30px;
}

.score-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.score-table th {
  background-color: #ff9800;
  color: white;
  font-size: 24px;
  padding: 15px;
}

.score-table td {
  padding: 18px 20px;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 1px solid #eee;
  color: #333;
}

.score-num {
  color: #e65100;
  font-size: 32px;
}
</style>
</head>

<body>

<h1 id="mainTitle">クイズ</h1>

<div id="displayArea"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";


/* =========================================================
   写真先読み
   ========================================================= */

const preloadedImages = new Map();

function preloadImage(src) {

  if (!src || preloadedImages.has(src)) {
    return;
  }

  const img = new Image();

  img.src = src;

  preloadedImages.set(src, img);
}


/* =========================================================
   原因追及用
   ========================================================= */

const HISTORY_KEY =
"NFC_MONITOR_DIAGNOSTIC_HISTORY";

const seenAnswers = new Set();

let initialized = false;

let targetAnswerKey = null;

let targetRecord = null;

let targetPhotoDone = false;


/* =========================================================
   自動保存
   ========================================================= */

function saveDiagnostic(record) {

  let history = [];

  try {

    history = JSON.parse(
      localStorage.getItem(HISTORY_KEY) || "[]"
    );

  } catch (e) {

    history = [];

  }

  history.push(record);

  if (history.length > 100) {

    history = history.slice(-100);

  }

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );
}


/* =========================================================
   回答キー
   ========================================================= */

function makeAnswerKey(row) {

  return row.map(
    v => String(v)
  ).join("|");

}


/* =========================================================
   メイン
   ========================================================= */

async function load() {

  const loadStart =
    performance.now();

  const fetchStart =
    performance.now();

  try {

    const res = await fetch(
      GAS_URL + "?_=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    const fetchEnd =
      performance.now();

    const data =
      await res.json();

    const jsonEnd =
      performance.now();


    const gasFetchTime =
      fetchEnd - fetchStart;

    const jsonTime =
      jsonEnd - fetchEnd;


    console.log(
      "【MONITOR計測】",
      "GAS取得=" +
      Math.round(gasFetchTime) +
      "ms",
      "JSON解析=" +
      Math.round(jsonTime) +
      "ms"
    );


    const displayArea =
      document.getElementById(
        "displayArea"
      );


    const currentStage =
      Number(data.currentStage);


    /* =====================================================
       初回読み込み
       既存回答は履歴として登録
       ===================================================== */

    if (!initialized) {

      if (data.answers) {

        data.answers.forEach(row => {

          seenAnswers.add(
            makeAnswerKey(row)
          );

        });

      }

      initialized = true;

      console.log(
        "【原因追及】初期化完了",
        "既存回答=" +
        seenAnswers.size +
        "件"
      );

    }


    /* =====================================================
       新しい回答を検知
       ===================================================== */

    if (
      !targetAnswerKey &&
      data.answers
    ) {

      for (
        const row of data.answers
      ) {

        const answerKey =
          makeAnswerKey(row);


        if (
          !seenAnswers.has(answerKey)
        ) {

          seenAnswers.add(answerKey);


          const detectTime =
            performance.now();


          const correct =
            (
              row[3] === true ||
              row[3] === "TRUE" ||
              row[3] === "true"
            );


          targetAnswerKey =
            answerKey;


          targetRecord = {

            recordTime:
              new Date().toISOString(),

            player:
              String(row[0]).trim(),

            selected:
              String(row[1]).trim(),

            dog:
              String(row[2]).trim(),

            correct:
              correct,

            stage:
              String(row[4]).trim(),

            gasTimestamp:
              row[5],

            monitorFetchMs:
              Math.round(gasFetchTime),

            jsonParseMs:
              Math.round(jsonTime),

            loadToDetectMs:
              Math.round(
                detectTime - loadStart
              ),

            detectPerformanceMs:
              Math.round(detectTime)

          };


          console.log(
            "================================"
          );

          console.log(
            "【原因追及 START】"
          );

          console.log(
            "番号=" +
            targetRecord.selected
          );

          console.log(
            "player=" +
            targetRecord.player
          );

          console.log(
            "correct=" +
            targetRecord.correct
          );

          console.log(
            "stage=" +
            targetRecord.stage
          );

          console.log(
            "GAS回答記録時刻=",
            targetRecord.gasTimestamp
          );

          console.log(
            "モニターGAS取得=" +
            targetRecord.monitorFetchMs +
            "ms"
          );

          console.log(
            "JSON解析=" +
            targetRecord.jsonParseMs +
            "ms"
          );

          console.log(
            "今回load開始→回答検知=" +
            targetRecord.loadToDetectMs +
            "ms"
          );

          console.log(
            "【原因追及】今回の1回答を追跡"
          );

          console.log(
            "================================"
          );


          break;

        }

      }

    }


    /* =====================================================
       写真先読み
       ===================================================== */

    if (data.questions) {

      data.questions.forEach(q => {

        const stage =
          String(q[0]).trim();

        const img =
          q[5];


        if (
          stage ===
          String(currentStage).trim() &&
          img
        ) {

          preloadImage(
            "images/" + img
          );

        }

      });

    }


    /* =====================================================
       Stage = 0
       ===================================================== */

    if (currentStage === 0) {

      document.getElementById(
        "mainTitle"
      ).innerText =
        "🎉 イベント結果発表 🎉";


      if (
        !data.scoreList ||
        data.scoreList.length === 0
      ) {

        displayArea.innerHTML =
          `<div class="score-container">
             <h2>まだ回答データがありません</h2>
           </div>`;

        return;
      }


      let tableRows = "";


      data.scoreList.forEach(item => {

        tableRows += `
          <tr>
            <td style="text-align:left;padding-left:50px;">
              ${item.player}
            </td>

            <td style="text-align:right;padding-right:50px;">
              <span class="score-num">
                ${item.total}
              </span> 点
            </td>
          </tr>
        `;

      });


      displayArea.innerHTML = `
        <div class="score-container">

          <table class="score-table">

            <thead>
              <tr>
                <th>ニックネーム</th>
                <th>合計得点</th>
              </tr>
            </thead>

            <tbody>
              ${tableRows}
            </tbody>

          </table>

        </div>
      `;

      return;

    }


    /* =====================================================
       正解マップ
       ===================================================== */

    let correctMap = {};

    let stageTitle = "クイズ";


    if (data.answers) {

      data.answers.forEach(row => {

        const player =
          String(row[0]).trim();

        const selected =
          String(row[1]).trim();

        const correct =
          row[3];

        const stage =
          String(row[4]).trim();


        const isCorrect =
          (
            correct === true ||
            correct === "TRUE" ||
            correct === "true"
          );


        if (isCorrect) {

          const key =
            stage + "-" + selected;


          if (!correctMap[key]) {

            correctMap[key] =
              player;

          }

        }

      });

    }


    /* =====================================================
       HTML構築
       ===================================================== */

    const htmlBuildStart =
      performance.now();


    let gridHTML =
      '<div class="grid">';


    if (data.questions) {

      data.questions.forEach(q => {

        const stage =
          String(q[0]).trim();

        const number =
          String(q[1]).trim();

        const title =
          q[3];

        const name =
          q[4];

        const img =
          q[5];


        if (
          stage !==
          String(currentStage).trim()
        ) {

          return;

        }


        stageTitle =
          title || "クイズ";


        const key =
          stage + "-" + number;


        let cellContent =
          `<div class="title">
             【${number}】${name}
           </div>`;


        if (correctMap[key]) {

          cellContent += `
            <div class="answerLine">
              ✅正解 → ${correctMap[key]}
            </div>
          `;


          if (img) {

            const imageSrc =
              "images/" + img;


            cellContent += `
              <img
                src="${
                  preloadedImages.get(
                    imageSrc
                  )?.src ||
                  imageSrc
                }"
                data-monitor-image="${imageSrc}"
                data-monitor-key="${key}"
              >
            `;

          }

        }


        gridHTML +=
          `<div class="cell">
             ${cellContent}
           </div>`;

      });

    }


    gridHTML +=
      "</div>";


    const htmlBuildEnd =
      performance.now();


    /* =====================================================
       画面反映
       ===================================================== */

    const renderStart =
      performance.now();


    displayArea.innerHTML =
      gridHTML;


    document.getElementById(
      "mainTitle"
    ).innerText =
      stageTitle;


    const renderEnd =
      performance.now();


    /* =====================================================
       今回の回答の写真を追跡
       ===================================================== */

    if (
      targetRecord &&
      targetRecord.correct &&
      !targetPhotoDone
    ) {

      const targetKey =
        targetRecord.stage +
        "-" +
        targetRecord.selected;


      const targetImage =
        displayArea.querySelector(
          `img[data-monitor-key="${targetKey}"]`
        );


      if (targetImage) {

        const photoStart =
          performance.now();


        const finishPhoto =
          () => {

            if (targetPhotoDone) {
              return;
            }


            targetPhotoDone =
              true;


            const photoEnd =
              performance.now();


            const detectToPhoto =
              photoEnd -
              targetRecord.detectPerformanceMs;


            const photoWait =
              photoEnd -
              photoStart;


            const record = {

              ...targetRecord,

              htmlBuildMs:
                Math.round(
                  htmlBuildEnd -
                  htmlBuildStart
                ),

              renderMs:
                Math.round(
                  renderEnd -
                  renderStart
                ),

              detectToPhotoMs:
                Math.round(
                  detectToPhoto
                ),

              photoWaitMs:
                Math.round(
                  photoWait
                ),

              completedAt:
                new Date().toISOString()

            };


            saveDiagnostic(record);


            console.log(
              "================================"
            );

            console.log(
              "【原因追及 PHOTO】"
            );

            console.log(
              "番号=" +
              record.selected
            );

            console.log(
              "モニターGAS取得=" +
              record.monitorFetchMs +
              "ms"
            );

            console.log(
              "JSON解析=" +
              record.jsonParseMs +
              "ms"
            );

            console.log(
              "回答検知→写真=" +
              record.detectToPhotoMs +
              "ms"
            );

            console.log(
              "写真待ち=" +
              record.photoWaitMs +
              "ms"
            );

            console.log(
              "HTML構築=" +
              record.htmlBuildMs +
              "ms"
            );

            console.log(
              "画面反映=" +
              record.renderMs +
              "ms"
            );

            console.log(
              "【原因追及 END】"
            );

            console.log(
              "自動保存済み"
            );

            console.log(
              "================================"
            );

          };


        if (
          targetImage.complete
        ) {

          finishPhoto();

        } else {

          targetImage.addEventListener(
            "load",
            finishPhoto,
            { once: true }
          );


          targetImage.addEventListener(
            "error",
            () => {

              console.error(
                "【今回回答 PHOTOエラー】",
                targetImage.src
              );

            },
            { once: true }
          );

        }

      }

    }


  } catch (error) {

    console.error(
      "【MONITORエラー】",
      error
    );

  }

}


/* =========================================================
   1秒ごとに更新
   ========================================================= */

async function monitorLoop() {

  await load();

  setTimeout(
    monitorLoop,
    1000
  );

}


monitorLoop();

</script>

</body>
</html>
