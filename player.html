<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>回答画面（最強B方式）</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 0;
}

/* 選択中表示 */
#chosen {
  font-size: 34px;
  font-weight: bold;
  padding: 15px;
  margin: 15px;
  border: 3px solid black;
  border-radius: 15px;
}

/* ボタン配置（横4列） */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 20px;
}

/* ★電卓型：正方形ボタン */
button {
  font-size: 32px;
  border-radius: 18px;
  width: 100%;
  aspect-ratio: 1 / 1;   /* 正方形 */
}
</style>
</head>

<body>

<div id="chosen">番号を選んでください</div>

<div class="grid" id="buttons"></div>

<script>
/* プレイヤー名（あだ名） */
let player = localStorage.getItem("player");

if (!player) {
  player = prompt("名前（あだ名）を入力してください");
  localStorage.setItem("player", player);
}

/* 表示 */
const chosenDiv = document.getElementById("chosen");
const btnArea = document.getElementById("buttons");

/* ボタン生成（1〜10） */
for (let i = 1; i <= 10; i++) {

  const btn = document.createElement("button");
  btn.innerText = i;

  btn.onclick = () => {

    /* ★選択番号を保存 */
    localStorage.setItem("selectedNumber", i);

    /* 表示更新 */
    chosenDiv.innerText = `🎯 選択中：${i}番`;

  };

  btnArea.appendChild(btn);
}
</script>

</body>
</html>
