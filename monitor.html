<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クイズモニター</title>

<style>
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h1 {
  margin: 20px 0;
  font-size: 36px;
  color: #333;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding: 10px;
}

.cell {
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  padding: 15px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.answerLine {
  margin-top: 10px;
  color: green;
  font-size: 16px;
  font-weight: bold;
}

img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  margin-top: 10px;
}

.score-container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  padding: 30px;
}

.score-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.score-table th {
  background-color: #ff9800;
  color: white;
  font-size: 24px;
  padding: 15px;
}

.score-table th:first-child {
  border-radius: 10px 0 0 0;
}

.score-table th:last-child {
  border-radius: 0 10px 0 0;
}

.score-table td {
  padding: 18px 20px;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 1px solid #eee;
  color: #333;
}

.score-table tr:nth-child(even) {
  background-color: #fafafa;
}

.score-num {
  color: #e65100;
  font-size: 32px;
}
</style>

</head>

<body>

<h1 id="mainTitle">クイズ</h1>

<div id="displayArea"></div>


<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";


/* =========================================================
   写真先読み
   ========================================================= */

const preloadedImages =
  new Map();


function preloadImage(src) {

  if (
    !src ||
    preloadedImages.has(src)
  ) {
    return;
  }


  const img =
    new Image();


  img.src =
    src;


  preloadedImages.set(
    src,
    img
  );

}


/* =========================================================
   原因追及用
   ========================================================= */

/*
   ページを開いた時点で
   すでに存在している回答ID
*/

if (!window.seenAnswerIds) {

  window.seenAnswerIds =
    new Set();

}


/*
   現在追跡している回答

   answerId → diagnostic
*/

if (!window.diagnosticAnswers) {

  window.diagnosticAnswers =
    new Map();

}


/*
   timing_log送信済みanswerId
*/

if (!window.monitorTimingSent) {

  window.monitorTimingSent =
    new Set();

}


/*
   初回load判定
*/

if (
  typeof window.monitorInitialized ===
  "undefined"
) {

  window.monitorInitialized =
    false;

}


/* =========================================================
   Monitor計測をGASへ保存
   ========================================================= */

function sendMonitorTiming(
  answerId,
  monitorFetchMs,
  trueDisplayMs,
  photoDisplayMs
) {

  if (!answerId) {
    return;
  }


  if (
    window.monitorTimingSent
      .has(answerId)
  ) {

    return;
  }


  const url =
    GAS_URL +
    "?event=monitorTiming" +
    "&answerId=" +
    encodeURIComponent(answerId) +
    "&monitorFetchMs=" +
    encodeURIComponent(monitorFetchMs) +
    "&trueDisplayMs=" +
    encodeURIComponent(trueDisplayMs) +
    "&photoDisplayMs=" +
    encodeURIComponent(photoDisplayMs) +
    "&_=" +
    Date.now();


  fetch(
    url,
    {
      method: "GET",
      cache: "no-store"
    }
  )

  .then(
    () => {

      window.monitorTimingSent
        .add(answerId);


      console.log(
        "【原因追及 timing_log送信完了】",
        "answerId=" +
        answerId
      );

    }
  )

  .catch(
    error => {

      console.error(
        "【原因追及 timing_log送信エラー】",
        error
      );

    }
  );

}


/* =========================================================
   メイン処理
   ========================================================= */

async function load() {

  const loadStart =
    performance.now();


  try {

    /* -----------------------------------------
       ① GAS通信
       ----------------------------------------- */

    const fetchStart =
      performance.now();

    const fetchStartWallMs =
      Date.now();


    const res =
      await fetch(
        GAS_URL,
        {
          cache: "no-store"
        }
      );


    const fetchEnd =
      performance.now();

    const fetchEndWallMs =
      Date.now();


    /* -----------------------------------------
       ② JSON解析
       ----------------------------------------- */

    const data =
      await res.json();


    const jsonEnd =
      performance.now();


    const gasFetchTime =
      fetchEnd -
      fetchStart;


    const jsonTime =
      jsonEnd -
      fetchEnd;


    const dataReceiveTime =
      jsonEnd -
      loadStart;


    /*
       JSONを完全に受け取った瞬間
    */

    const monitorFetchMs =
      Date.now();


    console.log(
      "【MONITOR計測】",
      "GAS取得=" +
      Math.round(gasFetchTime) +
      "ms",
      "JSON解析=" +
      Math.round(jsonTime) +
      "ms",
      "データ受信完了=" +
      Math.round(dataReceiveTime) +
      "ms"
    );


    const displayArea =
      document.getElementById(
        "displayArea"
      );


    const currentStage =
      Number(
        data.currentStage
      );


    /* -----------------------------------------
       写真先読み
       ----------------------------------------- */

    if (data.questions) {

      data.questions.forEach(
        q => {

          const stage =
            String(q[0]).trim();


          const img =
            q[5];


          if (
            stage ===
            String(currentStage).trim()
            &&
            img
          ) {

            preloadImage(
              "images/" + img
            );

          }

        }
      );

    }


    /* =====================================================
       Stage = 0
       ===================================================== */

    if (
      currentStage === 0
    ) {

      document
        .getElementById("mainTitle")
        .innerText =
          "🎉 イベント結果発表 🎉";


      if (
        !data.scoreList ||
        data.scoreList.length === 0
      ) {

        displayArea.innerHTML =
          `<div class="score-container">
             <h2>まだ回答データがありません</h2>
           </div>`;

        return;
      }


      let tableRows =
        "";


      data.scoreList.forEach(
        item => {

          tableRows += `
            <tr>
              <td style="text-align: left; padding-left: 50px;">
                ${item.player}
              </td>

              <td style="text-align: right; padding-right: 50px;">
                <span class="score-num">
                  ${item.total}
                </span> 点
              </td>
            </tr>
          `;

        }
      );


      displayArea.innerHTML = `
        <div class="score-container">

          <table class="score-table">

            <thead>

              <tr>

                <th style="text-align: left; padding-left: 50px;">
                  ニックネーム
                </th>

                <th style="text-align: right; padding-right: 50px;">
                  合計得点
                </th>

              </tr>

            </thead>

            <tbody>
              ${tableRows}
            </tbody>

          </table>

        </div>
      `;


      return;
    }


    /* =====================================================
       Stage > 0
       ===================================================== */

    let stageTitle =
      "クイズ";


    let correctMap =
      {};


    /*
       今回新しく発見した回答
    */

    const newDiagnostics =
      [];


    /* =====================================================
       回答データ確認
       ===================================================== */

    if (data.answers) {

      data.answers.forEach(
        row => {

          const player =
            String(
              row[0]
            ).trim();


          const selected =
            String(
              row[1]
            ).trim();


          const correct =
            row[3];


          const stage =
            String(
              row[4]
            ).trim();


          /*
             answersの8列目
             row[7] = answerId
          */

          const answerId =
            String(
              row[7] || ""
            ).trim();


          const isCorrect =
            (
              correct === true ||
              correct === "TRUE" ||
              correct === "true"
            );


          /*
             画面表示用の正解
          */

          if (isCorrect) {

            const key =
              stage +
              "-" +
              selected;


            if (
              !correctMap[key]
            ) {

              correctMap[key] =
                player;

            }


            /*
               ------------------------------------------------
               重要
               ------------------------------------------------
               answerId単位で管理する。

               ただし初回loadでは、
               過去回答を計測しない。
               ------------------------------------------------
            */

            if (
              answerId &&
              !window.seenAnswerIds
                .has(answerId)
            ) {

              /*
                 新しい回答として発見
              */

              const diagnostic = {

                answerId:
                  answerId,

                player:
                  player,

                selected:
                  selected,

                stage:
                  stage,

                key:
                  key,

                monitorFetchMs:
                  monitorFetchMs,

                monitorFetchStartWallMs:
                  fetchStartWallMs,

                monitorFetchEndWallMs:
                  fetchEndWallMs,

                answerDetectedWallMs:
                  Date.now(),

                gasRecordWallMs:
                  Date.parse(row[6]),

                trueDisplayMs:
                  0,

                photoDisplayMs:
                  0,

                trueLogged:
                  false,

                photoLogged:
                  false

              };


              window.diagnosticAnswers
                .set(
                  answerId,
                  diagnostic
                );


              newDiagnostics.push(
                diagnostic
              );


              console.log(
                "【原因追及 START】"
              );


              console.log(
                "番号=" +
                selected
              );


              console.log(
                "player=" +
                player
              );


              console.log(
                "answerId=" +
                answerId
              );


              console.log(
                "GAS回答記録時刻=" +
                row[6]
              );


              console.log(
                "Monitor GAS取得=" +
                Math.round(
                  gasFetchTime
                ) +
                "ms"
              );


              const answerDetectedWallMs =
                diagnostic.answerDetectedWallMs;

              const fetchDurationMs =
                diagnostic.monitorFetchEndWallMs -
                diagnostic.monitorFetchStartWallMs;

              const fetchEndToDetectMs =
                answerDetectedWallMs -
                diagnostic.monitorFetchEndWallMs;

              const gasRecordToDetectMs =
                Number.isFinite(diagnostic.gasRecordWallMs)
                  ? answerDetectedWallMs - diagnostic.gasRecordWallMs
                  : null;

              console.log(
                "今回load開始→回答検知=" +
                Math.round(
                  performance.now() -
                  loadStart
                ) +
                "ms"
              );

              console.log(
                "Monitor fetch開始→完了=" +
                Math.round(fetchDurationMs) +
                "ms"
              );

              console.log(
                "fetch完了→回答検知=" +
                Math.round(fetchEndToDetectMs) +
                "ms"
              );

              console.log(
                "GAS記録→Monitor回答検知=" +
                (gasRecordToDetectMs === null
                  ? "計測不可"
                  : Math.round(gasRecordToDetectMs) +
                    "ms（端末時計差の影響あり）")
              );

              console.log(
                "【原因追及 区間判定】",
                "Monitor fetch=" +
                Math.round(fetchDurationMs) + "ms",
                "fetch後検知=" +
                Math.round(fetchEndToDetectMs) + "ms"
              );

            }

          }

        }
      );


      /*
         ------------------------------------------------
         初回load
         ------------------------------------------------

         この時点ですでに存在する
         全answerIdを「既知」にする。

         これが過去回答の誤計測防止。
      */

      if (
        !window.monitorInitialized
      ) {

        data.answers.forEach(
          row => {

            const answerId =
              String(
                row[7] || ""
              ).trim();


            if (answerId) {

              window.seenAnswerIds
                .add(answerId);

            }

          }
        );


        /*
           初回loadで作った
           newDiagnosticsは破棄
        */

        newDiagnostics.length =
          0;


        window.diagnosticAnswers
          .clear();


        window.monitorInitialized =
          true;


        console.log(
          "【原因追及】初回読み込み完了。既存回答は計測対象外"
        );

      }

    }


    /* =====================================================
       HTML構築
       ===================================================== */

    const htmlBuildStart =
      performance.now();


    let gridHTML =
      '<div class="grid">';


    if (data.questions) {

      data.questions.forEach(
        q => {

          const stage =
            String(q[0]).trim();


          const number =
            String(q[1]).trim();


          const title =
            q[3];


          const name =
            q[4];


          const img =
            q[5];


          if (
            stage !==
            String(currentStage).trim()
          ) {

            return;

          }


          stageTitle =
            title ||
            "クイズ";


          const key =
            stage +
            "-" +
            number;


          let cellContent =
            `<div class="title">
               【${number}】${name}
             </div>`;


          if (
            correctMap[key]
          ) {

            cellContent += `
              <div class="answerLine">
                ✅正解 → ${correctMap[key]}
              </div>
            `;


            if (img) {

              const imageSrc =
                "images/" +
                img;


              cellContent +=
                `<img
                  src="${
                    preloadedImages.get(
                      imageSrc
                    )?.src ||
                    imageSrc
                  }"
                  data-monitor-image="${imageSrc}"
                  data-answer-key="${key}"
                >`;

            }

          }


          gridHTML +=
            `<div class="cell">
               ${cellContent}
             </div>`;

        }
      );

    }


    gridHTML +=
      "</div>";


    const htmlBuildEnd =
      performance.now();


    /* =====================================================
       画面反映
       ===================================================== */

    const renderStart =
      performance.now();


    displayArea.innerHTML =
      gridHTML;


    document
      .getElementById("mainTitle")
      .innerText =
        stageTitle;


    const renderEnd =
      performance.now();


    /*
       このloadで新しく検知した回答の
       TRUE表示時刻

       画面反映直後。
    */

    const trueDisplayMs =
      Date.now();


    /*
       新回答すべてに
       TRUE時刻を設定
    */

    newDiagnostics.forEach(
      diagnostic => {

        diagnostic.trueDisplayMs =
          trueDisplayMs;


        diagnostic.trueLogged =
          true;


        console.log(
          "【原因追及 TRUE】"
        );


        console.log(
          "番号=" +
          diagnostic.selected
        );


        console.log(
          "answerId=" +
          diagnostic.answerId
        );


        console.log(
          "TRUE表示時刻=" +
          trueDisplayMs
        );


        console.log(
          "Monitor取得時刻=" +
          diagnostic.monitorFetchMs
        );

        console.log(
          "Monitor fetch時間=" +
          Math.round(
            diagnostic.monitorFetchEndWallMs -
            diagnostic.monitorFetchStartWallMs
          ) +
          "ms"
        );

        console.log(
          "fetch完了→TRUE=" +
          Math.round(
            diagnostic.trueDisplayMs -
            diagnostic.monitorFetchEndWallMs
          ) +
          "ms"
        );

      }
    );


    /* =====================================================
       写真
       ===================================================== */

    const imageElements =
      displayArea.querySelectorAll(
        "img[data-monitor-image]"
      );


    imageElements.forEach(
      img => {

        const imageSrc =
          img.getAttribute(
            "data-monitor-image"
          );


        const answerKey =
          img.getAttribute(
            "data-answer-key"
          );


        /*
           今回新しく検知した回答のうち、
           この番号に該当するものを探す
        */

        let diagnostic =
          null;


        for (
          let i = 0;
          i < newDiagnostics.length;
          i++
        ) {

          if (
            newDiagnostics[i].key ===
            answerKey
          ) {

            diagnostic =
              newDiagnostics[i];

            break;

          }

        }


        const imageStart =
          performance.now();


        const reportImageLoad =
          () => {

            /*
               新回答ではない写真は
               timing_logに送らない。
            */

            if (!diagnostic) {
              return;
            }


            if (
              diagnostic.photoLogged
            ) {

              return;

            }


            diagnostic.photoLogged =
              true;


            const imageEnd =
              performance.now();


            const imageLoadTime =
              imageEnd -
              imageStart;


            const totalTime =
              imageEnd -
              loadStart;


            const photoDisplayMs =
              Date.now();


            diagnostic.photoDisplayMs =
              photoDisplayMs;


            console.log(
              "==============================="
            );


            console.log(
              "【原因追及 PHOTO】"
            );


            console.log(
              "番号=" +
              diagnostic.selected
            );


            console.log(
              "answerId=" +
              diagnostic.answerId
            );


            console.log(
              "Monitor取得=" +
              diagnostic.monitorFetchMs
            );

            console.log(
              "Monitor fetch時間=" +
              Math.round(
                diagnostic.monitorFetchEndWallMs -
                diagnostic.monitorFetchStartWallMs
              ) +
              "ms"
            );

            console.log(
              "fetch完了→TRUE=" +
              Math.round(
                diagnostic.trueDisplayMs -
                diagnostic.monitorFetchEndWallMs
              ) +
              "ms"
            );


            console.log(
              "TRUE=" +
              diagnostic.trueDisplayMs
            );


            console.log(
              "写真=" +
              photoDisplayMs
            );


            console.log(
              "TRUE→写真=" +
              Math.round(
                photoDisplayMs -
                diagnostic.trueDisplayMs
              ) +
              "ms"
            );


            console.log(
              "写真待ち=" +
              Math.round(
                imageLoadTime
              ) +
              "ms"
            );


            console.log(
              "HTML構築=" +
              Math.round(
                htmlBuildEnd -
                htmlBuildStart
              ) +
              "ms"
            );


            console.log(
              "画面反映=" +
              Math.round(
                renderEnd -
                renderStart
              ) +
              "ms"
            );


            console.log(
              "【原因追及 END】"
            );


            /*
               timing_logへ
               このanswerIdだけ送信
            */

            sendMonitorTiming(

              diagnostic.answerId,

              diagnostic.monitorFetchMs,

              diagnostic.trueDisplayMs,

              diagnostic.photoDisplayMs

            );


            /*
               従来の異常PHOTO計測も残す
            */

            if (
              imageLoadTime >= 5000 ||
              totalTime >= 5000
            ) {

              console.warn(
                "【異常PHOTO計測】",
                imageSrc,
                "HTML構築=" +
                Math.round(
                  htmlBuildEnd -
                  htmlBuildStart
                ) +
                "ms",
                "画面反映=" +
                Math.round(
                  renderEnd -
                  renderStart
                ) +
                "ms",
                "画像読み込み=" +
                Math.round(
                  imageLoadTime
                ) +
                "ms",
                "load開始から=" +
                Math.round(
                  totalTime
                ) +
                "ms"
              );

            }

          };


        /*
           すでに画像が読み込み済みなら
           画面表示直後として記録
        */

        if (
          img.complete
        ) {

          reportImageLoad();

        } else {

          img.addEventListener(
            "load",
            reportImageLoad,
            {
              once: true
            }
          );


          img.addEventListener(
            "error",
            () => {

              console.error(
                "【PHOTOエラー】",
                imageSrc
              );

            },
            {
              once: true
            }
          );

        }

      }
    );


    /* =====================================================
       新回答を既知として登録
       ===================================================== */

    newDiagnostics.forEach(
      diagnostic => {

        window.seenAnswerIds
          .add(
            diagnostic.answerId
          );

      }
    );


    /* =====================================================
       LOAD全体
       ===================================================== */

    const loadEnd =
      performance.now();


    console.log(
      "【LOAD全体】",
      "load開始→画面反映=" +
      Math.round(
        loadEnd -
        loadStart
      ) +
      "ms"
    );


  } catch (error) {

    console.error(
      "データ取得エラー:",
      error
    );

  }

}


/* =========================================================
   モニター更新
   1秒ごと
   ========================================================= */

async function monitorLoop() {

  await load();


  setTimeout(
    monitorLoop,
    1000
  );

}


monitorLoop();

</script>

</body>
</html>
