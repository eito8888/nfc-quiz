<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding-top: 60px;
}

h1 {
  font-size: 52px;
}

#msg {
  font-size: 50px;
  font-weight: bold;
  margin-top: 40px;
}

#backBtn {
  margin-top: 60px;
  font-size: 42px;
  padding: 20px 50px;
  border-radius: 20px;
  background: #ffe066;
  font-weight: bold;
  border: none;
}
</style>
</head>

<body>

<h1 id="msg">📡 送信中…</h1>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msgDiv = document.getElementById("msg");


// ================================
// プレイヤー情報
// ================================

const player = localStorage.getItem("player");
const selected = localStorage.getItem("selectedNumber");


// ================================
// NFCタグの情報
// ================================

const params = new URLSearchParams(location.search);

const dog = params.get("dog");
const number = params.get("number");
const tagStage = params.get("stage");

const sendNumber = number || dog;


// ================================
// 二重送信防止用キー
// ================================

const sendKey =
  "sending_" +
  String(player || "") + "_" +
  String(selected || "") + "_" +
  String(sendNumber || "") + "_" +
  String(tagStage || "");


// ================================
// 送信処理
// ================================

function send() {

  msgDiv.innerText = "📡 送信中…";


  // 同じページで送信処理がすでに始まっている場合は
  // もう一度送信しない
  if (sessionStorage.getItem(sendKey) === "sending") {
    return;
  }


  sessionStorage.setItem(sendKey, "sending");


  // ================================
  // GASへ送るURL
  // ================================

  const url =
    `${GAS_URL}?player=${encodeURIComponent(player)}` +
    `&selected=${encodeURIComponent(selected)}` +
    `&number=${encodeURIComponent(sendNumber)}` +
    `&tagStage=${encodeURIComponent(tagStage)}`;


  // ================================
  // GASへ送信
  // ================================

  fetch(url)

    .then(() => {

      sessionStorage.setItem(sendKey, "sent");

      msgDiv.innerText = "📩 送信しました！";


      // 1.5秒後に番号選択画面へ戻る
      setTimeout(() => {

        location.href = "player.html";

      }, 1500);

    })


    .catch(() => {

      /*
       * GAS側では回答処理が完了していても、
       * スマホ側で応答を受け取れない場合があります。
       *
       * その場合も現在の運用と同じく、
       * 「送信しました！」として戻ります。
       */

      sessionStorage.setItem(sendKey, "sent");

      msgDiv.innerText = "📩 送信しました！";


      // 1.5秒後に番号選択画面へ戻る
      setTimeout(() => {

        location.href = "player.html";

      }, 1500);

    });

}


// ================================
// 実行
// ================================

send();

</script>

</body>
</html>
