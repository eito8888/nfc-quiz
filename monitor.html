<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クイズモニター</title>

<style>
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h1 {
  margin: 20px 0;
  font-size: 36px;
  color: #333;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding: 10px;
}

.cell {
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  padding: 15px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.answerLine {
  margin-top: 10px;
  color: green;
  font-size: 16px;
  font-weight: bold;
}

img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  margin-top: 10px;
}

.score-container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  padding: 30px;
}

.score-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.score-table th {
  background-color: #ff9800;
  color: white;
  font-size: 24px;
  padding: 15px;
}

.score-table th:first-child {
  border-radius: 10px 0 0 0;
}

.score-table th:last-child {
  border-radius: 0 10px 0 0;
}

.score-table td {
  padding: 18px 20px;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 1px solid #eee;
  color: #333;
}

.score-table tr:nth-child(even) {
  background-color: #fafafa;
}

.score-num {
  color: #e65100;
  font-size: 32px;
}
</style>

</head>

<body>

<h1 id="mainTitle">クイズ</h1>

<div id="displayArea"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";


/* =========================================================
   写真先読み
   ========================================================= */

const preloadedImages = new Map();

function preloadImage(src) {

  if (!src || preloadedImages.has(src)) {
    return;
  }

  const img = new Image();

  img.src = src;

  preloadedImages.set(src, img);
}


/* =========================================================
   原因追及用状態
   ========================================================= */

let baselineAnswerKeys = null;

let targetAnswerKey = null;

let targetRecord = null;

let targetPhotoReported = false;


/* =========================================================
   回答キー
   ========================================================= */

function makeAnswerKey(row) {

  return row.map(v => String(v)).join("|");

}


/* =========================================================
   メイン処理
   ========================================================= */

async function load() {

  const loadStart =
    performance.now();


  try {

    /* =====================================================
       GAS取得
       ===================================================== */

    const fetchStart =
      performance.now();


    const res = await fetch(
      GAS_URL + "?_=" + Date.now(),
      {
        cache: "no-store"
      }
    );


    const fetchEnd =
      performance.now();


    const data =
      await res.json();


    const jsonEnd =
      performance.now();


    const gasFetchTime =
      fetchEnd - fetchStart;


    const jsonTime =
      jsonEnd - fetchEnd;


    const displayArea =
      document.getElementById(
        "displayArea"
      );


    const currentStage =
      Number(data.currentStage);


    /* =====================================================
       最初の回答一覧を基準として保存
       → 過去回答は一切診断しない
       ===================================================== */

    if (baselineAnswerKeys === null) {

      baselineAnswerKeys =
        new Set();


      if (data.answers) {

        data.answers.forEach(row => {

          baselineAnswerKeys.add(
            makeAnswerKey(row)
          );

        });

      }


      console.log(
        "【原因追及】初期回答を基準化",
        "既存回答=" +
        baselineAnswerKeys.size +
        "件"
      );

    }


    /* =====================================================
       今回新しく追加された回答を1件だけ捕まえる
       ===================================================== */

    if (
      !targetAnswerKey &&
      data.answers
    ) {

      for (
        const row of data.answers
      ) {

        const answerKey =
          makeAnswerKey(row);


        if (
          !baselineAnswerKeys.has(
            answerKey
          )
        ) {

          const correct =
            (
              row[3] === true ||
              row[3] === "TRUE" ||
              row[3] === "true"
            );


          targetAnswerKey =
            answerKey;


          targetRecord = {

            row: row,

            player:
              String(row[0]).trim(),

            selected:
              String(row[1]).trim(),

            dog:
              String(row[2]).trim(),

            correct:
              correct,

            stage:
              String(row[4]).trim(),

            gasTimestamp:
              row[5],

            detectTime:
              performance.now(),

            fetchTime:
              gasFetchTime,

            jsonTime:
              jsonTime,

            loadStart:
              loadStart

          };


          console.log(
            "================================"
          );

          console.log(
            "【原因追及 START】"
          );

          console.log(
            "今回の回答だけを追跡します"
          );

          console.log(
            "番号=" +
            targetRecord.selected
          );

          console.log(
            "player=" +
            targetRecord.player
          );

          console.log(
            "correct=" +
            targetRecord.correct
          );

          console.log(
            "stage=" +
            targetRecord.stage
          );

          console.log(
            "GAS取得=" +
            Math.round(
              targetRecord.fetchTime
            ) +
            "ms"
          );

          console.log(
            "JSON解析=" +
            Math.round(
              targetRecord.jsonTime
            ) +
            "ms"
          );

          console.log(
            "今回の回答をモニターが検知=" +
            Math.round(
              targetRecord.detectTime -
              targetRecord.loadStart
            ) +
            "ms"
          );

          console.log(
            "GAS回答時刻(row[5])=",
            targetRecord.gasTimestamp
          );

          console.log(
            "【原因追及】この1件を写真表示まで追跡"
          );

          console.log(
            "================================"
          );


          break;

        }

      }

    }


    /* =====================================================
       写真先読み
       ===================================================== */

    if (data.questions) {

      data.questions.forEach(q => {

        const stage =
          String(q[0]).trim();

        const img =
          q[5];


        if (
          stage ===
          String(currentStage).trim() &&
          img
        ) {

          preloadImage(
            "images/" + img
          );

        }

      });

    }


    /* =====================================================
       Stage 0
       ===================================================== */

    if (currentStage === 0) {

      document.getElementById(
        "mainTitle"
      ).innerText =
        "🎉 イベント結果発表 🎉";


      if (
        !data.scoreList ||
        data.scoreList.length === 0
      ) {

        displayArea.innerHTML =
          `<div class="score-container">
             <h2>まだ回答データがありません</h2>
           </div>`;

        return;

      }


      let tableRows = "";


      data.scoreList.forEach(item => {

        tableRows += `
          <tr>
            <td style="text-align:left;padding-left:50px;">
              ${item.player}
            </td>

            <td style="text-align:right;padding-right:50px;">
              <span class="score-num">
                ${item.total}
              </span> 点
            </td>
          </tr>
        `;

      });


      displayArea.innerHTML = `
        <div class="score-container">

          <table class="score-table">

            <thead>
              <tr>
                <th style="text-align:left;padding-left:50px;">
                  ニックネーム
                </th>

                <th style="text-align:right;padding-right:50px;">
                  合計得点
                </th>
              </tr>
            </thead>

            <tbody>
              ${tableRows}
            </tbody>

          </table>

        </div>
      `;

      return;

    }


    /* =====================================================
       正解マップ
       ===================================================== */

    let correctMap = {};

    let stageTitle = "クイズ";


    if (data.answers) {

      data.answers.forEach(row => {

        const player =
          String(row[0]).trim();

        const selected =
          String(row[1]).trim();

        const correct =
          row[3];

        const stage =
          String(row[4]).trim();


        const isCorrect =
          (
            correct === true ||
            correct === "TRUE" ||
            correct === "true"
          );


        if (isCorrect) {

          const key =
            stage + "-" + selected;


          if (!correctMap[key]) {

            correctMap[key] =
              player;

          }

        }

      });

    }


    /* =====================================================
       HTML構築
       ===================================================== */

    const htmlBuildStart =
      performance.now();


    let gridHTML =
      '<div class="grid">';


    if (data.questions) {

      data.questions.forEach(q => {

        const stage =
          String(q[0]).trim();

        const number =
          String(q[1]).trim();

        const title =
          q[3];

        const name =
          q[4];

        const img =
          q[5];


        if (
          stage !==
          String(currentStage).trim()
        ) {

          return;

        }


        stageTitle =
          title || "クイズ";


        const key =
          stage + "-" + number;


        let cellContent =
          `<div class="title">
             【${number}】${name}
           </div>`;


        if (correctMap[key]) {

          cellContent += `
            <div class="answerLine">
              ✅正解 → ${correctMap[key]}
            </div>
          `;


          if (img) {

            const imageSrc =
              "images/" + img;


            cellContent +=
              `<img
                src="${
                  preloadedImages.get(
                    imageSrc
                  )?.src ||
                  imageSrc
                }"
                data-monitor-image="${imageSrc}"
                data-monitor-key="${key}"
              >`;

          }

        }


        gridHTML +=
          `<div class="cell">
             ${cellContent}
           </div>`;

      });

    }


    gridHTML +=
      "</div>";


    const htmlBuildEnd =
      performance.now();


    /* =====================================================
       画面反映
       ===================================================== */

    const renderStart =
      performance.now();


    displayArea.innerHTML =
      gridHTML;


    document.getElementById(
      "mainTitle"
    ).innerText =
      stageTitle;


    const renderEnd =
      performance.now();


    /* =====================================================
       今回の回答に対応する写真だけ追跡
       ===================================================== */

    if (
      targetRecord &&
      targetRecord.correct &&
      !targetPhotoReported
    ) {

      const targetKey =
        targetRecord.stage +
        "-" +
        targetRecord.selected;


      const targetImage =
        displayArea.querySelector(
          `img[data-monitor-key="${targetKey}"]`
        );


      if (targetImage) {

        const photoStart =
          performance.now();


        const reportTargetPhoto = () => {

          if (targetPhotoReported) {
            return;
          }


          targetPhotoReported =
            true;


          const photoEnd =
            performance.now();


          const photoTime =
            photoEnd -
            photoStart;


          const monitorDetectToPhoto =
            photoEnd -
            targetRecord.detectTime;


          console.log(
            "================================"
          );

          console.log(
            "【原因追及 PHOTO】"
          );

          console.log(
            "番号=" +
            targetRecord.selected
          );

          console.log(
            "GAS取得=" +
            Math.round(
              targetRecord.fetchTime
            ) +
            "ms"
          );

          console.log(
            "JSON解析=" +
            Math.round(
              targetRecord.jsonTime
            ) +
            "ms"
          );

          console.log(
            "モニター検知→写真=" +
            Math.round(
              monitorDetectToPhoto
            ) +
            "ms"
          );

          console.log(
            "今回の写真読み込み=" +
            Math.round(
              photoTime
            ) +
            "ms"
          );

          console.log(
            "HTML構築=" +
            Math.round(
              htmlBuildEnd -
              htmlBuildStart
            ) +
            "ms"
          );

          console.log(
            "画面反映=" +
            Math.round(
              renderEnd -
              renderStart
            ) +
            "ms"
          );

          console.log(
            "【原因追及 END】"
          );

          console.log(
            "================================"
          );

        };


        if (targetImage.complete) {

          /*
           * 今回は先読み済み画像の可能性がある。
           * completeなら、画像そのものの待ち時間は0ms。
           */
          reportTargetPhoto();


        } else {

          targetImage.addEventListener(
            "load",
            reportTargetPhoto,
            { once: true }
          );


          targetImage.addEventListener(
            "error",
            () => {

              console.error(
                "【今回回答 PHOTOエラー】",
                targetImage.src
              );

            },
            { once: true }
          );

        }

      }

    }


  } catch (error) {

    console.error(
      "【MONITORエラー】",
      error
    );

  }

}


/* =========================================================
   1秒ごと更新
   ========================================================= */

async function monitorLoop() {

  await load();

  setTimeout(
    monitorLoop,
    1000
  );

}


monitorLoop();

</script>

</body>
</html>
