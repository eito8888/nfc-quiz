<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クイズモニター</title>

<style>
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h1 {
  margin: 20px 0;
  font-size: 36px;
  color: #333;
}

/* 通常問題表示用グリッド */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding: 10px;
}

.cell {
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  padding: 15px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.answerLine {
  margin-top: 10px;
  color: green;
  font-size: 16px;
  font-weight: bold;
}

img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  margin-top: 10px;
}

/* Stage=0 合計スコア表示用スタイル */
.score-container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  padding: 30px;
}

.score-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.score-table th {
  background-color: #ff9800;
  color: white;
  font-size: 24px;
  padding: 15px;
}

.score-table th:first-child { border-radius: 10px 0 0 0; }
.score-table th:last-child { border-radius: 0 10px 0 0; }

.score-table td {
  padding: 18px 20px;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 1px solid #eee;
  color: #333;
}

.score-table tr:nth-child(even) {
  background-color: #fafafa;
}

.score-num {
  color: #e65100;
  font-size: 32px;
}
</style>

</head>

<body>

<h1 id="mainTitle">クイズ</h1>

<div id="displayArea"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";
let preloadedStage = null;
let preloadedImages = [];

function preloadImages(questions, currentStage) {
  if (preloadedStage === currentStage) {
    return;
  }

  preloadedStage = currentStage;
  preloadedImages = [];

  questions.forEach(q => {
    const stage = String(q[0]).trim();
    const img = q[5];

    if (stage !== String(currentStage).trim()) {
      return;
    }

    if (!img) {
      return;
    }

    const image = new Image();
    image.src = "images/" + img;

    preloadedImages.push(image);
  });
}
async function load() {
  try {
    const res = await fetch(GAS_URL);
    const data = await res.json();

    const displayArea = document.getElementById("displayArea");
    const currentStage = Number(data.currentStage);
if (currentStage > 0) {
  preloadImages(data.questions, currentStage);
}
    // ==========================================
    // 【Stage = 0】 結果発表画面（合計点一覧）
    // ==========================================
    if (currentStage === 0) {
      document.getElementById("mainTitle").innerText = "🎉 イベント結果発表 🎉";

      if (!data.scoreList || data.scoreList.length === 0) {
        displayArea.innerHTML = `<div class="score-container"><h2>まだ回答データがありません</h2></div>`;
        return;
      }

      let tableRows = "";
      data.scoreList.forEach(item => {
        tableRows += `
          <tr>
            <td style="text-align: left; padding-left: 50px;">${item.player}</td>
            <td style="text-align: right; padding-right: 50px;"><span class="score-num">${item.total}</span> 点</td>
          </tr>
        `;
      });

      displayArea.innerHTML = `
        <div class="score-container">
          <table class="score-table">
            <thead>
              <tr>
                <th style="text-align: left; padding-left: 50px;">ニックネーム</th>
                <th style="text-align: right; padding-right: 50px;">合計得点</th>
              </tr>
            </thead>
            <tbody>
              ${tableRows}
            </tbody>
          </table>
        </div>
      `;
      return;
    }

    // ==========================================
    // 【Stage > 0】 通常の問題画面
    // ==========================================
    let stageTitle = "クイズ";
    let correctMap = {};

    /* 正解データマップ作成 */
    data.answers.forEach(row => {
      const player   = String(row[0]).trim();
      const selected = String(row[1]).trim();
      const correct  = row[3];
      const stage    = String(row[4]).trim();

      const isCorrect = (correct === true || correct === "TRUE" || correct === "true");

      if (isCorrect) {
        const key = stage + "-" + selected;
        if (!correctMap[key]) {
          correctMap[key] = player;
        }
      }
    });

    /* HTML要素構築 */
    let gridHTML = '<div class="grid">';

    data.questions.forEach(q => {
      const stage  = String(q[0]).trim();
      const number = String(q[1]).trim();
      const title  = q[3];
      const name   = q[4];
      const img    = q[5];

      if (stage !== String(currentStage).trim()) return;

      stageTitle = title || "クイズ";

      const key = stage + "-" + number;
      let cellContent = `<div class="title">【${number}】${name}</div>`;

      if (correctMap[key]) {
        cellContent += `
          <div class="answerLine">
            ✅正解 → ${correctMap[key]}
          </div>
        `;
        if (img) {
          cellContent += `<img src="images/${img}">`;
        }
      }

      gridHTML += `<div class="cell">${cellContent}</div>`;
    });

    gridHTML += '</div>';

    console.time("写真表示");
    displayArea.innerHTML = gridHTML;
　　console.timeEnd("写真表示");
    
    document.getElementById("mainTitle").innerText = stageTitle;

  } catch (error) {
    console.error("データ取得エラー:", error);
  }
}

async function monitorLoop() {
await load();
setTimeout(monitorLoop, 1500);
}

monitorLoop();
</script>

</body>
</html>
