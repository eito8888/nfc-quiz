<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding-top:12px;
  margin:0;
}

h1{
  font-size:28px;
  margin:0 0 8px;
}

#msg{
  font-size:25px;
  font-weight:bold;
  margin-top:4px;
}

#debug{
  margin:8px auto 0;
  font-size:16px;
  line-height:1.08;
  font-weight:bold;
  white-space:pre-line;
  text-align:left;
  padding:0 8px;
  max-width:900px;
}
</style>

</head>

<body>

<h1 id="msg">📡 送信中…</h1>
<div id="debug"></div>


<script>


const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";


const msgDiv =
  document.getElementById("msg");

const debugDiv =
  document.getElementById("debug");


const player =
  localStorage.getItem("player");

const selected =
  localStorage.getItem("selectedNumber");


const params =
  new URLSearchParams(location.search);


const dog =
  params.get("dog");

const number =
  params.get("number");

const tagStage =
  params.get("stage");


const sendNumber =
  number || dog;


const sendKey =
  "sending_" +
  String(player || "") + "_" +
  String(selected || "") + "_" +
  String(sendNumber || "") + "_" +
  String(tagStage || "");


const requestIdKey =
  "requestId_" + sendKey;


/* =========================================================
   requestId
   二重送信対策
   ========================================================= */

let requestId = "";

try{

  const saved =
    JSON.parse(
      sessionStorage.getItem(requestIdKey) || "null"
    );

  if(
    saved &&
    saved.id &&
    Date.now() - Number(saved.createdAt || 0) < 60000
  ){

    requestId =
      saved.id;

  }

}catch(e){}


if(!requestId){

  requestId =
    (
      window.crypto &&
      crypto.randomUUID
    )
      ? crypto.randomUUID()
      : (
          "req_" +
          Date.now() +
          "_" +
          Math.random().toString(36).slice(2)
        );


  try{

    sessionStorage.setItem(
      requestIdKey,
      JSON.stringify({
        id:requestId,
        createdAt:Date.now()
      })
    );

  }catch(e){}

}


/* =========================================================
   保存
   ========================================================= */

function saveSendRecord(record){

  try{

    const key =
      "NFC_SEND_HISTORY";

    let history =
      JSON.parse(
        localStorage.getItem(key) || "[]"
      );

    history.push(record);

    if(history.length > 100){

      history =
        history.slice(-100);

    }

    localStorage.setItem(
      key,
      JSON.stringify(history)
    );

  }catch(e){

    console.error(
      "【診断保存ERROR】",
      e
    );

  }

}


function saveLastDiagnostic(record){

  try{

    localStorage.setItem(
      "NFC_LAST_DIAGNOSTIC",
      JSON.stringify(record)
    );

  }catch(e){

    console.error(
      "【診断保存ERROR】",
      e
    );

  }

}


/* =========================================================
   画面表示
   ========================================================= */

function showDiagnostic(lines){

  debugDiv.innerText =
    lines.join("\n");

}


function ms(v){

  return(
    typeof v === "number" &&
    Number.isFinite(v)
  )
    ? Math.round(v)
    : "取得不可";

}


/* =========================================================
   ブラウザ状態
   ========================================================= */

function getBrowserState(){

  let c = null;

  try{

    c =
      navigator.connection ||
      navigator.mozConnection ||
      navigator.webkitConnection;

  }catch(e){}


  return{

    online:
      navigator.onLine,

    visibility:
      document.visibilityState,

    readyState:
      document.readyState,

    effectiveType:
      c && c.effectiveType
        ? c.effectiveType
        : "",

    downlink:
      c && typeof c.downlink === "number"
        ? c.downlink
        : null,

    rtt:
      c && typeof c.rtt === "number"
        ? c.rtt
        : null,

    saveData:
      c && typeof c.saveData === "boolean"
        ? c.saveData
        : null,

    userAgent:
      navigator.userAgent

  };

}


/* =========================================================
   Resource Timing
   ========================================================= */

function getResourceTiming(target){

  try{

    const entries =
      performance.getEntriesByType(
        "resource"
      );


    const list =
      entries.filter(
        e =>
          e.name.indexOf(target) === 0
      );


    if(!list.length){

      return null;

    }


    list.sort(
      (a,b) =>
        b.startTime - a.startTime
    );


    const e =
      list[0];


    return{

      startTime:
        e.startTime,

      duration:
        e.duration,

      redirectStart:
        e.redirectStart,

      redirectEnd:
        e.redirectEnd,

      workerStart:
        e.workerStart,

      fetchStart:
        e.fetchStart,

      domainLookupStart:
        e.domainLookupStart,

      domainLookupEnd:
        e.domainLookupEnd,

      connectStart:
        e.connectStart,

      connectEnd:
        e.connectEnd,

      secureConnectionStart:
        e.secureConnectionStart,

      requestStart:
        e.requestStart,

      responseStart:
        e.responseStart,

      responseEnd:
        e.responseEnd,

      transferSize:
        e.transferSize,

      encodedBodySize:
        e.encodedBodySize,

      decodedBodySize:
        e.decodedBodySize,

      nextHopProtocol:
        e.nextHopProtocol || "",

      initiatorType:
        e.initiatorType || ""

    };

  }catch(e){

    return null;

  }

}


/* =========================================================
   Resource Timing compact display
   ========================================================= */

function resourceSummary(rt){

  if(!rt){

    return [
      "RT：記録なし"
    ];

  }


  return [

    "RT fetch:" + ms(rt.fetchStart) +
      " req:" + ms(rt.requestStart) +
      " rsp:" + ms(rt.responseStart) +
      " end:" + ms(rt.responseEnd),

    "RT DNS:" + ms(rt.domainLookupEnd - rt.domainLookupStart) +
      " conn:" + ms(rt.connectEnd - rt.connectStart) +
      " TLS:" + ms(
        rt.secureConnectionStart > 0
          ? rt.connectEnd - rt.secureConnectionStart
          : 0
      ),

    "RT transfer:" +
      ms(rt.transferSize) +
      "B / " +
      (rt.nextHopProtocol || "protocol不明")

  ];

}


/* =========================================================
   Event Loop 遅延計測
   ========================================================= */

let eventLoopTimer = null;

let eventLoopMaxDelay = 0;

let eventLoopLast =
  performance.now();


function startEventLoopMonitor(){

  eventLoopLast =
    performance.now();


  eventLoopTimer =
    setInterval(()=>{

      const now =
        performance.now();


      const expected =
        eventLoopLast + 1000;


      const delay =
        Math.max(
          0,
          now - expected
        );


      if(delay > eventLoopMaxDelay){

        eventLoopMaxDelay =
          delay;

      }


      eventLoopLast =
        now;

    },1000);

}


function stopEventLoopMonitor(){

  if(eventLoopTimer){

    clearInterval(
      eventLoopTimer
    );

    eventLoopTimer =
      null;

  }

}


/* =========================================================
   response body詳細取得
   ========================================================= */

async function readResponseBody(response){

  const bodyStart =
    performance.now();


  let firstChunk =
    0;

  let bodyEnd =
    0;

  let totalBytes =
    0;

  let chunkCount =
    0;

  let text =
    "";


  if(
    response.body &&
    response.body.getReader
  ){

    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder();


    while(true){

      const result =
        await reader.read();


      if(result.done){

        break;

      }


      if(!firstChunk){

        firstChunk =
          performance.now();

      }


      chunkCount++;


      if(result.value){

        totalBytes +=
          result.value.byteLength;

        text +=
          decoder.decode(
            result.value,
            {
              stream:true
            }
          );

      }

    }


    text +=
      decoder.decode();


    bodyEnd =
      performance.now();

  }else{

    text =
      await response.text();


    bodyEnd =
      performance.now();

    firstChunk =
      bodyEnd;

  }


  return{

    text,

    firstChunkMs:
      firstChunk
        ? firstChunk - bodyStart
        : 0,

    bodyDurationMs:
      bodyEnd - bodyStart,

    bodyCompleteMs:
      bodyEnd,

    totalBytes,

    chunkCount

  };

}


/* =========================================================
   メイン送信
   ========================================================= */

function send(){


  const measureStart =
    performance.now();


  const sendStartMs =
    Date.now();


  const startTime =
    new Date(
      sendStartMs
    ).toISOString();


  const browserStart =
    getBrowserState();


  startEventLoopMonitor();


  console.log(
    "【SEND開始】",
    sendStartMs,
    player,
    selected,
    sendNumber,
    tagStage,
    requestId
  );


  msgDiv.innerText =
    "📡 送信中…";


  /* =======================================================
     二重送信防止
     ======================================================= */

  if(
    sessionStorage.getItem(sendKey) ===
    "sending"
  ){

    stopEventLoopMonitor();

    debugDiv.innerText =
      "二重送信防止";

    return;

  }


  sessionStorage.setItem(
    sendKey,
    "sending"
  );


  /* =======================================================
     fetch開始
     ======================================================= */

  const fetchStart =
    performance.now();


  const fetchStartMs =
    Date.now();


  const sendToFetchMs =
    Math.max(
      0,
      Math.round(
        fetchStartMs -
        sendStartMs
      )
    );


  const url =
    `${GAS_URL}` +
    `?player=${encodeURIComponent(player)}` +
    `&selected=${encodeURIComponent(selected)}` +
    `&number=${encodeURIComponent(sendNumber)}` +
    `&tagStage=${encodeURIComponent(tagStage)}` +
    `&clientSendMs=${encodeURIComponent(sendStartMs)}` +
    `&requestId=${encodeURIComponent(requestId)}` +
    `&_=${Date.now()}`;


  /*
   * ★重要
   *
   * AbortControllerは使用しない。
   *
   * 15秒は通信終了ではなく
   * 「異常到達時点」の記録だけ。
   */


  let timeoutFired =
    false;


  let timeoutCheckpoint =
    null;


  const timeoutId =
    setTimeout(()=>{

      timeoutFired =
        true;


      const now =
        performance.now();


      const nowMs =
        Date.now();


      const rt =
        getResourceTiming(
          GAS_URL
        );


      const bs =
        getBrowserState();


      timeoutCheckpoint = {

        timeMs:
          nowMs,

        elapsedMs:
          Math.round(
            now - measureStart
          ),

        fetchElapsedMs:
          Math.round(
            now - fetchStart
          ),

        browserState:
          bs,

        resourceTiming:
          rt,

        eventLoopMaxDelay:
          Math.round(
            eventLoopMaxDelay
          )

      };


      msgDiv.innerText =
        "📩 15秒超過・応答待機中";


      showDiagnostic([

        "【送信診断】15秒超過",

        "送信→15秒："+
          Math.round(
            now - measureStart
          )+" ms",

        "fetch→15秒："+
          Math.round(
            now - fetchStart
          )+" ms",

        "★ fetch継続中",

        "HTTP response：待機中",

        "15秒時online："+
          String(bs.online),

        "15秒時画面："+
          String(bs.visibility),

        "RT response："+
          (
            rt
              ? ms(rt.responseStart)
              : "なし"
          )+" ms",

        "通信計測を継続しています"

      ]);


    },15000);


  /* =======================================================
     fetch
     ======================================================= */

  fetch(
    url,
    {
      method:"GET",
      cache:"no-store"
    }
  )


  /* =======================================================
     HTTP responseヘッダ受信
     ======================================================= */

  .then(async response=>{


    const responseMs =
      Date.now();


    const responseTime =
      performance.now();


    const responseElapsed =
      responseTime -
      measureStart;


    const fetchToResponseMs =
      responseTime -
      fetchStart;


    window.__sendResponseMs =
      responseMs;


    window.__sendResponseElapsed =
      responseElapsed;


    window.__sendResponseStatus =
      response.status;


    window.__responseHeadersReceived =
      true;


    if(timeoutFired){

      /*
       * ★15秒後にここへ来た場合
       * ここで画面を必ず更新する。
       */

      msgDiv.innerText =
        "📩 HTTP応答受信";


      showDiagnostic([

        "【送信診断】15秒後HTTP応答",

        "送信→HTTP応答："+
          Math.round(
            responseElapsed
          )+" ms",

        "fetch→HTTP応答："+
          Math.round(
            fetchToResponseMs
          )+" ms",

        "HTTP status："+response.status,

        "★15秒後に応答を受信",

        "HTTP body受信を計測中…",

        "実際のAbort：false"

      ]);

    }


    if(!response.ok){

      throw new Error(
        "HTTP "+response.status
      );

    }


    /*
     * bodyを細分化して計測
     */

    const bodyInfo =
      await readResponseBody(
        response
      );


    window.__bodyInfo =
      bodyInfo;


    const bodyCompleteTime =
      performance.now();


    /*
     * ★body全部受信した時点
     */

    if(timeoutFired){

      msgDiv.innerText =
        "📩 HTTP受信完了・解析中";


      showDiagnostic([

        "【送信診断】15秒後HTTP受信完了",

        "送信→HTTP応答："+
          Math.round(
            responseElapsed
          )+" ms",

        "HTTP応答→body完了："+
          Math.round(
            bodyCompleteTime -
            responseTime
          )+" ms",

        "body受信時間："+
          Math.round(
            bodyInfo.bodyDurationMs
          )+" ms",

        "最初のbody："+ 
          Math.round(
            bodyInfo.firstChunkMs
          )+" ms",

        "bodyサイズ："+ 
          bodyInfo.totalBytes+" bytes",

        "chunk数："+ 
          bodyInfo.chunkCount,

        "JSON解析中…"

      ]);

    }


    return{

      response,

      bodyText:
        bodyInfo.text,

      bodyInfo,

      responseTime,

      bodyCompleteTime

    };

  })


  /* =======================================================
     JSON解析
     ======================================================= */

  .then(packet=>{


    const jsonStart =
      performance.now();


    let data;


    try{

      data =
        JSON.parse(
          packet.bodyText
        );

    }catch(error){

      error.phase =
        "JSON.parse";


      error.responseReceived =
        true;


      error.bodyReceived =
        true;


      error.bodyTextLength =
        packet.bodyText.length;


      throw error;

    }


    const jsonEnd =
      performance.now();


    const jsonParseMs =
      jsonEnd -
      jsonStart;


    window.__jsonParseMs =
      jsonParseMs;


    const answerId =
      String(
        data.answerId || ""
      ).trim();


    if(timeoutFired){

      msgDiv.innerText =
        "📩 JSON解析完了";


      showDiagnostic([

        "【送信診断】15秒後JSON解析完了",

        "送信→HTTP応答："+ 
          Math.round(
            packet.responseTime -
            measureStart
          )+" ms",

        "HTTP→body完了："+ 
          Math.round(
            packet.bodyCompleteTime -
            packet.responseTime
          )+" ms",

        "body→JSON："+ 
          Math.round(
            jsonParseMs
          )+" ms",

        "answerId："+ 
          (
            answerId
              ? "取得済み"
              : "取得できず"
          ),

        "最終結果を表示します"

      ]);

    }


    return{

      data,

      answerId,

      response:
        packet.response,

      bodyInfo:
        packet.bodyInfo,

      responseTime:
        packet.responseTime,

      bodyCompleteTime:
        packet.bodyCompleteTime,

      jsonEnd,

      jsonParseMs

    };

  })


  /* =======================================================
     最終処理
     ======================================================= */

  .then(packet=>{


    const data =
      packet.data;


    const answerId =
      packet.answerId;


    const finalMs =
      performance.now();


    const finalWallMs =
      Date.now();


    const fetchTime =
      finalMs -
      fetchStart;


    const responseElapsed =
      window.__sendResponseElapsed ||
      0;


    const gasReceiveMs =
      Number(
        data.gasReceiveMs
      ) || 0;


    const gasCompleteMs =
      Number(
        data.gasCompleteMs
      ) || 0;


    const gasInternalMs =
      (
        gasReceiveMs &&
        gasCompleteMs
      )
        ? gasCompleteMs -
          gasReceiveMs
        : 0;


    const fetchToGasReceiveMs =
      gasReceiveMs
        ? Math.max(
            0,
            Math.round(
              gasReceiveMs -
              fetchStartMs
            )
          )
        : 0;


    const sendToGasReceiveMs =
      gasReceiveMs
        ? Math.max(
            0,
            Math.round(
              gasReceiveMs -
              sendStartMs
            )
          )
        : 0;


    const gasCompleteToResponseMs =
      gasCompleteMs &&
      window.__sendResponseMs
        ? Math.round(
            window.__sendResponseMs -
            gasCompleteMs
          )
        : 0;


    const responseToBodyMs =
      Math.round(
        packet.bodyCompleteTime -
        packet.responseTime
      );


    const bodyToJsonMs =
      Math.round(
        packet.jsonEnd -
        packet.bodyCompleteTime
      );


    const jsonToAnswerMs =
      Math.round(
        finalMs -
        packet.jsonEnd
      );


    const gasOutsideMs =
      Math.max(
        0,
        Math.round(
          fetchTime -
          gasInternalMs
        )
      );


    const sentDisplayMs =
      finalWallMs;


    const sendDisplayTime =
      finalMs -
      measureStart;


    const rt =
      getResourceTiming(
        GAS_URL
      );


    const browserFinal =
      getBrowserState();


    const status =
      window.__sendResponseStatus;


    const bodyInfo =
      packet.bodyInfo;


    stopEventLoopMonitor();


    clearTimeout(
      timeoutId
    );


    sessionStorage.setItem(
      sendKey,
      "sent"
    );


    /*
     * ★最終画面
     *
     * 15秒後に来ても必ずここへ更新
     */

    msgDiv.innerText =
      "📩 送信しました！";


    showDiagnostic([

      timeoutFired
        ? "【今回の送信診断】15秒超過後に完了"
        : "【今回の送信診断】正常",

      "answerId："+answerId,

      "送信→fetch："+sendToFetchMs+" ms",

      "fetch→GAS受信："+fetchToGasReceiveMs+" ms",

      "GAS受信→処理完了："+Math.round(gasInternalMs)+" ms",

      "GAS完了→HTTP応答："+gasCompleteToResponseMs+" ms",

      "HTTP応答→body完了："+responseToBodyMs+" ms",

      "body完了→JSON："+bodyToJsonMs+" ms",

      "JSON→answerId："+jsonToAnswerMs+" ms",

      "fetch→answerId："+Math.round(fetchTime)+" ms",

      "送信→送信しました："+Math.round(sendDisplayTime)+" ms",

      "HTTP："+status,

      "body："+bodyInfo.totalBytes+" B / "+bodyInfo.chunkCount+" chunk",

      "15秒超過："+String(timeoutFired),

      "eventLoop最大遅延："+Math.round(eventLoopMaxDelay)+" ms",

      "online："+String(browserFinal.online)+
        " / 画面："+String(browserFinal.visibility),

      ...resourceSummary(rt)

    ]);


    /*
     * ★最終診断データ
     */

    const diagnostic = {

      result:
        timeoutFired
          ? "GAS_RESPONSE_AFTER_15S"
          : "GAS_RESPONSE",

      time:
        startTime,

      requestId,

      player,

      selected,

      dog,

      number:
        sendNumber,

      tagStage,


      sendStartMs,

      fetchStartMs,

      responseMs:
        window.__sendResponseMs || 0,

      bodyCompleteMs:
        finalWallMs -
        Math.max(
          0,
          Math.round(
            finalMs -
            packet.bodyCompleteTime
          )
        ),

      jsonEndMs:
        finalWallMs -
        Math.max(
          0,
          Math.round(
            finalMs -
            packet.jsonEnd
          )
        ),

      answerId,

      sendToFetchMs,

      fetchToGasReceiveMs,

      sendToGasReceiveMs,

      gasInternalMs:
        Math.round(
          gasInternalMs
        ),

      gasCompleteToResponseMs,

      responseToBodyMs,

      bodyToJsonMs,

      jsonToAnswerMs,

      fetchMs:
        Math.round(
          fetchTime
        ),

      sendToDisplayMs:
        Math.round(
          sendDisplayTime
        ),

      gasOutsideMs,

      httpStatus:
        status,

      bodyBytes:
        bodyInfo.totalBytes,

      bodyChunks:
        bodyInfo.chunkCount,

      bodyFirstChunkMs:
        Math.round(
          bodyInfo.firstChunkMs
        ),

      bodyDurationMs:
        Math.round(
          bodyInfo.bodyDurationMs
        ),

      jsonParseMs:
        Math.round(
          packet.jsonParseMs
        ),

      timeoutFired,

      timeoutCheckpoint,

      responseHeadersReceived:true,

      bodyReceived:true,

      jsonCompleted:true,

      answerIdReceived:
        !!answerId,

      actualAbort:false,

      eventLoopMaxDelay:
        Math.round(
          eventLoopMaxDelay
        ),

      browserStart,

      browserFinal,

      resourceTiming:rt

    };


    saveLastDiagnostic(
      diagnostic
    );


    saveSendRecord(
      diagnostic
    );


    /*
     * 「送信しました」表示時刻をGASへ保存
     */

    if(answerId){

      const displayUrl =
        `${GAS_URL}` +
        `?event=sentDisplay` +
        `&answerId=${encodeURIComponent(answerId)}` +
        `&sentDisplayMs=${encodeURIComponent(sentDisplayMs)}` +
        `&_=${Date.now()}`;


      fetch(
        displayUrl,
        {
          method:"GET",
          cache:"no-store"
        }
      )
      .then(()=>{

        console.log(
          "【SEND sentDisplay送信完了】",
          answerId
        );

      })
      .catch(error=>{

        console.error(
          "【SEND sentDisplay送信エラー】",
          error
        );

      });

    }


    /*
     * 診断画面を15秒表示
     */

    setTimeout(
      ()=>{
        location.href =
          "player.html";
      },
      15000
    );

  })


  /* =======================================================
     通信エラー
     ======================================================= */

  .catch(error=>{


    stopEventLoopMonitor();


    clearTimeout(
      timeoutId
    );


    const errorTime =
      performance.now() -
      measureStart;


    const errorMs =
      Date.now();


    const rt =
      getResourceTiming(
        GAS_URL
      );


    const bs =
      getBrowserState();


    sessionStorage.setItem(
      sendKey,
      "sent"
    );


    console.error(
      "【SEND通信ERROR】",
      error
    );


    msgDiv.innerText =
      "📩 通信確認中";


    showDiagnostic([

      timeoutFired
        ? "【送信診断】15秒超過後ERROR"
        : "【送信診断】通信ERROR",

      "送信→ERROR："+Math.round(errorTime)+" ms",

      "15秒超過："+String(timeoutFired),

      "HTTP response："+String(
        window.__sendResponseReceived || false
      ),

      "error："+String(error),

      "error.name："+(
        error &&
        error.name
          ? error.name
          : "取得不可"
      ),

      "eventLoop最大遅延："+Math.round(eventLoopMaxDelay)+" ms",

      "online："+String(bs.online),

      "画面："+String(bs.visibility),

      ...resourceSummary(rt)

    ]);


    saveLastDiagnostic({

      result:
        "ERROR",

      time:
        startTime,

      requestId,

      sendStartMs,

      fetchStartMs,

      errorMs,

      elapsedMs:
        Math.round(
          errorTime
        ),

      errorMessage:
        String(error),

      errorName:
        error &&
        error.name
          ? error.name
          : "",

      timeoutFired,

      timeoutCheckpoint,

      responseHeadersReceived:
        !!window.__responseHeadersReceived,

      browserState:
        bs,

      resourceTiming:
        rt,

      eventLoopMaxDelay:
        Math.round(
          eventLoopMaxDelay
        ),

      player,

      selected,

      number:
        sendNumber,

      tagStage

    });


    setTimeout(
      ()=>{
        location.href =
          "player.html";
      },
      15000
    );

  });

}


send();

</script>

</body>
</html>
