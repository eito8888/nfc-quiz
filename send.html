<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding-top: 25px;
  margin: 0;
}

h1 {
  font-size: 42px;
  margin: 0 0 18px;
}

#msg {
  font-size: 38px;
  font-weight: bold;
  margin-top: 10px;
}

#debug {
  margin: 18px auto 0;
  font-size: 22px;
  line-height: 1.25;
  font-weight: bold;
  white-space: pre-line;
  text-align: left;
  padding: 0 12px;
  max-width: 900px;
}
</style>
</head>

<body>

<h1 id="msg">📡 送信中…</h1>
<div id="debug"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msgDiv =
document.getElementById("msg");

const debugDiv =
document.getElementById("debug");


const player =
localStorage.getItem("player");

const selected =
localStorage.getItem("selectedNumber");


const params =
new URLSearchParams(location.search);

const dog =
params.get("dog");

const number =
params.get("number");

const tagStage =
params.get("stage");

const sendNumber =
number || dog;


const sendKey =
"sending_" +
String(player || "") + "_" +
String(selected || "") + "_" +
String(sendNumber || "") + "_" +
String(tagStage || "");


/* =========================================================
   診断保存
   ========================================================= */

function saveSendRecord(record) {

  try {

    const key =
    "NFC_SEND_HISTORY";

    let history =
    JSON.parse(
      localStorage.getItem(key) || "[]"
    );

    history.push(record);

    if (history.length > 100) {

      history =
      history.slice(-100);

    }

    localStorage.setItem(
      key,
      JSON.stringify(history)
    );

  } catch(e) {

    console.error(
      "【診断保存ERROR】",
      e
    );

  }

}


/* =========================================================
   送信
   ========================================================= */

function send() {

  const measureStart =
  performance.now();

  const sendStartMs =
  Date.now();

  const startTime =
  new Date(sendStartMs).toISOString();


  msgDiv.innerText =
  "📡 送信中…";


  /*
     二重送信防止
  */

  if (
    sessionStorage.getItem(sendKey)
    === "sending"
  ) {

    debugDiv.innerText =
    "二重送信防止";

    return;

  }


  sessionStorage.setItem(
    sendKey,
    "sending"
  );


  /*
     fetch開始
  */

  const fetchStart =
  performance.now();

  const fetchStartMs =
  Date.now();


  const sendToFetchMs =
  Math.max(
    0,
    Math.round(
      fetchStartMs -
      sendStartMs
    )
  );


  /*
     GASへ送る

     15秒Abortは入れない。
     ここではGASへの1回の送信を
     最後まで成立させる。
  */

  const url =
    `${GAS_URL}?player=${encodeURIComponent(player)}` +
    `&selected=${encodeURIComponent(selected)}` +
    `&number=${encodeURIComponent(sendNumber)}` +
    `&tagStage=${encodeURIComponent(tagStage)}` +
    `&clientSendMs=${encodeURIComponent(sendStartMs)}` +
    `&_=${Date.now()}`;


  fetch(
    url,
    {
      method: "GET",
      cache: "no-store"
    }
  )

  .then(
    response => {

      const responseMs =
      Date.now();

      const responseElapsed =
      performance.now() -
      measureStart;


      /*
         HTTP状態を保存
      */

      window.__sendResponseMs =
      responseMs;

      window.__sendResponseStatus =
      response.status;


      /*
         HTTP応答が来たら、
         すぐJSONを読む
      */

      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      return response.json();

    }
  )

  .then(
    data => {

      const jsonEnd =
      performance.now();

      const jsonEndMs =
      Date.now();


      const fetchTime =
      jsonEnd -
      fetchStart;


      const answerId =
      String(
        data.answerId || ""
      ).trim();


      /*
         GAS側の計測値
      */

      const gasReceiveMs =
      Number(
        data.gasReceiveMs
      ) || 0;

      const gasCompleteMs =
      Number(
        data.gasCompleteMs
      ) || 0;


      const gasInternalMs =
      (
        gasReceiveMs &&
        gasCompleteMs
      )
        ? gasCompleteMs -
          gasReceiveMs
        : 0;


      const fetchToGasReceiveMs =
      (
        gasReceiveMs &&
        fetchStartMs
      )
        ? Math.max(
            0,
            Math.round(
              gasReceiveMs -
              fetchStartMs
            )
          )
        : 0;


      const sendToGasReceiveMs =
      gasReceiveMs
        ? Math.max(
            0,
            Math.round(
              gasReceiveMs -
              sendStartMs
            )
          )
        : 0;


      const gasCompleteToResponseMs =
      (
        gasCompleteMs &&
        window.__sendResponseMs
      )
        ? Math.round(
            window.__sendResponseMs -
            gasCompleteMs
          )
        : 0;


      const gasOutsideMs =
      Math.max(
        0,
        Math.round(
          fetchTime -
          gasInternalMs
        )
      );


      const sentDisplayMs =
      Date.now();

      const sendDisplayTime =
      performance.now() -
      measureStart;


      const jsonParseMs =
      Math.max(
        0,
        Math.round(
          jsonEnd -
          (
            measureStart +
            responseElapsed
          )
        )
      );


      /*
         ★最重要
         HTTP応答が返ったら
         すぐ「送信しました」
      */

      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      msgDiv.innerText =
      "📩 送信しました！";


      /*
         画面には必要最小限だけ表示
      */

      debugDiv.innerText =
        "送信開始 → fetch開始：" +
        sendToFetchMs +
        " ms\n\n" +

        "fetch開始 → GAS応答：" +
        Math.round(fetchTime) +
        " ms\n\n" +

        "送信開始 →「送信しました」：" +
        Math.round(sendDisplayTime) +
        " ms\n\n" +

        "HTTP：" +
        String(
          window.__sendResponseStatus
        );


      /*
         診断データ保存

         ここは画面表示後に行う。
         診断処理でゲーム本線を止めない。
      */

      saveSendRecord({

        result:
        "GAS_RESPONSE",

        time:
        startTime,

        sendStartMs:
        sendStartMs,

        fetchStartMs:
        fetchStartMs,

        responseMs:
        window.__sendResponseMs || 0,

        jsonEndMs:
        jsonEndMs,

        sentDisplayMs:
        sentDisplayMs,

        answerId:
        answerId,

        player:
        player,

        selected:
        selected,

        dog:
        dog,

        number:
        sendNumber,

        tagStage:
        tagStage,

        fetchMs:
        Math.round(fetchTime),

        sendToFetchMs:
        sendToFetchMs,

        fetchToGasReceiveMs:
        fetchToGasReceiveMs,

        sendToGasReceiveMs:
        sendToGasReceiveMs,

        gasInternalMs:
        Math.round(gasInternalMs),

        gasCompleteToResponseMs:
        gasCompleteToResponseMs,

        gasOutsideMs:
        gasOutsideMs,

        sendToDisplayMs:
        Math.round(
          sendDisplayTime
        ),

        httpStatus:
        window.__sendResponseStatus,

        jsonParseMs:
        jsonParseMs

      });


      /*
         ★ここでは
         sentDisplay用の追加fetchをしない

         これが今回の重要変更。
      */


      /*
         ★昔の動作へ戻す

         「送信しました」
         ↓
         1.5秒
         ↓
         player.html
      */

      setTimeout(
        () => {

          location.href =
          "player.html";

        },
        1500
      );

    }
  )

  .catch(
    error => {

      const errorTime =
      performance.now() -
      measureStart;

      const errorMs =
      Date.now();


      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      /*
         エラーでも
         ゲームを永久停止させない
      */

      msgDiv.innerText =
      "📩 送信しました！";


      debugDiv.innerText =
        "通信ERROR\n\n" +

        "送信開始 → ERROR：" +
        Math.round(
          errorTime
        ) +
        " ms\n\n" +

        "error：" +
        String(error);


      saveSendRecord({

        result:
        "ERROR",

        time:
        startTime,

        sendStartMs:
        sendStartMs,

        fetchStartMs:
        fetchStartMs,

        errorMs:
        errorMs,

        elapsedMs:
        Math.round(
          errorTime
        ),

        errorMessage:
        String(error),

        player:
        player,

        selected:
        selected,

        number:
        sendNumber,

        tagStage:
        tagStage

      });


      /*
         エラーでも
         1.5秒後には次へ
      */

      setTimeout(
        () => {

          location.href =
          "player.html";

        },
        1500
      );

    }
  );

}


send();

</script>

</body>
</html>
