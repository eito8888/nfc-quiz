<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>クイズモニター</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
}

h1 {
  margin: 10px;
  font-size: 28px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  padding: 12px;
}

.cell {
  border: 2px solid #999;
  border-radius: 12px;
  padding: 8px;
  height: 170px;
}

.title {
  font-weight: bold;
  font-size: 20px;
}

.answerLine {
  font-size: 16px;
  margin-top: 4px;
}

img {
  margin-top: 6px;
  width: 100%;
  height: 95px;
  object-fit: contain;
}
</style>
</head>

<body>

<h1 id="mainTitle">読み込み中...</h1>
<div id="grid" class="grid"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbysC8_DE3KENuaTbOynEviquqjhPVcSCxXo6zIREjkKnVrYrHdLey4vH0G8ARhHPPOo/exec";

async function load() {

  const grid = document.getElementById("grid");

  try {

    const res = await fetch(GAS_URL + "?mode=monitor");
    const data = await res.json();

    grid.innerHTML = "";

    /* ★ データ0件対策 */
    if (!data.questions || data.questions.length === 0) {

      document.getElementById("mainTitle").innerText =
        "⚠ 問題がありません（stageを確認）";

      grid.innerHTML =
        "<h2>questions または stage 設定を確認してください</h2>";

      return;
    }

    let stageTitle = "クイズ";

    data.questions.forEach(q => {

      const stage  = Number(q[0]);
      const number = q[1];
      const title  = q[3];
      const name   = q[4];
      const img    = q[5];

      stageTitle = title || "クイズ";

      const div = document.createElement("div");
      div.className = "cell";

      div.innerHTML = `<div class="title">【${number}】${name}</div>`;

      const key = number;

      if (data.correctMap[key]) {

        div.innerHTML += `
          <div class="answerLine">
            ✅正解 → ${data.correctMap[key]}
          </div>
        `;

        if (img) {
          div.innerHTML += `<img src="images/${img}">`;
        }
      }

      grid.appendChild(div);
    });

    document.getElementById("mainTitle").innerText = stageTitle;

  } catch (err) {

    document.getElementById("mainTitle").innerText =
      "⚠ GASに接続できません";

    grid.innerHTML =
      "<h2>URLまたはデプロイを確認してください</h2>";
  }
}

load();
setInterval(load, 1500);

</script>

</body>
</html>
