<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>回答画面（最強B方式）</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 0;
}

/* 選択中表示（最重要） */
#chosen {
  font-size: 34px;
  font-weight: bold;
  padding: 15px;
  margin: 15px;
  border: 3px solid black;
  border-radius: 15px;
}

/* 結果表示 */
#result {
  font-size: 20px;
  margin: 10px;
}

/* 履歴表示 */
#history {
  font-size: 14px;
  margin: 10px;
  white-space: pre-line;
}

/* ボタン配置（横4列） */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin: 20px;
}

/* ボタン大きく */
button {
  font-size: 30px;
  padding: 24px;
  border-radius: 18px;
}
</style>
</head>

<body>

<!-- 選択中 -->
<div id="chosen">番号を選んでください</div>

<!-- 結果（ここでは送信しないので基本空） -->
<div id="result"></div>

<!-- 履歴（送信後にsend.html側で更新される） -->
<div id="history"></div>

<!-- ボタン -->
<div class="grid" id="buttons"></div>

<script>
/* プレイヤー名 */
let player = localStorage.getItem("player");
if (!player) {
  player = prompt("名前（あだ名）を入力してください");
  localStorage.setItem("player", player);
}

/* 表示エリア */
const chosenDiv = document.getElementById("chosen");
const btnArea = document.getElementById("buttons");

/* ボタン生成（1〜10） */
for (let i = 1; i <= 10; i++) {

  const btn = document.createElement("button");
  btn.innerText = i;

  /* 押したら選択中になるだけ（送信しない） */
  btn.onclick = () => {

    // ★最強B方式：番号を保存する（send.htmlが読む）
    localStorage.setItem("selectedNumber", i);

    // 表示更新
    chosenDiv.innerText = `🎯 選択中：${i}番`;

  };

  btnArea.appendChild(btn);
}
</script>

</body>
</html>
