<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>回答画面</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  #chosen {
    font-size: 40px;
    font-weight: bold;
    padding: 35px 15px;
    margin: 20px 15px;
    border: 4px solid black;
    border-radius: 18px;
    background: white;
    margin-top: 230px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin: 25px;
  }

  button {
    font-size: 50px;
    font-weight: bold;
    border-radius: 20px;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #ffe600;
    color: black;
    border: 3px solid black;
  }

  button:active {
    transform: scale(0.95);
  }
</style>
</head>

<body>

<div id="chosen">番号を選んでください</div>
<div class="grid" id="buttons"></div>

<script>

/* ================================
   ★現在のステージ（イベントごとに変更）
================================ */

/* =================================
   ★プレイヤー名
================================= */

// 新しいゲーム開始時にリセット


let player = localStorage.getItem("player");

if (!player) {
  player = prompt("名前（あだ名）を入力してください");
  localStorage.setItem("player", player);
}



const chosenDiv = document.getElementById("chosen");
const btnArea   = document.getElementById("buttons");


/* ================================
   ★ボタン生成（1〜10）
================================ */
for (let i = 1; i <= 10; i++) {

  const btn = document.createElement("button");
  btn.innerText = i;

  btn.onclick = () => {

    localStorage.setItem("selectedNumber", i);

    chosenDiv.innerText = `🎯 選択中：${i}番`;

  };

  btnArea.appendChild(btn);
}

</script>

</body>
</html>
