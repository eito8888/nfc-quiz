<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding-top: 60px;
}

h1 {
  font-size: 52px;
}

#msg {
  font-size: 50px;
  font-weight: bold;
  margin-top: 40px;
}

#debug {
  margin-top: 40px;
  font-size: 28px;
  line-height: 1.8;
  font-weight: bold;
  white-space: pre-line;
}
</style>
</head>

<body>

<h1 id="msg">📡 送信中…</h1>

<div id="debug"></div>


<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";


const msgDiv =
document.getElementById("msg");


const debugDiv =
document.getElementById("debug");


const player =
localStorage.getItem("player");


const selected =
localStorage.getItem("selectedNumber");


const params =
new URLSearchParams(
  location.search
);


const dog =
params.get("dog");


const number =
params.get("number");


const tagStage =
params.get("stage");


const sendNumber =
number || dog;


const sendKey =
"sending_" +
String(player || "") +
"_" +
String(selected || "") +
"_" +
String(sendNumber || "") +
"_" +
String(tagStage || "");



function saveSendRecord(record) {

  const key =
    "NFC_SEND_HISTORY";


  let history = [];

  try {

    history =
      JSON.parse(
        localStorage.getItem(key) ||
        "[]"
      );

  } catch (e) {

    history = [];

  }


  history.push(record);


  if (history.length > 100) {

    history =
      history.slice(-100);

  }


  localStorage.setItem(
    key,
    JSON.stringify(history)
  );

}



function send() {

  const measureStart =
    performance.now();


  /*
     ========================================================
     原因追及①
     SEND開始
     ========================================================
  */

  console.log(
    "【SEND開始】",
    "時刻=" + Date.now(),
    "player=" + player,
    "selected=" + selected,
    "number=" + sendNumber,
    "tagStage=" + tagStage
  );


  /*
     スマホで送信ボタンを押した時刻
  */

  const sendStartMs =
    Date.now();


  const startTime =
    new Date(
      sendStartMs
    ).toISOString();


  msgDiv.innerText =
    "📡 送信中…";


  if (
    sessionStorage.getItem(
      sendKey
    ) === "sending"
  ) {

    debugDiv.innerText =
      "二重送信防止";


    console.log(
      "【SEND二重送信防止】",
      "sendKey=" + sendKey
    );

    return;

  }


  sessionStorage.setItem(
    sendKey,
    "sending"
  );


  const fetchStart =
    performance.now();


  const url =
    `${GAS_URL}?player=${encodeURIComponent(player)}` +
    `&selected=${encodeURIComponent(selected)}` +
    `&number=${encodeURIComponent(sendNumber)}` +
    `&tagStage=${encodeURIComponent(tagStage)}` +
    `&clientSendMs=${encodeURIComponent(sendStartMs)}` +
    `&_=${Date.now()}`;


  /*
     ========================================================
     原因追及②
     15秒応答がなければタイムアウト
     ========================================================
  */

  const controller =
    new AbortController();


  const timeoutId =
    setTimeout(
      () => {

        console.error(
          "【SEND TIMEOUT】15秒経過",
          "時刻=" + Date.now()
        );

        controller.abort();

      },
      15000
    );


  fetch(
    url,
    {
      method: "GET",
      cache: "no-store",
      signal: controller.signal
    }
  )


  .then(
    response => {

      clearTimeout(
        timeoutId
      );


      /*
         ====================================================
         原因追及③
         GASからHTTP応答が戻った
         ====================================================
      */

      console.log(
        "【SEND GAS応答】",
        "HTTP=" + response.status,
        "時刻=" + Date.now()
      );


      return response.json();

    }
  )


  .then(
    data => {


      const gasResponseTime =
        performance.now() -
        measureStart;


      const fetchTime =
        performance.now() -
        fetchStart;


      /*
         この回答だけのanswerId
      */

      const answerId =
        String(
          data.answerId || ""
        ).trim();


      console.log(
        "【SEND GAS応答完了】",
        "answerId=" + answerId,
        "fetch=" +
          Math.round(fetchTime) +
          "ms",
        "total=" +
          Math.round(gasResponseTime) +
          "ms"
      );


      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      /*
         実際に
         「送信しました！」
         を表示する直前の時刻
      */

      const sentDisplayMs =
        Date.now();


      const sendDisplayTime =
        performance.now() -
        measureStart;


      msgDiv.innerText =
        "📩 送信しました！";


      debugDiv.innerText =
        "fetch開始 → GAS応答：約 " +
        Math.round(fetchTime) +
        " ms\n\n" +

        "送信開始 → GAS応答：約 " +
        Math.round(gasResponseTime) +
        " ms\n\n" +

        "送信開始 →「送信しました」表示：約 " +
        Math.round(sendDisplayTime) +
        " ms";


      saveSendRecord({

        time:
          startTime,

        sendStartMs:
          sendStartMs,

        sentDisplayMs:
          sentDisplayMs,

        answerId:
          answerId,

        player:
          player,

        selected:
          selected,

        dog:
          dog,

        number:
          sendNumber,

        tagStage:
          tagStage,

        fetchToGas:
          Math.round(fetchTime),

        sendToGas:
          Math.round(gasResponseTime),

        sendToDisplay:
          Math.round(sendDisplayTime),

        result:
          "GAS_RESPONSE"

      });


      /*
         ====================================================
         「送信しました」表示時刻を
         同じanswerIdでGASへ保存
         ====================================================
      */

      if (answerId) {

        const displayUrl =
          `${GAS_URL}?event=sentDisplay` +
          `&answerId=${encodeURIComponent(answerId)}` +
          `&sentDisplayMs=${encodeURIComponent(sentDisplayMs)}` +
          `&_=${Date.now()}`;


        fetch(
          displayUrl,
          {
            method: "GET",
            cache: "no-store"
          }
        )

        .catch(
          error => {

            console.error(
              "【SEND sentDisplay送信エラー】",
              error
            );

          }
        );

      }


      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        10000
      );

    }
  )


  .catch(
    error => {


      clearTimeout(
        timeoutId
      );


      const errorTime =
        performance.now() -
        measureStart;


      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      const errorMs =
        Date.now();


      /*
         ====================================================
         原因追及
         通信エラー / タイムアウト
         ====================================================
      */

      const isTimeout =
        error &&
        error.name === "AbortError";


      if (isTimeout) {

        console.error(
          "【SEND TIMEOUT確定】",
          "15秒",
          "時刻=" + errorMs
        );

        msgDiv.innerText =
          "📩 送信確認中";


        debugDiv.innerText =
          "GASから15秒以内に応答がありませんでした";

      } else {

        console.error(
          "【SEND通信ERROR】",
          "時間=" +
            Math.round(errorTime) +
            "ms",
          "error=" +
            String(error)
        );


        msgDiv.innerText =
          "📩 送信しました！";


        debugDiv.innerText =
          "通信ERROR\n\n" +
          "送信開始 → ERROR：約 " +
          Math.round(errorTime) +
          " ms";

      }


      saveSendRecord({

        time:
          startTime,

        sendStartMs:
          sendStartMs,

        errorTimeMs:
          errorMs,

        player:
          player,

        selected:
          selected,

        dog:
          dog,

        number:
          sendNumber,

        tagStage:
          tagStage,

        sendToError:
          Math.round(errorTime),

        errorMessage:
          String(error),

        result:
          isTimeout
            ? "TIMEOUT"
            : "ERROR"

      });


      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        10000
      );

    }
  );

}


send();

</script>

</body>
</html>
