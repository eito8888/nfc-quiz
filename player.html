<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>回答画面（最強B方式 完成版）</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  /* ★上部メッセージ枠（大きく安定） */
  #chosen {
    font-size: 40px;
    font-weight: bold;

    padding: 35px 15px;
    margin: 20px 15px;

    border: 4px solid black;
    border-radius: 18px;

    background: white;

    /* ✅Safari帯に隠れないよう下げる */
    margin-top: 110px;
  }

  /* ★ボタン配置（横4列固定） */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin: 25px;
  }

  /* ★電卓型ボタン（押しやすい正方形） */
  button {
    font-size: 50px;          /* 数字を大きく */
    font-weight: bold;       /* 太字 */
    border-radius: 20px;

    width: 100%;
    aspect-ratio: 1 / 1;

    background: #ffe600;     /* 黄色 */
    color: black;            /* 黒文字 */

    border: 3px solid black;
  }

  button:active {
    transform: scale(0.95);
  }
</style>
</head>

<body>

<!-- 上部表示 -->
<div id="chosen">番号を選んでください</div>

<!-- ボタン表示 -->
<div class="grid" id="buttons"></div>

<script>
/* ================================
   ★プレイヤー名（初回だけ入力）
================================ */
let player = localStorage.getItem("player");

if (!player) {
  player = prompt("名前（あだ名）を入力してください");
  localStorage.setItem("player", player);
}

/* 表示エリア */
const chosenDiv = document.getElementById("chosen");
const btnArea   = document.getElementById("buttons");

/* ================================
   ★ボタン生成（1〜10）
================================ */
for (let i = 1; i <= 10; i++) {

  const btn = document.createElement("button");
  btn.innerText = i;

  btn.onclick = () => {

    /* ★選択番号を保存（send.htmlが読む） */
    localStorage.setItem("selectedNumber", i);

    /* ★選択中表示 */
    chosenDiv.innerText = `🎯 選択中：${i}番`;

  };

  btnArea.appendChild(btn);
}
</script>

</body>
</html>
