<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クイズモニター</title>

<style>
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h1 {
  margin: 20px 0;
  font-size: 36px;
  color: #333;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding: 10px;
}

.cell {
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  padding: 15px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.answerLine {
  margin-top: 10px;
  color: green;
  font-size: 16px;
  font-weight: bold;
}

img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  margin-top: 10px;
}

.score-container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  padding: 30px;
}

.score-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.score-table th {
  background-color: #ff9800;
  color: white;
  font-size: 24px;
  padding: 15px;
}

.score-table th:first-child {
  border-radius: 10px 0 0 0;
}

.score-table th:last-child {
  border-radius: 0 10px 0 0;
}

.score-table td {
  padding: 18px 20px;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 1px solid #eee;
  color: #333;
}

.score-table tr:nth-child(even) {
  background-color: #fafafa;
}

.score-num {
  color: #e65100;
  font-size: 32px;
}
</style>

</head>

<body>

<h1 id="mainTitle">クイズ</h1>

<div id="displayArea"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";


/* =========================================================
   写真先読み
   ========================================================= */

const preloadedImages = new Map();

function preloadImage(src) {

  if (!src || preloadedImages.has(src)) {
    return;
  }

  const img = new Image();

  img.src = src;

  preloadedImages.set(src, img);
}


/* =========================================================
   診断用状態
   ========================================================= */

if (!window.answerKeys) {
  window.answerKeys = new Set();
}

if (!window.diagnosticRecords) {
  window.diagnosticRecords = new Map();
}


/* =========================================================
   メイン処理
   ========================================================= */

async function load() {

  const loadStart = performance.now();

  try {

    const fetchStart = performance.now();

    const res = await fetch(
      GAS_URL + "?_=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    const fetchEnd = performance.now();

    const data = await res.json();

    const jsonEnd = performance.now();

    const gasFetchTime =
      fetchEnd - fetchStart;

    const jsonTime =
      jsonEnd - fetchEnd;


    const displayArea =
      document.getElementById("displayArea");

    const currentStage =
      Number(data.currentStage);


    /* =====================================================
       写真先読み
       ===================================================== */

    if (data.questions) {

      data.questions.forEach(q => {

        const stage =
          String(q[0]).trim();

        const img =
          q[5];

        if (
          stage === String(currentStage).trim() &&
          img
        ) {

          preloadImage(
            "images/" + img
          );

        }

      });

    }


    /* =====================================================
       新しい回答の検知
       ===================================================== */

    if (data.answers) {

      data.answers.forEach(row => {

        const answerKey =
          row.map(v => String(v)).join("|");


        if (!window.answerKeys.has(answerKey)) {

          window.answerKeys.add(answerKey);


          const detectTime =
            performance.now();


          const player =
            String(row[0]).trim();

          const selected =
            String(row[1]).trim();

          const dog =
            String(row[2]).trim();

          const correct =
            row[3];

          const stage =
            String(row[4]).trim();

          const answerTimestamp =
            row[5];


          const record = {

            player:
              player,

            selected:
              selected,

            dog:
              dog,

            correct:
              correct,

            stage:
              stage,

            gasTimestamp:
              answerTimestamp,

            monitorDetect:
              detectTime,

            fetchTime:
              gasFetchTime,

            jsonTime:
              jsonTime,

            monitorLoadStart:
              loadStart

          };


          window.diagnosticRecords.set(
            answerKey,
            record
          );


          console.log(
            "=============================="
          );

          console.log(
            "【原因追及診断 START】"
          );

          console.log(
            "番号=" + selected,
            "player=" + player,
            "correct=" + correct,
            "stage=" + stage
          );

          console.log(
            "GAS回答記録時刻=",
            answerTimestamp
          );

          console.log(
            "モニター今回fetch=" +
            Math.round(gasFetchTime) +
            "ms"
          );

          console.log(
            "JSON解析=" +
            Math.round(jsonTime) +
            "ms"
          );

          console.log(
            "モニター回答検知=" +
            Math.round(detectTime) +
            "ms"
          );

          console.log(
            "【原因追及診断】"
          );

          console.log(
            "この回答について写真表示完了まで追跡します"
          );

          console.log(
            "=============================="
          );

        }

      });

    }


    /* =====================================================
       Stage = 0
       ===================================================== */

    if (currentStage === 0) {

      document.getElementById(
        "mainTitle"
      ).innerText =
        "🎉 イベント結果発表 🎉";


      if (
        !data.scoreList ||
        data.scoreList.length === 0
      ) {

        displayArea.innerHTML =
          `<div class="score-container">
             <h2>まだ回答データがありません</h2>
           </div>`;

        return;
      }


      let tableRows = "";


      data.scoreList.forEach(item => {

        tableRows += `
          <tr>
            <td style="text-align: left; padding-left: 50px;">
              ${item.player}
            </td>

            <td style="text-align: right; padding-right: 50px;">
              <span class="score-num">
                ${item.total}
              </span> 点
            </td>
          </tr>
        `;

      });


      displayArea.innerHTML = `
        <div class="score-container">

          <table class="score-table">

            <thead>

              <tr>

                <th style="text-align: left; padding-left: 50px;">
                  ニックネーム
                </th>

                <th style="text-align: right; padding-right: 50px;">
                  合計得点
                </th>

              </tr>

            </thead>

            <tbody>
              ${tableRows}
            </tbody>

          </table>

        </div>
      `;

      return;
    }


    /* =====================================================
       Stage > 0
       ===================================================== */

    let stageTitle = "クイズ";

    let correctMap = {};


    /* =====================================================
       正解データマップ
       ===================================================== */

    if (data.answers) {

      data.answers.forEach(row => {

        const player =
          String(row[0]).trim();

        const selected =
          String(row[1]).trim();

        const correct =
          row[3];

        const stage =
          String(row[4]).trim();


        const isCorrect =
          (
            correct === true ||
            correct === "TRUE" ||
            correct === "true"
          );


        if (isCorrect) {

          const key =
            stage + "-" + selected;


          if (!correctMap[key]) {

            correctMap[key] =
              player;

          }

        }

      });

    }


    /* =====================================================
       HTML構築
       ===================================================== */

    const htmlBuildStart =
      performance.now();

    let gridHTML =
      '<div class="grid">';


    if (data.questions) {

      data.questions.forEach(q => {

        const stage =
          String(q[0]).trim();

        const number =
          String(q[1]).trim();

        const title =
          q[3];

        const name =
          q[4];

        const img =
          q[5];


        if (
          stage !==
          String(currentStage).trim()
        ) {

          return;

        }


        stageTitle =
          title || "クイズ";


        const key =
          stage + "-" + number;


        let cellContent =
          `<div class="title">
             【${number}】${name}
           </div>`;


        if (correctMap[key]) {

          cellContent += `
            <div class="answerLine">
              ✅正解 → ${correctMap[key]}
            </div>
          `;


          if (img) {

            const imageSrc =
              "images/" + img;


            cellContent +=
              `<img
                src="${
                  preloadedImages.get(imageSrc)?.src ||
                  imageSrc
                }"
                data-monitor-image="${imageSrc}"
                data-monitor-answer-key="${key}"
              >`;

          }

        }


        gridHTML +=
          `<div class="cell">
             ${cellContent}
           </div>`;

      });

    }


    gridHTML +=
      '</div>';


    const htmlBuildEnd =
      performance.now();


    /* =====================================================
       画面反映
       ===================================================== */

    const renderStart =
      performance.now();


    displayArea.innerHTML =
      gridHTML;


    document.getElementById(
      "mainTitle"
    ).innerText =
      stageTitle;


    const renderEnd =
      performance.now();


    /* =====================================================
       写真表示追跡
       ===================================================== */

    const imageElements =
      displayArea.querySelectorAll(
        "img[data-monitor-image]"
      );


    imageElements.forEach(img => {

      const imageSrc =
        img.getAttribute(
          "data-monitor-image"
        );

      const answerKey =
        img.getAttribute(
          "data-monitor-answer-key"
        );


      const imageStart =
        performance.now();


      const reportImageLoad = () => {

        const imageEnd =
          performance.now();


        const imageLoadTime =
          imageEnd - imageStart;


        const totalFromLoad =
          imageEnd - loadStart;


        const record =
          window.diagnosticRecords.get(
            answerKey
          );


        if (record) {

          const monitorDetectToPhoto =
            imageEnd -
            record.monitorDetect;


          const gasToPhoto =
            imageEnd -
            record.monitorDetect;


          console.log(
            "【原因追及診断 PHOTO】"
          );

          console.log(
            "番号=" +
            record.selected
          );

          console.log(
            "GAS回答記録時刻=" +
            record.gasTimestamp
          );

          console.log(
            "モニター検知→写真=" +
            Math.round(
              monitorDetectToPhoto
            ) +
            "ms"
          );

          console.log(
            "画像読み込み=" +
            Math.round(
              imageLoadTime
            ) +
            "ms"
          );

          console.log(
            "今回load開始→写真=" +
            Math.round(
              totalFromLoad
            ) +
            "ms"
          );

          console.log(
            "HTML構築=" +
            Math.round(
              htmlBuildEnd -
              htmlBuildStart
            ) +
            "ms"
          );

          console.log(
            "画面反映=" +
            Math.round(
              renderEnd -
              renderStart
            ) +
            "ms"
          );


          console.log(
            "【原因追及診断 END】"
          );

          console.log(
            "=============================="
          );


          record.photoTime =
            imageEnd;

        }


        if (
          imageLoadTime >= 5000 ||
          totalFromLoad >= 5000
        ) {

          console.warn(
            "【異常PHOTO計測】",
            imageSrc,
            "HTML構築=" +
              Math.round(
                htmlBuildEnd -
                htmlBuildStart
              ) +
              "ms",
            "画面反映=" +
              Math.round(
                renderEnd -
                renderStart
              ) +
              "ms",
            "画像読み込み=" +
              Math.round(
                imageLoadTime
              ) +
              "ms",
            "load開始から=" +
              Math.round(
                totalFromLoad
              ) +
              "ms"
          );

        }

      };


      if (img.complete) {

        reportImageLoad();

      } else {

        img.addEventListener(
          "load",
          reportImageLoad,
          { once: true }
        );


        img.addEventListener(
          "error",
          () => {

            console.error(
              "【PHOTOエラー】",
              imageSrc
            );

          },
          { once: true }
        );

      }

    });


  } catch (error) {

    console.error(
      "【MONITORエラー】",
      error
    );

  }

}


/* =========================================================
   モニター更新
   ========================================================= */

async function monitorLoop() {

  await load();

  setTimeout(
    monitorLoop,
    1000
  );

}


monitorLoop();

</script>

</body>
</html>
