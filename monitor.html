<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>クイズ モニター</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  h1 {
    margin: 10px;
    font-size: 28px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    padding: 12px;
  }

  .cell {
    border: 2px solid #999;
    border-radius: 12px;
    padding: 8px;
    height: 170px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  .title {
    font-weight: bold;
    font-size: 18px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .answerLine {
    font-size: 16px;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  img {
    margin-top: 6px;
    width: 100%;
    height: 95px;
    object-fit: contain;
  }
</style>
</head>

<body>

<h1 id="mainTitle">クイズ</h1>
<div id="grid" class="grid"></div>

<script>
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbysC8_DE3KENuaTbOynEviquqjhPVcSCxXo6zIREjkKnVrYrHdLey4vH0G8ARhHPPOo/exec";

/* ★現在表示するステージ（playerと合わせる） */
const CURRENT_STAGE = 1;

async function load() {

  const res = await fetch(GAS_URL + "?mode=monitor");
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  let stageTitle = "";

  data.questions.forEach(q => {

    const stage    = Number(q[0]);
    const number   = q[1];
    const category = q[2];
    const title    = q[3];
    const name     = q[4];
    const img      = q[5];

    if (stage !== CURRENT_STAGE) return;

    stageTitle = title || category || "クイズ";

    const div = document.createElement("div");
    div.className = "cell";

    div.innerHTML = `
      <div class="title">【${number}】${name}</div>
    `;

    const key = stage + "-" + number;

    if (data.correctMap[key]) {

      div.innerHTML += `
        <div class="answerLine">
          ✅正解 → ${data.correctMap[key]}
        </div>
      `;

      if (img) {
        div.innerHTML += `<img src="images/${img}">`;
      }
    }

    grid.appendChild(div);
  });

  document.getElementById("mainTitle").innerText = stageTitle;
}

load();
setInterval(load, 1500);
</script>

</body>
</html>
