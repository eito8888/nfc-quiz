<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding-top: 60px;
}

h1 {
  font-size: 52px;
}

#msg {
  font-size: 50px;
  font-weight: bold;
  margin-top: 40px;
}

#backBtn {
  margin-top: 60px;
  font-size: 42px;
  padding: 20px 50px;
  border-radius: 20px;
  background: #ffe066;
  font-weight: bold;
  border: none;
}
</style>
</head>

<body>



<h1 id="msg">📡 送信中…</h1>


<script>
const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msgDiv = document.getElementById("msg");



const player = localStorage.getItem("player");
const selected = localStorage.getItem("selectedNumber");
const dog      = new URLSearchParams(location.search).get("dog");
const number   = new URLSearchParams(location.search).get("number");
const tagStage = new URLSearchParams(location.search).get("stage");


function send() {

  // まず送信中表示
  msgDiv.innerText = "📡 送信中…";

  const sendNumber = number || dog;

const url =
`${GAS_URL}?player=${encodeURIComponent(player)}&selected=${selected}&number=${sendNumber}&tagStage=${tagStage}`;
  fetch(url)

    .then(() => {

      // 送信成功
      msgDiv.innerText = "📩 送信しました！";

      // 1.5秒後に戻る
      setTimeout(() => {

        location.href = "player.html";

      }, 1500);

    })

    .catch(() => {

  // 応答エラーでも参加者には同じ表示
  msgDiv.innerText = "📩 送信しました！";

  setTimeout(() => {

    location.href = "player.html";

  }, 1500);

});

}

send();
</script>

</body>
</html>
