<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding-top: 60px;
}

h1 {
  font-size: 52px;
}

#msg {
  font-size: 50px;
  font-weight: bold;
  margin-top: 40px;
}

#debug {
  margin-top: 40px;
  font-size: 28px;
  line-height: 1.8;
  font-weight: bold;
  white-space: pre-line;
}
</style>
</head>

<body>

<h1 id="msg">📡 送信中…</h1>
<div id="debug"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msgDiv =
document.getElementById("msg");

const debugDiv =
document.getElementById("debug");


/* =========================================================
   プレイヤー情報
   ========================================================= */

const player =
localStorage.getItem("player");

const selected =
localStorage.getItem("selectedNumber");


/* =========================================================
   NFCタグ情報
   ========================================================= */

const params =
new URLSearchParams(location.search);

const dog =
params.get("dog");

const number =
params.get("number");

const tagStage =
params.get("stage");

const sendNumber =
number || dog;


/* =========================================================
   二重送信防止
   ========================================================= */

const sendKey =
"sending_" +
String(player || "") + "_" +
String(selected || "") + "_" +
String(sendNumber || "") + "_" +
String(tagStage || "");


/* =========================================================
   自動保存
   ========================================================= */

function saveSendRecord(record) {

  const key =
    "NFC_SEND_HISTORY";

  let history = [];

  try {

    history =
      JSON.parse(
        localStorage.getItem(key) || "[]"
      );

  } catch (e) {

    history = [];

  }


  history.push(record);


  if (history.length > 100) {

    history =
      history.slice(-100);

  }


  localStorage.setItem(
    key,
    JSON.stringify(history)
  );

}


/* =========================================================
   送信
   ========================================================= */

function send() {

  const measureStart =
    performance.now();

  const sendStartDate =
    new Date();

  const sendStartISO =
    sendStartDate.toISOString();


  msgDiv.innerText =
    "📡 送信中…";


  /* -----------------------------------------
     二重送信防止
     ----------------------------------------- */

  if (
    sessionStorage.getItem(sendKey)
    === "sending"
  ) {

    debugDiv.innerText =
      "二重送信防止";

    return;

  }


  sessionStorage.setItem(
    sendKey,
    "sending"
  );


  /* -----------------------------------------
     GAS URL
     ----------------------------------------- */

  const url =
    `${GAS_URL}?player=${encodeURIComponent(player)}` +
    `&selected=${encodeURIComponent(selected)}` +
    `&number=${encodeURIComponent(sendNumber)}` +
    `&tagStage=${encodeURIComponent(tagStage)}` +
    `&_=${Date.now()}`;


  /* -----------------------------------------
     fetch開始
     ----------------------------------------- */

  const fetchStart =
    performance.now();

  const fetchStartDate =
    new Date();

  const fetchStartISO =
    fetchStartDate.toISOString();


  fetch(url, {
    method: "GET",
    cache: "no-store"
  })

  .then(response => {

    const responseDate =
      new Date();

    const responseISO =
      responseDate.toISOString();


    const gasResponseTime =
      performance.now() -
      measureStart;


    const fetchTime =
      performance.now() -
      fetchStart;


    /* -----------------------------------------
       送信しました表示
       ----------------------------------------- */

    const displayDate =
      new Date();

    const displayISO =
      displayDate.toISOString();


    const sendDisplayTime =
      performance.now() -
      measureStart;


    sessionStorage.setItem(
      sendKey,
      "sent"
    );


    msgDiv.innerText =
      "📩 送信しました！";


    /* -----------------------------------------
       画面表示
       ----------------------------------------- */

    debugDiv.innerText =
      "fetch開始 → GAS応答：約 " +
      Math.round(fetchTime) +
      " ms\n\n" +

      "送信開始 → GAS応答：約 " +
      Math.round(gasResponseTime) +
      " ms\n\n" +

      "送信開始 →「送信しました」表示：約 " +
      Math.round(sendDisplayTime) +
      " ms";


    /* -----------------------------------------
       自動保存
       ----------------------------------------- */

    saveSendRecord({

      time:
        sendStartISO,

      fetchStartTime:
        fetchStartISO,

      gasResponseTimeISO:
        responseISO,

      displayTimeISO:
        displayISO,

      player:
        player,

      selected:
        selected,

      dog:
        dog,

      number:
        sendNumber,

      tagStage:
        tagStage,

      fetchToGas:
        Math.round(fetchTime),

      sendToGas:
        Math.round(gasResponseTime),

      sendToDisplay:
        Math.round(sendDisplayTime),

      result:
        "GAS_RESPONSE"

    });


    /* -----------------------------------------
       1.5秒後に戻る
       ----------------------------------------- */

    setTimeout(() => {

      location.href =
        "player.html";

    }, 1500);

  })


  .catch(error => {

    const errorDate =
      new Date();

    const errorISO =
      errorDate.toISOString();


    const errorTime =
      performance.now() -
      measureStart;


    sessionStorage.setItem(
      sendKey,
      "sent"
    );


    msgDiv.innerText =
      "📩 送信しました！";


    debugDiv.innerText =
      "通信ERROR\n\n" +
      "送信開始 → ERROR：約 " +
      Math.round(errorTime) +
      " ms";


    /* -----------------------------------------
       エラーも自動保存
       ----------------------------------------- */

    saveSendRecord({

      time:
        sendStartISO,

      fetchStartTime:
        fetchStartISO,

      errorTimeISO:
        errorISO,

      player:
        player,

      selected:
        selected,

      dog:
        dog,

      number:
        sendNumber,

      tagStage:
        tagStage,

      sendToError:
        Math.round(errorTime),

      errorMessage:
        String(error),

      result:
        "ERROR"

    });


    /* -----------------------------------------
       1.5秒後に戻る
       ----------------------------------------- */

    setTimeout(() => {

      location.href =
        "player.html";

    }, 1500);

  });

}


/* =========================================================
   実行
   ========================================================= */

send();

</script>

</body>
</html>
