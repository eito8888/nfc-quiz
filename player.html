<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>回答画面（最強B方式・完成版）</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;

    /* ★Safari通知で隠れないよう上に余白 */
    padding-top: 45px;
  }

  /* ★上部メッセージ枠（大きく安定） */
  #chosen {
    font-size: 40px;
    font-weight: bold;

    padding: 35px 15px;
    margin: 20px 15px;

    border: 4px solid black;
    border-radius: 18px;

    background: white;
  }

  /* ★ボタン配置（横4列固定） */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 14px;
    margin: 20px;
  }

  /* ★電卓型：正方形ボタン */
  button {
    font-size: 55px;
    font-weight: bold;
    color: black;

    background: #ffe766; /* 黄色＋黒文字 */

    border: 2px solid #444;
    border-radius: 18px;

    width: 100%;
    aspect-ratio: 1 / 1;

    cursor: pointer;
  }

  /* 押した時の反応 */
  button:active {
    transform: scale(0.95);
  }
</style>
</head>

<body>

<!-- 上部表示 -->
<div id="chosen">番号を選んでください</div>

<!-- ボタン -->
<div class="grid" id="buttons"></div>

<script>
  /***********************
   ★プレイヤー名（初回だけ必ず聞く）
  ***********************/
  let player = localStorage.getItem("player");

  if (!player || player === "null" || player === "") {
    player = prompt("名前（あだ名）を入力してください");
    localStorage.setItem("player", player);
  }

  /***********************
   ★ボタン生成（1〜10）
  ***********************/
  const chosenDiv = document.getElementById("chosen");
  const btnArea   = document.getElementById("buttons");

  for (let i = 1; i <= 10; i++) {

    const btn = document.createElement("button");
    btn.innerText = i;

    btn.onclick = () => {

      /* 選択番号を保存（send.html が読む） */
      localStorage.setItem("selectedNumber", i);

      /* 表示更新 */
      chosenDiv.innerText = `🎯 選択中：${i}番`;

    };

    btnArea.appendChild(btn);
  }
</script>

</body>
</html>
