<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding-top:18px;
  margin:0
}

h1{
  font-size:28px;
  margin:0 0 10px
}

#msg{
  font-size:30px;
  font-weight:bold;
  margin-top:10px
}

#debug{
  margin:12px auto 0;
  font-size:16px;
  line-height:1.22;
  font-weight:bold;
  white-space:pre-line;
  text-align:left;
  padding:0 12px;
  max-width:900px
}
</style>
</head>

<body>

<h1 id="msg">📡 送信中…</h1>
<div id="debug"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msgDiv =
document.getElementById("msg");

const debugDiv =
document.getElementById("debug");

const player =
localStorage.getItem("player");

const selected =
localStorage.getItem("selectedNumber");

const params =
new URLSearchParams(location.search);

const dog =
params.get("dog");

const number =
params.get("number");

const tagStage =
params.get("stage");

const sendNumber =
number || dog;

const sendKey =
"sending_" +
String(player || "") +
"_" +
String(selected || "") +
"_" +
String(sendNumber || "") +
"_" +
String(tagStage || "");

const requestIdKey =
"requestId_" + sendKey;


/*
=========================================================
今回の送信を一意に識別するrequestId
=========================================================
*/

let requestId = "";

try{

  const saved =
    JSON.parse(
      sessionStorage.getItem(requestIdKey) || "null"
    );

  if(
    saved &&
    saved.id &&
    Date.now() - Number(saved.createdAt || 0) < 60000
  ){
    requestId = saved.id;
  }

}catch(e){}

if(!requestId){

  requestId =
    window.crypto &&
    crypto.randomUUID
      ? crypto.randomUUID()
      : (
          "req_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2)
        );

  try{

    sessionStorage.setItem(
      requestIdKey,
      JSON.stringify({
        id:requestId,
        createdAt:Date.now()
      })
    );

  }catch(e){}
}


/*
=========================================================
診断履歴
=========================================================
*/

function saveSendRecord(record){

  try{

    const key =
      "NFC_SEND_HISTORY";

    let history =
      JSON.parse(
        localStorage.getItem(key) || "[]"
      );

    history.push(record);

    if(history.length > 100){
      history =
        history.slice(-100);
    }

    localStorage.setItem(
      key,
      JSON.stringify(history)
    );

  }catch(e){

    console.error(
      "【診断保存ERROR】",
      e
    );

  }

}


/*
=========================================================
直前診断
=========================================================
*/

function saveLastDiagnostic(record){

  try{

    localStorage.setItem(
      "NFC_LAST_DIAGNOSTIC",
      JSON.stringify(record)
    );

  }catch(e){

    console.error(
      "【診断保存ERROR】",
      e
    );

  }

}


/*
=========================================================
画面表示
=========================================================
*/

function showDiagnostic(lines){

  debugDiv.innerText =
    lines.join("\n");

}


/*
=========================================================
ブラウザ状態
=========================================================
*/

function getBrowserState(){

  let c = null;

  try{

    c =
      navigator.connection ||
      navigator.mozConnection ||
      navigator.webkitConnection;

  }catch(e){}

  return {

    online:
      navigator.onLine,

    visibility:
      document.visibilityState,

    readyState:
      document.readyState,

    effectiveType:
      c && c.effectiveType
        ? c.effectiveType
        : "",

    downlink:
      c &&
      typeof c.downlink === "number"
        ? c.downlink
        : null,

    rtt:
      c &&
      typeof c.rtt === "number"
        ? c.rtt
        : null,

    saveData:
      c &&
      typeof c.saveData === "boolean"
        ? c.saveData
        : null,

    userAgent:
      navigator.userAgent

  };

}


function browserLines(s){

  return [

    "【スマホ・ブラウザ状態】",

    "navigator.onLine：" +
      String(s.online),

    "画面状態：" +
      String(s.visibility),

    "document.readyState：" +
      String(s.readyState),

    "通信方式：" +
      (
        s.effectiveType ||
        "取得不可"
      ),

    "推定下り速度：" +
      (
        s.downlink !== null
          ? s.downlink + " Mbps"
          : "取得不可"
      ),

    "推定RTT：" +
      (
        s.rtt !== null
          ? s.rtt + " ms"
          : "取得不可"
      ),

    "SaveData：" +
      (
        s.saveData !== null
          ? String(s.saveData)
          : "取得不可"
      )

  ];

}


/*
=========================================================
Resource Timing
=========================================================
*/

function getResourceTiming(target){

  try{

    const entries =
      performance.getEntriesByType(
        "resource"
      );

    const list =
      entries.filter(
        e =>
          e.name.indexOf(target) === 0
      );

    if(!list.length){
      return null;
    }

    list.sort(
      (a,b) =>
        b.startTime - a.startTime
    );

    const e =
      list[0];

    return {

      startTime:
        e.startTime,

      duration:
        e.duration,

      redirectStart:
        e.redirectStart,

      redirectEnd:
        e.redirectEnd,

      workerStart:
        e.workerStart,

      fetchStart:
        e.fetchStart,

      domainLookupStart:
        e.domainLookupStart,

      domainLookupEnd:
        e.domainLookupEnd,

      connectStart:
        e.connectStart,

      connectEnd:
        e.connectEnd,

      secureConnectionStart:
        e.secureConnectionStart,

      requestStart:
        e.requestStart,

      responseStart:
        e.responseStart,

      responseEnd:
        e.responseEnd,

      transferSize:
        e.transferSize,

      encodedBodySize:
        e.encodedBodySize,

      decodedBodySize:
        e.decodedBodySize,

      nextHopProtocol:
        e.nextHopProtocol || "",

      initiatorType:
        e.initiatorType || ""

    };

  }catch(e){

    return null;

  }

}


function ms(v){

  return (
    typeof v === "number" &&
    Number.isFinite(v)
  )
    ? Math.round(v)
    : "取得不可";

}


function resourceLines(rt){

  if(!rt){

    return [
      "【ブラウザ通信計測】",
      "Resource Timing：記録なし"
    ];

  }

  return [

    "【ブラウザ通信計測】",

    "Resource開始：" +
      ms(rt.startTime) +
      " ms",

    "Resource duration：" +
      ms(rt.duration) +
      " ms",

    "fetchStart：" +
      ms(rt.fetchStart) +
      " ms",

    "DNS開始：" +
      ms(rt.domainLookupStart) +
      " ms",

    "DNS終了：" +
      ms(rt.domainLookupEnd) +
      " ms",

    "接続開始：" +
      ms(rt.connectStart) +
      " ms",

    "接続終了：" +
      ms(rt.connectEnd) +
      " ms",

    "TLS開始：" +
      ms(rt.secureConnectionStart) +
      " ms",

    "HTTP request開始：" +
      ms(rt.requestStart) +
      " ms",

    "HTTP response開始：" +
      ms(rt.responseStart) +
      " ms",

    "HTTP response終了：" +
      ms(rt.responseEnd) +
      " ms",

    "転送サイズ：" +
      ms(rt.transferSize) +
      " bytes",

    "protocol：" +
      (
        rt.nextHopProtocol ||
        "取得不可"
      ),

    "initiator：" +
      (
        rt.initiatorType ||
        "取得不可"
      )

  ];

}


/*
=========================================================
★ スマホ通信診断をGASへ送る

メインfetchとは別経路。
sendBeaconを優先し、
失敗時だけGET keepaliveへフォールバック。

重要：
15秒時点ではanswerIdが無くてもrequestIdで送る。
=========================================================
*/

function sendDiagnosticToGas(t){

  try{

    const p =
      new URLSearchParams();

    p.set(
      "event",
      "sendDiagnostic"
    );

    p.set(
      "requestId",
      t.requestId || ""
    );

    p.set(
      "answerId",
      t.answerId || ""
    );

    p.set(
      "sendStartMs",
      t.sendStartMs || ""
    );

    p.set(
      "fetchStartMs",
      t.fetchStartMs || ""
    );

    p.set(
      "responseMs",
      t.responseMs || ""
    );

    p.set(
      "jsonEndMs",
      t.jsonEndMs || ""
    );

    p.set(
      "sentDisplayMs",
      t.sentDisplayMs || ""
    );

    p.set(
      "timeoutMs",
      t.timeoutMs || ""
    );

    p.set(
      "httpStatus",
      t.httpStatus || ""
    );

    p.set(
      "online",
      String(
        t.browserState?.online ?? ""
      )
    );

    p.set(
      "visibility",
      t.browserState?.visibility || ""
    );

    p.set(
      "effectiveType",
      t.browserState?.effectiveType || ""
    );

    p.set(
      "downlink",
      t.browserState?.downlink ?? ""
    );

    p.set(
      "rtt",
      t.browserState?.rtt ?? ""
    );

    p.set(
      "diagnosis",
      t.diagnosis || ""
    );

    p.set(
      "errorName",
      t.errorName || ""
    );

    p.set(
      "errorMessage",
      t.errorMessage || ""
    );


    const r =
      t.resourceTiming || {};


    const resourceKeys = [

      "duration",
      "domainLookupStart",
      "domainLookupEnd",
      "connectStart",
      "connectEnd",
      "secureConnectionStart",
      "requestStart",
      "responseStart",
      "responseEnd",
      "transferSize"

    ];


    for(
      const k of resourceKeys
    ){

      p.set(
        k,
        r[k] ?? ""
      );

    }


    p.set(
      "protocol",
      r.nextHopProtocol || ""
    );

    p.set(
      "initiator",
      r.initiatorType || ""
    );


    /*
    -------------------------------------------------------
    sendBeacon
    -------------------------------------------------------
    */

    try{

      const beaconAccepted =
        navigator.sendBeacon
          ? navigator.sendBeacon(
              GAS_URL,
              p
            )
          : false;


      if(!beaconAccepted){

        fetch(
          GAS_URL +
          "?" +
          p.toString(),
          {
            method:"GET",
            cache:"no-store",
            keepalive:true
          }
        ).catch(
          () => {}
        );

      }

    }catch(e){

      fetch(
        GAS_URL +
        "?" +
        p.toString(),
        {
          method:"GET",
          cache:"no-store",
          keepalive:true
        }
      ).catch(
        () => {}
      );

    }

  }catch(e){

    console.error(
      "【スマホ診断送信ERROR】",
      e
    );

  }

}


/*
=========================================================
メイン送信
=========================================================
*/

function send(){

  const measureStart =
    performance.now();

  const sendStartMs =
    Date.now();

  const startTime =
    new Date(
      sendStartMs
    ).toISOString();


  const browserState =
    getBrowserState();


  console.log(
    "【SEND開始】",
    sendStartMs,
    player,
    selected,
    sendNumber,
    tagStage,
    "requestId=",
    requestId
  );


  msgDiv.innerText =
    "📡 送信中…";


  /*
  -------------------------------------------------------
  二重送信防止
  -------------------------------------------------------
  */

  if(
    sessionStorage.getItem(
      sendKey
    ) === "sending"
  ){

    debugDiv.innerText =
      "二重送信防止";

    return;

  }


  sessionStorage.setItem(
    sendKey,
    "sending"
  );


  /*
  -------------------------------------------------------
  fetch開始
  -------------------------------------------------------
  */

  const fetchStart =
    performance.now();

  const fetchStartMs =
    Date.now();


  const sendToFetchMs =
    Math.max(
      0,
      Math.round(
        fetchStartMs -
        sendStartMs
      )
    );


  console.log(
    "【SEND送信→fetch開始】",
    sendToFetchMs + " ms"
  );


  const url =
    `${GAS_URL}` +
    `?player=${encodeURIComponent(player)}` +
    `&selected=${encodeURIComponent(selected)}` +
    `&number=${encodeURIComponent(sendNumber)}` +
    `&tagStage=${encodeURIComponent(tagStage)}` +
    `&clientSendMs=${encodeURIComponent(sendStartMs)}` +
    `&requestId=${encodeURIComponent(requestId)}` +
    `&_=${Date.now()}`;


  /*
  =======================================================
  ★ 15秒でabortしない
  =======================================================

  15秒は「通信失敗確定」ではない。

  15秒時点では、
  「まだHTTP responseが来ていない」
  という事実だけを記録する。

  fetch自体はそのまま継続する。
  =======================================================
  */

  let warning15Sent =
    false;


  const timeoutId =
    setTimeout(
      () => {

        warning15Sent =
          true;


        const timeoutNow =
          Date.now();

        const elapsed =
          performance.now() -
          measureStart;


        const rt =
          getResourceTiming(
            GAS_URL
          );


        const bs =
          getBrowserState();


        let diagnosis =
          "15秒経過・HTTP応答待ち継続";


        if(
          rt &&
          rt.responseStart > 0
        ){

          diagnosis =
            "HTTP response開始まで確認済み";

        }else if(
          rt &&
          rt.requestStart > 0
        ){

          diagnosis =
            "HTTP request開始まで確認済み。response待ち";

        }else if(
          rt &&
          rt.connectStart > 0
        ){

          diagnosis =
            "接続開始まで確認済み。request待ち";

        }else if(
          rt &&
          rt.fetchStart > 0
        ){

          diagnosis =
            "fetch開始確認済み。以降の通信進行を計測継続";

        }else if(
          bs.online === false
        ){

          diagnosis =
            "15秒時点でnavigator.onLine=false";

        }


        /*
        ---------------------------------------------------
        ★ ここが今回の重要部分

        answerIdはまだ無い。
        しかしrequestIdは既にある。

        したがってGAS側で診断行を先に作れる。
        ---------------------------------------------------
        */

        sendDiagnosticToGas({

          requestId:

            requestId,

          answerId:

            "",

          sendStartMs:

            sendStartMs,

          fetchStartMs:

            fetchStartMs,

          responseMs:

            "",

          jsonEndMs:

            "",

          sentDisplayMs:

            "",

          timeoutMs:

            timeoutNow,

          httpStatus:

            "",

          browserState:

            bs,

          resourceTiming:

            rt,

          diagnosis:

            diagnosis

        });


        saveLastDiagnostic({

          result:
            "OVER_15S_WAITING",

          time:
            startTime,

          requestId:
            requestId,

          sendStartMs:
            sendStartMs,

          fetchStartMs:
            fetchStartMs,

          timeoutMs:
            timeoutNow,

          elapsedMs:
            Math.round(elapsed),

          player:
            player,

          selected:
            selected,

          number:
            sendNumber,

          tagStage:
            tagStage,

          diagnosis:
            diagnosis,

          browserState:
            bs,

          resourceTiming:
            rt

        });


        showDiagnostic([

          "【送信診断】15秒経過",

          "送信開始 → fetch開始：" +
            sendToFetchMs +
            " ms",

          "fetch開始 → 15秒警告：" +
            Math.round(
              performance.now() -
              fetchStart
            ) +
            " ms",

          "HTTP response：未受信",

          "JSON解析：未実行",

          "answerId：未取得",

          "requestId：" +
            requestId,

          "【重要】fetchは継続中",

          "【判定】" +
            diagnosis,

          ...browserLines(bs),

          ...resourceLines(rt)

        ]);

      },

      15000

    );


  /*
  =======================================================
  ★ メインHTTP通信
  =======================================================
  */

  fetch(
    url,
    {
      method:
        "GET",

      cache:
        "no-store"

    }
  )


  /*
  =======================================================
  E HTTP response受信
  =======================================================
  */

  .then(
    response => {

      const responseMs =
        Date.now();

      const responseElapsed =
        performance.now() -
        measureStart;


      window.__sendResponseMs =
        responseMs;

      window.__sendResponseElapsed =
        responseElapsed;

      window.__sendResponseStatus =
        response.status;


      clearTimeout(
        timeoutId
      );


      console.log(
        "【SEND HTTP response受信】",
        response.status,
        responseMs,
        responseElapsed
      );


      /*
      ---------------------------------------------------
      Eをこの時点で別経路からGASへ送る

      ここではまだanswerIdは無い。
      requestIdだけで送る。
      ---------------------------------------------------
      */

      sendDiagnosticToGas({

        requestId:
          requestId,

        answerId:
          "",

        sendStartMs:
          sendStartMs,

        fetchStartMs:
          fetchStartMs,

        responseMs:
          responseMs,

        jsonEndMs:
          "",

        sentDisplayMs:
          "",

        timeoutMs:
          "",

        httpStatus:
          response.status,

        browserState:
          getBrowserState(),

        resourceTiming:
          getResourceTiming(GAS_URL),

        diagnosis:
          warning15Sent
            ? "15秒超過後にHTTP response受信"
            : "HTTP response受信"

      });


      if(
        !response.ok
      ){

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      return response.json();

    }
  )


  /*
  =======================================================
  F response.json()完了
  G answerId取得
  =======================================================
  */

  .then(
    data => {

      const jsonEnd =
        performance.now();

      const jsonEndMs =
        Date.now();


      const fetchTime =
        jsonEnd -
        fetchStart;


      const responseMs =
        window.__sendResponseMs ||
        0;


      const gasReceiveMs =
        Number(
          data.gasReceiveMs
        ) || 0;


      const gasCompleteMs =
        Number(
          data.gasCompleteMs
        ) || 0;


      /*
      ---------------------------------------------------
      G answerId
      ---------------------------------------------------
      */

      const answerId =
        String(
          data.answerId || ""
        ).trim();


      const gasInternalMs =
        (
          gasReceiveMs &&
          gasCompleteMs
        )
          ? (
              gasCompleteMs -
              gasReceiveMs
            )
          : 0;


      const fetchToGasReceiveMs =
        (
          gasReceiveMs &&
          fetchStartMs
        )
          ? Math.max(
              0,
              Math.round(
                gasReceiveMs -
                fetchStartMs
              )
            )
          : 0;


      const sendToGasReceiveMs =
        gasReceiveMs
          ? Math.max(
              0,
              Math.round(
                gasReceiveMs -
                sendStartMs
              )
            )
          : 0;


      const gasCompleteToResponseMs =
        (
          gasCompleteMs &&
          responseMs
        )
          ? Math.round(
              responseMs -
              gasCompleteMs
            )
          : 0;


      const gasOutsideMs =
        Math.max(
          0,
          Math.round(
            fetchTime -
            gasInternalMs
          )
        );


      /*
      ---------------------------------------------------
      「送信しました」表示時刻
      ---------------------------------------------------
      */

      const sentDisplayMs =
        Date.now();

      const sendDisplayTime =
        performance.now() -
        measureStart;


      const jsonParseMs =
        Math.max(
          0,
          Math.round(
            jsonEnd -
            (
              measureStart +
              (
                window.__sendResponseElapsed ||
                0
              )
            )
          )
        );


      const rt =
        getResourceTiming(
          GAS_URL
        );


      const bs =
        getBrowserState();


      const status =
        window.__sendResponseStatus;


      msgDiv.innerText =
        "📩 送信しました！";


      /*
      ---------------------------------------------------
      診断表示
      ---------------------------------------------------
      */

      showDiagnostic([

        "【今回の送信診断】",

        "requestId：" +
          requestId,

        "answerId：" +
          answerId,

        "送信開始 → fetch開始：" +
          sendToFetchMs +
          " ms",

        "fetch開始 → GAS受信：" +
          fetchToGasReceiveMs +
          " ms",

        "fetch開始 → HTTP response：" +
          Math.round(fetchTime) +
          " ms",

        "送信開始 → GAS受信（目安）：" +
          sendToGasReceiveMs +
          " ms",

        "GAS受信 → GAS処理完了：" +
          Math.round(gasInternalMs) +
          " ms",

        "GAS処理完了 → HTTP response（目安）：" +
          gasCompleteToResponseMs +
          " ms",

        "GAS外の時間：" +
          gasOutsideMs +
          " ms",

        "HTTP response → JSON完了：" +
          jsonParseMs +
          " ms",

        "送信開始 →「送信しました」：" +
          Math.round(sendDisplayTime) +
          " ms",

        "HTTP：" +
          status,

        "15秒超過：" +
          (
            warning15Sent
              ? "はい"
              : "いいえ"
          ),

        ...browserLines(bs),

        ...resourceLines(rt)

      ]);


      /*
      ===================================================
      ★ E/F/Gを一括してGASへ送る

      E responseMs
      F jsonEndMs
      G answerId

      これでrequestIdだけで作られた診断行を
      answerId付きの通常行へ紐付ける。
      ===================================================
      */

      sendDiagnosticToGas({

        requestId:
          requestId,

        answerId:
          answerId,

        sendStartMs:
          sendStartMs,

        fetchStartMs:
          fetchStartMs,

        responseMs:
          responseMs,

        jsonEndMs:
          jsonEndMs,

        sentDisplayMs:
          sentDisplayMs,

        timeoutMs:
          "",

        httpStatus:
          status,

        browserState:
          bs,

        resourceTiming:
          rt,

        diagnosis:
          warning15Sent
            ? "15秒超過後にHTTP response受信・answerId取得"
            : "正常",

        errorName:
          "",

        errorMessage:
          ""

      });


      /*
      ---------------------------------------------------
      ローカル診断保存
      ---------------------------------------------------
      */

      const diagnostic = {

        result:
          "GAS_RESPONSE",

        time:
          startTime,

        requestId:
          requestId,

        sendStartMs:
          sendStartMs,

        fetchStartMs:
          fetchStartMs,

        responseMs:
          responseMs,

        jsonEndMs:
          jsonEndMs,

        sentDisplayMs:
          sentDisplayMs,

        answerId:
          answerId,

        player:
          player,

        selected:
          selected,

        dog:
          dog,

        number:
          sendNumber,

        tagStage:
          tagStage,

        fetchMs:
          Math.round(
            fetchTime
          ),

        sendToFetchMs:
          sendToFetchMs,

        fetchToGasReceiveMs:
          fetchToGasReceiveMs,

        sendToGasReceiveMs:
          sendToGasReceiveMs,

        gasInternalMs:
          Math.round(
            gasInternalMs
          ),

        gasCompleteToResponseMs:
          gasCompleteToResponseMs,

        gasOutsideMs:
          gasOutsideMs,

        sendToDisplayMs:
          Math.round(
            sendDisplayTime
          ),

        httpStatus:
          status,

        jsonParseMs:
          jsonParseMs,

        warning15Sent:
          warning15Sent,

        browserState:
          bs,

        resourceTiming:
          rt

      };


      saveLastDiagnostic(
        diagnostic
      );

      saveSendRecord(
        diagnostic
      );


      /*
      ---------------------------------------------------
      15秒後に遷移
      ---------------------------------------------------
      */

      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        15000
      );

    }
  )


  /*
  =======================================================
  通信ERROR
  =======================================================
  */

  .catch(
    error => {

      clearTimeout(
        timeoutId
      );


      const errorTime =
        performance.now() -
        measureStart;


      const errorMs =
        Date.now();


      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      const rt =
        getResourceTiming(
          GAS_URL
        );


      const bs =
        getBrowserState();


      const errorName =
        error &&
        error.name
          ? error.name
          : "";


      const errorMessage =
        String(error);


      const diagnosis =
        "HTTP通信ERROR";


      msgDiv.innerText =
        "📩 送信確認中";


      showDiagnostic([

        "【送信診断】通信ERROR",

        "送信開始 → ERROR：" +
          Math.round(errorTime) +
          " ms",

        "requestId：" +
          requestId,

        "error：" +
          errorMessage,

        "error.name：" +
          errorName,

        ...browserLines(bs),

        ...resourceLines(rt)

      ]);


      /*
      ---------------------------------------------------
      ★ ERRORでもrequestIdで診断を残す
      ---------------------------------------------------
      */

      sendDiagnosticToGas({

        requestId:
          requestId,

        answerId:
          "",

        sendStartMs:
          sendStartMs,

        fetchStartMs:
          fetchStartMs,

        responseMs:
          "",

        jsonEndMs:
          "",

        sentDisplayMs:
          Date.now(),

        timeoutMs:
          "",

        httpStatus:
          "",

        browserState:
          bs,

        resourceTiming:
          rt,

        diagnosis:
          diagnosis,

        errorName:
          errorName,

        errorMessage:
          errorMessage

      });


      const diagnostic = {

        result:
          "ERROR",

        time:
          startTime,

        sendStartMs:
          sendStartMs,

        fetchStartMs:
          fetchStartMs,

        requestId:
          requestId,

        errorMs:
          errorMs,

        elapsedMs:
          Math.round(
            errorTime
          ),

        errorMessage:
          errorMessage,

        errorName:
          errorName,

        player:
          player,

        selected:
          selected,

        number:
          sendNumber,

        tagStage:
          tagStage,

        diagnosis:
          diagnosis,

        browserState:
          bs,

        resourceTiming:
          rt

      };


      saveLastDiagnostic(
        diagnostic
      );

      saveSendRecord(
        diagnostic
      );


      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        15000
      );

    }
  );

}


send();

</script>

</body>
</html>
