<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding-top: 60px;
}

h1 {
  font-size: 52px;
}

#msg {
  font-size: 50px;
  font-weight: bold;
  margin-top: 40px;
}

#backBtn {
  margin-top: 60px;
  font-size: 42px;
  padding: 20px 50px;
  border-radius: 20px;
  background: #ffe066;
  font-weight: bold;
  border: none;
}
</style>
</head>

<body>

<h1 id="msg">📡 送信中…</h1>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msgDiv =
  document.getElementById("msg");


// ================================
// プレイヤー情報
// ================================

const player =
  localStorage.getItem("player");

const selected =
  localStorage.getItem("selectedNumber");


// ================================
// NFCタグの情報
// ================================

const params =
  new URLSearchParams(location.search);

const dog =
  params.get("dog");

const number =
  params.get("number");

const tagStage =
  params.get("stage");

const sendNumber =
  number || dog;


// ================================
// 二重送信防止用キー
// ================================

const sendKey =
  "sending_" +
  String(player || "") + "_" +
  String(selected || "") + "_" +
  String(sendNumber || "") + "_" +
  String(tagStage || "");


// ================================
// 送信処理
// ================================

function send() {

  msgDiv.innerText =
    "📡 送信中…";


  // 送信ボタンからの計測開始時刻
  const clientSendMs =
    Date.now();


  // 同じページで送信処理が
  // すでに始まっている場合は送信しない
  if (
    sessionStorage.getItem(sendKey) ===
    "sending"
  ) {
    return;
  }


  sessionStorage.setItem(
    sendKey,
    "sending"
  );


  // ================================
  // GASへ送るURL
  // ================================

  const url =
    `${GAS_URL}?player=${encodeURIComponent(player)}` +
    `&selected=${encodeURIComponent(selected)}` +
    `&number=${encodeURIComponent(sendNumber)}` +
    `&tagStage=${encodeURIComponent(tagStage)}` +
    `&clientSendMs=${encodeURIComponent(clientSendMs)}`;


  // ================================
  // GASへ送信
  // ================================

  fetch(url)

    .then(response => {

      return response.json();

    })

    .then(data => {

      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      // 「送信しました」表示時刻
      const sentDisplayMs =
        Date.now();


      msgDiv.innerText =
        "📩 送信しました！";


      // ================================
      // 「送信しました」表示時刻を
      // GASのtiming_logへ保存
      // ================================

      if (data.answerId) {

        const timingUrl =
          `${GAS_URL}?event=sentDisplay` +
          `&answerId=${encodeURIComponent(data.answerId)}` +
          `&sentDisplayMs=${encodeURIComponent(sentDisplayMs)}`;

        fetch(timingUrl)
          .catch(() => {
            // 計測送信の失敗では
            // クイズ動作を止めない
          });
      }


      // 1.5秒後に番号選択画面へ戻る
      setTimeout(() => {

        location.href =
          "player.html";

      }, 1500);

    })


    .catch(() => {

      /*
       * GAS側では回答処理が完了していても、
       * スマホ側で応答を受け取れない場合があります。
       *
       * 現在の運用と同じく、
       * 「送信しました！」として戻ります。
       *
       * ただし、この場合はGASから
       * answerIdを受け取れていないため、
       * 「送信しました」時刻の内部保存は行いません。
       */

      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      msgDiv.innerText =
        "📩 送信しました！";


      // 1.5秒後に番号選択画面へ戻る
      setTimeout(() => {

        location.href =
          "player.html";

      }, 1500);

    });

}


// ================================
// 実行
// ================================

send();

</script>

</body>
</html>
