<script>
const GAS_URL = "あなたのURL";

async function load() {

  const res = await fetch(GAS_URL + "?mode=monitor");
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  let stageTitle = "クイズ";

  data.questions.forEach(q => {

    const stage  = Number(q[0]);
    const number = q[1];
    const title  = q[3];
    const name   = q[4];
    const img    = q[5];

    stageTitle = title || "クイズ";

    const div = document.createElement("div");
    div.className = "cell";

    div.innerHTML = `<div class="title">【${number}】${name}</div>`;

    const key = stage + "-" + number;

    if (data.correctMap[key]) {

      div.innerHTML += `
        <div class="answerLine">
          ✅正解 → ${data.correctMap[key]}
        </div>
      `;

      if (img) {
        div.innerHTML += `<img src="images/${img}">`;
      }
    }

    grid.appendChild(div);
  });

  document.getElementById("mainTitle").innerText = stageTitle;
}

load();
setInterval(load, 1500);
</script>
