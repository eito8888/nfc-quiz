<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>送信中...</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding-top:25px;
  margin:0;
}

#msg{
  font-size:36px;
  font-weight:bold;
  margin:0 0 20px;
}

#debug{
  font-size:18px;
  line-height:1.35;
  white-space:pre-line;
  text-align:left;
  padding:0 12px;
  max-width:900px;
  margin:auto;
}
</style>
</head>

<body>

<div id="msg">📡 送信中…</div>
<div id="debug"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msg = document.getElementById("msg");
const debug = document.getElementById("debug");

const pageStartMs = Date.now();

const player =
localStorage.getItem("player");

const selected =
localStorage.getItem("selectedNumber");

const params =
new URLSearchParams(location.search);

const dog =
params.get("dog");

const number =
params.get("number");

const tagStage =
params.get("stage");

const sendNumber =
number || dog;


/*
=========================================================
二重送信防止
=========================================================
*/

const sendKey =
"sending_" +
String(player || "") + "_" +
String(selected || "") + "_" +
String(sendNumber || "") + "_" +
String(tagStage || "");


if(
  sessionStorage.getItem(sendKey) === "sending" ||
  sessionStorage.getItem(sendKey) === "sent"
){
  msg.innerText = "📩 送信しました！";
  debug.innerText = "二重送信防止";
}else{

  sessionStorage.setItem(
    sendKey,
    "sending"
  );

  startSend();

}


/*
=========================================================
診断保存
=========================================================
*/

function saveHistory(data){

  try{

    const key = "NFC_SEND_HISTORY";

    let history =
      JSON.parse(
        localStorage.getItem(key) || "[]"
      );

    history.push(data);

    if(history.length > 100){
      history = history.slice(-100);
    }

    localStorage.setItem(
      key,
      JSON.stringify(history)
    );

  }catch(e){

    console.log(
      "history save error",
      e
    );

  }

}


/*
=========================================================
「送信しました」時刻をGASへ通知
=========================================================
*/

function sendSentDisplay(
  answerId,
  sendStartMs,
  sentDisplayMs
){

  const url =
    GAS_URL +
    "?event=sentDisplay" +
    "&answerId=" +
    encodeURIComponent(answerId || "") +
    "&clientSendMs=" +
    encodeURIComponent(sendStartMs) +
    "&sentDisplayMs=" +
    encodeURIComponent(sentDisplayMs) +
    "&player=" +
    encodeURIComponent(player || "") +
    "&number=" +
    encodeURIComponent(sendNumber || "") +
    "&stage=" +
    encodeURIComponent(tagStage || "") +
    "&_=" +
    Date.now();


  /*
    これは診断用。
    「送信しました」の画面表示を
    この通信の完了待ちにはしない。
  */

  fetch(
    url,
    {
      method:"GET",
      cache:"no-store",
      keepalive:true
    }
  ).catch(
    () => {}
  );

}


/*
=========================================================
送信本線
=========================================================
*/

function startSend(){

  const sendStartMs =
    Date.now();

  const sendStartPerf =
    performance.now();

  const fetchStartPerf =
    performance.now();

  const fetchStartMs =
    Date.now();


  const url =
    GAS_URL +
    "?player=" +
    encodeURIComponent(player || "") +
    "&selected=" +
    encodeURIComponent(selected || "") +
    "&number=" +
    encodeURIComponent(sendNumber || "") +
    "&tagStage=" +
    encodeURIComponent(tagStage || "") +
    "&clientSendMs=" +
    encodeURIComponent(sendStartMs) +
    "&_=" +
    Date.now();


  fetch(
    url,
    {
      method:"GET",
      cache:"no-store"
    }
  )

  .then(
    response => {

      const responseMs =
        Date.now();

      if(!response.ok){

        throw new Error(
          "HTTP " + response.status
        );

      }

      return response.json()
        .then(
          data => ({
            data:data,
            responseMs:responseMs
          })
        );

    }
  )

  .then(
    result => {

      const data =
        result.data;

      const responseMs =
        result.responseMs;

      const sentDisplayMs =
        Date.now();

      const elapsedMs =
        sentDisplayMs -
        sendStartMs;

      const answerId =
        String(
          data.answerId || ""
        );


      /*
      ================================================
      ★ここで即表示
      ================================================
      */

      sessionStorage.setItem(
        sendKey,
        "sent"
      );

      msg.innerText =
        "📩 送信しました！";


      /*
      ================================================
      ★送信→送信しました を記録
      ================================================
      */

      sendSentDisplay(
        answerId,
        sendStartMs,
        sentDisplayMs
      );


      /*
      ローカルにも必ず残す
      */

      saveHistory({

        result:"GAS_RESPONSE",

        pageStartMs:
          pageStartMs,

        sendStartMs:
          sendStartMs,

        fetchStartMs:
          fetchStartMs,

        responseMs:
          responseMs,

        sentDisplayMs:
          sentDisplayMs,

        sendToSentMs:
          elapsedMs,

        answerId:
          answerId,

        player:
          player,

        selected:
          selected,

        number:
          sendNumber,

        stage:
          tagStage

      });


      debug.innerText =
        "送信開始 → 送信しました：" +
        elapsedMs +
        " ms\n" +
        "HTTP：" +
        responseMs;


      /*
      ================================================
      ★「送信しました」を読める時間にする
      ================================================
      */

      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        2500
      );

    }
  )

  .catch(
    error => {

      const errorMs =
        Date.now();

      const elapsedMs =
        errorMs -
        sendStartMs;


      /*
        エラーでもゲームを永久停止させない
      */

      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      msg.innerText =
        "📩 送信しました！";


      debug.innerText =
        "送信開始 → 通信終了：" +
        elapsedMs +
        " ms\n" +
        "通信：" +
        String(error);


      saveHistory({

        result:"ERROR",

        pageStartMs:
          pageStartMs,

        sendStartMs:
          sendStartMs,

        errorMs:
          errorMs,

        elapsedMs:
          elapsedMs,

        error:
          String(error),

        player:
          player,

        selected:
          selected,

        number:
          sendNumber,

        stage:
          tagStage

      });


      /*
        エラーでも次の問題へ
      */

      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        2500
      );

    }
  );

}

</script>

</body>
</html>
