<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding-top: 60px;
}

h1 {
  font-size: 52px;
}

#msg {
  font-size: 50px;
  font-weight: bold;
  margin-top: 40px;
}

#debug {
  margin-top: 40px;
  font-size: 28px;
  line-height: 1.8;
  font-weight: bold;
  white-space: pre-line;
  text-align: left;
  padding: 20px;
}
</style>
</head>

<body>

<h1 id="msg">📡 送信中…</h1>

<div id="debug"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";


const msgDiv =
document.getElementById("msg");


const debugDiv =
document.getElementById("debug");


const player =
localStorage.getItem("player");


const selected =
localStorage.getItem("selectedNumber");


const params =
new URLSearchParams(
  location.search
);


const dog =
params.get("dog");


const number =
params.get("number");


const tagStage =
params.get("stage");


const sendNumber =
number || dog;


const sendKey =
"sending_" +
String(player || "") +
"_" +
String(selected || "") +
"_" +
String(sendNumber || "") +
"_" +
String(tagStage || "");


/* =========================================================
   診断履歴
   ※ サーバーへは送らない
   ========================================================= */

function saveSendRecord(record) {

  const key =
    "NFC_SEND_HISTORY";

  let history = [];

  try {

    history =
      JSON.parse(
        localStorage.getItem(key) ||
        "[]"
      );

  } catch (e) {

    history = [];

  }

  history.push(record);

  if (history.length > 100) {

    history =
      history.slice(-100);

  }

  localStorage.setItem(
    key,
    JSON.stringify(history)
  );

}


/* =========================================================
   直前診断結果を保存
   ========================================================= */

function saveLastDiagnostic(record) {

  try {

    localStorage.setItem(
      "NFC_LAST_DIAGNOSTIC",
      JSON.stringify(record)
    );

  } catch (e) {

    console.error(
      "【診断保存ERROR】",
      e
    );

  }

}


/* =========================================================
   診断結果表示
   ========================================================= */

function showDiagnostic(lines) {

  debugDiv.innerText =
    lines.join("\n\n");

}


/* =========================================================
   数値表示
   ========================================================= */

function msValue(value) {

  if (
    typeof value !== "number" ||
    !Number.isFinite(value)
  ) {
    return "取得不可";
  }

  if (value <= 0) {
    return "0";
  }

  return Math.round(value);

}


/* =========================================================
   Performance Resource Timing取得
   ========================================================= */

function getResourceTiming(targetUrl) {

  const entries =
    performance.getEntriesByType(
      "resource"
    );

  let candidates =
    entries.filter(
      entry =>
        entry.name.indexOf(
          targetUrl
        ) === 0
    );

  if (!candidates.length) {

    return null;

  }

  candidates.sort(
    (a, b) =>
      b.startTime - a.startTime
  );

  const e =
    candidates[0];

  return {

    name:
      e.name,

    startTime:
      e.startTime,

    duration:
      e.duration,

    redirectStart:
      e.redirectStart,

    redirectEnd:
      e.redirectEnd,

    workerStart:
      e.workerStart,

    fetchStart:
      e.fetchStart,

    domainLookupStart:
      e.domainLookupStart,

    domainLookupEnd:
      e.domainLookupEnd,

    connectStart:
      e.connectStart,

    connectEnd:
      e.connectEnd,

    secureConnectionStart:
      e.secureConnectionStart,

    requestStart:
      e.requestStart,

    responseStart:
      e.responseStart,

    responseEnd:
      e.responseEnd,

    transferSize:
      e.transferSize,

    encodedBodySize:
      e.encodedBodySize,

    decodedBodySize:
      e.decodedBodySize,

    nextHopProtocol:
      e.nextHopProtocol || "",

    initiatorType:
      e.initiatorType || ""

  };

}


/* =========================================================
   Resource Timing診断文字列
   ========================================================= */

function resourceTimingLines(rt) {

  if (!rt) {

    return [
      "【ブラウザ通信計測】",
      "Resource Timing：記録なし"
    ];

  }

  return [

    "【ブラウザ通信計測】",

    "Resource開始：" +
      msValue(rt.startTime) +
      " ms",

    "Resource duration：" +
      msValue(rt.duration) +
      " ms",

    "fetchStart：" +
      msValue(rt.fetchStart) +
      " ms",

    "DNS開始：" +
      msValue(rt.domainLookupStart) +
      " ms",

    "DNS終了：" +
      msValue(rt.domainLookupEnd) +
      " ms",

    "接続開始：" +
      msValue(rt.connectStart) +
      " ms",

    "接続終了：" +
      msValue(rt.connectEnd) +
      " ms",

    "TLS開始：" +
      msValue(rt.secureConnectionStart) +
      " ms",

    "HTTP request開始：" +
      msValue(rt.requestStart) +
      " ms",

    "HTTP response開始：" +
      msValue(rt.responseStart) +
      " ms",

    "HTTP response終了：" +
      msValue(rt.responseEnd) +
      " ms",

    "転送サイズ：" +
      msValue(rt.transferSize) +
      " bytes",

    "protocol：" +
      (rt.nextHopProtocol || "取得不可"),

    "initiator：" +
      (rt.initiatorType || "取得不可")

  ];

}


/* =========================================================
   ブラウザ状態診断
   ========================================================= */

function getBrowserState() {

  let connection = null;

  try {

    connection =
      navigator.connection ||
      navigator.mozConnection ||
      navigator.webkitConnection;

  } catch (e) {

    connection = null;

  }

  return {

    online:
      navigator.onLine,

    visibility:
      document.visibilityState,

    readyState:
      document.readyState,

    connectionType:
      connection &&
      connection.effectiveType
        ? connection.effectiveType
        : "",

    downlink:
      connection &&
      typeof connection.downlink === "number"
        ? connection.downlink
        : null,

    rtt:
      connection &&
      typeof connection.rtt === "number"
        ? connection.rtt
        : null,

    saveData:
      connection &&
      typeof connection.saveData === "boolean"
        ? connection.saveData
        : null,

    userAgent:
      navigator.userAgent

  };

}


/* =========================================================
   ブラウザ状態表示
   ========================================================= */

function browserStateLines(state) {

  return [

    "【スマホ・ブラウザ状態】",

    "navigator.onLine：" +
      String(state.online),

    "画面状態：" +
      String(state.visibility),

    "document.readyState：" +
      String(state.readyState),

    "通信方式：" +
      (state.connectionType || "取得不可"),

    "推定下り速度：" +
      (
        state.downlink !== null
          ? state.downlink + " Mbps"
          : "取得不可"
      ),

    "推定RTT：" +
      (
        state.rtt !== null
          ? state.rtt + " ms"
          : "取得不可"
      ),

    "SaveData：" +
      (
        state.saveData !== null
          ? String(state.saveData)
          : "取得不可"
      )

  ];

}


/* =========================================================
   メイン送信
   ========================================================= */

function send() {


  /*
   ========================================================
   ① SEND開始
   ========================================================
  */

  const measureStart =
    performance.now();

  const sendStartMs =
    Date.now();

  const startTime =
    new Date(
      sendStartMs
    ).toISOString();


  console.log(
    "【SEND開始】",
    "時刻=" + sendStartMs,
    "player=" + player,
    "selected=" + selected,
    "number=" + sendNumber,
    "tagStage=" + tagStage
  );


  msgDiv.innerText =
    "📡 送信中…";


  /*
   ========================================================
   ブラウザ状態取得
   ========================================================
  */

  const browserState =
    getBrowserState();


  console.log(
    "【SENDブラウザ状態】",
    browserState
  );


  /*
   ========================================================
   ② 二重送信防止
   ========================================================
  */

  if (
    sessionStorage.getItem(
      sendKey
    ) === "sending"
  ) {

    debugDiv.innerText =
      "二重送信防止";

    console.log(
      "【SEND二重送信防止】",
      "sendKey=" + sendKey
    );

    return;
  }


  sessionStorage.setItem(
    sendKey,
    "sending"
  );


  /*
   ========================================================
   ③ fetch開始直前
   ========================================================
  */

  const fetchStart =
    performance.now();

  const fetchStartMs =
    Date.now();


  console.log(
    "【SEND fetch開始直前】",
    "時刻=" + fetchStartMs
  );


  /*
   ========================================================
   URL生成
   ========================================================
  */

  const url =
    `${GAS_URL}?player=${encodeURIComponent(player)}` +
    `&selected=${encodeURIComponent(selected)}` +
    `&number=${encodeURIComponent(sendNumber)}` +
    `&tagStage=${encodeURIComponent(tagStage)}` +
    `&clientSendMs=${encodeURIComponent(sendStartMs)}` +
    `&_=${Date.now()}`;


  const urlBuildEnd =
    performance.now();


  console.log(
    "【SEND URL生成完了】",
    "経過=" +
      Math.round(
        urlBuildEnd -
        measureStart
      ) +
      "ms"
  );


  /*
   ========================================================
   ④ AbortController
   ========================================================
  */

  const controller =
    new AbortController();


  let timeoutFired =
    false;


  /*
   ========================================================
   ⑤ 15秒タイムアウト
   ========================================================
  */

  const timeoutId =
    setTimeout(
      () => {

        timeoutFired =
          true;


        const timeoutNow =
          Date.now();

        const timeoutElapsed =
          performance.now() -
          measureStart;


        console.error(
          "【SEND TIMEOUT】",
          "時刻=" + timeoutNow,
          "経過=" +
            Math.round(
              timeoutElapsed
            ) +
            "ms"
        );


        /*
         ==================================================
         TIMEOUT直前のResource Timing
         ==================================================
        */

        const resourceBeforeAbort =
          getResourceTiming(
            GAS_URL
          );


        /*
         ==================================================
         TIMEOUT時点のブラウザ状態
         ==================================================
        */

        const timeoutBrowserState =
          getBrowserState();


        /*
         ==================================================
         診断判定
         ==================================================
        */

        let diagnosis =
          "判定不能";


        if (
          resourceBeforeAbort &&
          resourceBeforeAbort.responseStart > 0
        ) {

          diagnosis =
            "HTTP応答開始まではブラウザが確認済み";

        } else if (
          resourceBeforeAbort &&
          resourceBeforeAbort.requestStart > 0
        ) {

          diagnosis =
            "ブラウザからHTTP request開始までは確認済み";

        } else if (
          resourceBeforeAbort &&
          resourceBeforeAbort.fetchStart > 0
        ) {

          diagnosis =
            "ブラウザのfetch処理開始は確認済み。HTTP request開始以降が未確認";

        } else if (
          timeoutBrowserState.online === false
        ) {

          diagnosis =
            "TIMEOUT時点でnavigator.onLine=false";

        } else {

          diagnosis =
            "GAS応答なし。ブラウザ側Resource Timingでも通信進行を確認できず";

        }


        /*
         ==================================================
         TIMEOUT時診断表示
         ==================================================
        */

        msgDiv.innerText =
          "📩 送信確認中";


        showDiagnostic([

          "【送信診断】TIMEOUT",

          "送信開始 → TIMEOUT：" +
            Math.round(
              timeoutElapsed
            ) +
            " ms",

          "fetch開始 → TIMEOUT：" +
            Math.round(
              performance.now() -
              fetchStart
            ) +
            " ms",

          "URL生成：" +
            Math.round(
              urlBuildEnd -
              measureStart
            ) +
            " ms",

          "HTTP応答：" +
            "なし",

          "answerId：" +
            "取得できず",

          "【重要】暫定判定",

          diagnosis,

          ...browserStateLines(
            timeoutBrowserState
          ),

          ...resourceTimingLines(
            resourceBeforeAbort
          ),

          "AbortController：" +
            "これから実行",

          "TIMEOUT時URL：" +
            url

        ]);


        /*
         ==================================================
         TIMEOUT診断を保存
         ==================================================
        */

        const diagnostic = {

          result:
            "TIMEOUT",

          sendStartMs:
            sendStartMs,

          fetchStartMs:
            fetchStartMs,

          timeoutMs:
            timeoutNow,

          elapsedMs:
            Math.round(
              timeoutElapsed
            ),

          fetchElapsedMs:
            Math.round(
              performance.now() -
              fetchStart
            ),

          urlBuildElapsedMs:
            Math.round(
              urlBuildEnd -
              measureStart
            ),

          player:
            player,

          selected:
            selected,

          number:
            sendNumber,

          tagStage:
            tagStage,

          diagnosis:
            diagnosis,

          browserState:
            timeoutBrowserState,

          resourceTiming:
            resourceBeforeAbort,

          timeoutUrl:
            url

        };


        saveLastDiagnostic(
          diagnostic
        );


        saveSendRecord(
          diagnostic
        );


        /*
         ==================================================
         最後にAbort
         ==================================================
        */

        console.error(
          "【SEND TIMEOUT直前】Abort開始"
        );


        controller.abort();


        console.error(
          "【SEND TIMEOUT直後】Abort完了"
        );


      },
      15000
    );


  /*
   ========================================================
   ⑥ fetch開始
   ========================================================
  */

  console.log(
    "【SEND fetch()呼出直前】",
    "経過=" +
      Math.round(
        performance.now() -
        measureStart
      ) +
      "ms"
  );


  let fetchPromise;


  try {

    fetchPromise =
      fetch(
        url,
        {
          method: "GET",
          cache: "no-store",
          signal: controller.signal
        }
      );

  } catch (syncError) {

    clearTimeout(
      timeoutId
    );


    console.error(
      "【SEND fetch同期ERROR】",
      syncError
    );

    throw syncError;

  }


  console.log(
    "【SEND fetch()呼出完了】",
    "経過=" +
      Math.round(
        performance.now() -
        measureStart
      ) +
      "ms"
  );


  /*
   ========================================================
   ⑦ HTTP応答受信
   ========================================================
  */

  fetchPromise


  .then(
    response => {

      const responseMs =
        Date.now();

      const responseElapsed =
        performance.now() -
        measureStart;


      clearTimeout(
        timeoutId
      );


      console.log(
        "【SEND GAS応答】",
        "HTTP=" +
          response.status,
        "時刻=" +
          responseMs,
        "経過=" +
          Math.round(
            responseElapsed
          ) +
          "ms"
      );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      /*
       ====================================================
       response.json()前の計測
       ====================================================
      */

      window.__sendResponseMs =
        responseMs;

      window.__sendResponseElapsed =
        responseElapsed;


      return response.json();

    }
  )


  /*
   ========================================================
   ⑧ JSON解析完了
   ========================================================
  */

  .then(
    data => {

      const jsonEnd =
        performance.now();

      const jsonEndMs =
        Date.now();


      const gasResponseTime =
        jsonEnd -
        measureStart;


      const fetchTime =
        jsonEnd -
        fetchStart;


      /*
       ====================================================
       GASから返された時刻
       ====================================================
      */

      const gasReceiveMs =
        Number(
          data.gasReceiveMs
        ) || 0;


      const gasCompleteMs =
        Number(
          data.gasCompleteMs
        ) || 0;


      const answerId =
        String(
          data.answerId || ""
        ).trim();


      /*
       ====================================================
       GAS内部時間
       ====================================================
      */

      let gasInternalMs =
        0;


      if (
        gasReceiveMs &&
        gasCompleteMs
      ) {

        gasInternalMs =
          gasCompleteMs -
          gasReceiveMs;

      }


      /*
       ====================================================
       スマホ→GAS受信
       ====================================================
      */

      const sendToGasReceiveMs =
        gasReceiveMs
          ? Math.round(
              gasReceiveMs -
              sendStartMs
            )
          : 0;


      /*
       ====================================================
       GAS完了→HTTP応答
       ====================================================
      */

      const gasCompleteToResponseMs =
        gasCompleteMs &&
        window.__sendResponseMs
          ? Math.round(
              window.__sendResponseMs -
              gasCompleteMs
            )
          : 0;


      /*
       ====================================================
       GAS外時間
       ====================================================
      */

      const gasOutsideMs =
        Math.max(
          0,
          Math.round(
            fetchTime -
            gasInternalMs
          )
        );


      /*
       ====================================================
       Resource Timing
       ====================================================
      */

      const resourceTiming =
        getResourceTiming(
          GAS_URL
        );


      /*
       ====================================================
       「送信しました」表示
       ====================================================
      */

      const sentDisplayMs =
        Date.now();


      const sendDisplayTime =
        performance.now() -
        measureStart;


      msgDiv.innerText =
        "📩 送信しました！";


      /*
       ====================================================
       スマホ診断画面
       ====================================================
      */

      showDiagnostic([

        "【今回の送信診断】",

        "answerId：" +
          answerId,

        "fetch開始 → GAS応答：" +
          Math.round(
            fetchTime
          ) +
          " ms",

        "送信開始 → GAS受信（目安）：" +
          sendToGasReceiveMs +
          " ms",

        "GAS受信 → GAS処理完了：" +
          Math.round(
            gasInternalMs
          ) +
          " ms",

        "GAS処理完了 → HTTP応答（目安）：" +
          gasCompleteToResponseMs +
          " ms",

        "GAS外の時間：" +
          gasOutsideMs +
          " ms",

        "送信開始 →「送信しました」：" +
          Math.round(
            sendDisplayTime
          ) +
          " ms",

        "HTTP：" +
          response.status,

        "JSON解析：" +
          Math.round(
            jsonEnd -
            (
              window.__sendResponseElapsed
                ? measureStart +
                  window.__sendResponseElapsed
                : jsonEnd
            )
          ) +
          " ms",

        ...browserStateLines(
          browserState
        ),

        ...resourceTimingLines(
          resourceTiming
        )

      ]);


      console.log(
        "【SEND診断完了】",
        "answerId=" +
          answerId,
        "fetch=" +
          Math.round(
            fetchTime
          ) +
          "ms",
        "GAS内部=" +
          Math.round(
            gasInternalMs
          ) +
          "ms",
        "GAS外=" +
          gasOutsideMs +
          "ms",
        "表示=" +
          Math.round(
            sendDisplayTime
          ) +
          "ms"
      );


      /*
       ====================================================
       診断結果を保存
       ====================================================
      */

      const diagnostic = {

        result:
          "GAS_RESPONSE",

        time:
          startTime,

        sendStartMs:
          sendStartMs,

        fetchStartMs:
          fetchStartMs,

        responseMs:
          window.__sendResponseMs ||
          0,

        jsonEndMs:
          jsonEndMs,

        sentDisplayMs:
          sentDisplayMs,

        answerId:
          answerId,

        player:
          player,

        selected:
          selected,

        dog:
          dog,

        number:
          sendNumber,

        tagStage:
          tagStage,

        fetchMs:
          Math.round(
            fetchTime
          ),

        gasInternalMs:
          Math.round(
            gasInternalMs
          ),

        sendToGasReceiveMs:
          sendToGasReceiveMs,

        gasCompleteToResponseMs:
          gasCompleteToResponseMs,

        gasOutsideMs:
          gasOutsideMs,

        sendToDisplayMs:
          Math.round(
            sendDisplayTime
          ),

        httpStatus:
          response.status,

        browserState:
          browserState,

        resourceTiming:
          resourceTiming

      };


      saveLastDiagnostic(
        diagnostic
      );


      saveSendRecord(
        diagnostic
      );


      /*
       ====================================================
       「送信しました」表示時刻をGASへ保存
       ====================================================
      */

      if (answerId) {

        const displayUrl =
          `${GAS_URL}?event=sentDisplay` +
          `&answerId=${encodeURIComponent(answerId)}` +
          `&sentDisplayMs=${encodeURIComponent(sentDisplayMs)}` +
          `&_=${Date.now()}`;


        fetch(
          displayUrl,
          {
            method: "GET",
            cache: "no-store"
          }
        )

        .then(
          () => {

            console.log(
              "【SEND sentDisplay送信完了】",
              "answerId=" +
                answerId
            );

          }
        )

        .catch(
          error => {

            console.error(
              "【SEND sentDisplay送信エラー】",
              error
            );

          }
        );

      }


      /*
       ====================================================
       10秒間診断画面を表示
       ====================================================
      */

      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        10000
      );

    }
  )


  /*
   ========================================================
   ⑨ 通信エラー / タイムアウト
   ========================================================
  */

  .catch(
    async error => {

      clearTimeout(
        timeoutId
      );


      const errorTime =
        performance.now() -
        measureStart;


      const errorMs =
        Date.now();


      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      const isTimeout =
        error &&
        error.name === "AbortError";


      /*
       ====================================================
       TIMEOUT
       ====================================================
      */

      if (isTimeout) {

        console.error(
          "【SEND TIMEOUT確定】",
          "経過=" +
            Math.round(
              errorTime
            ) +
            "ms",
          "時刻=" +
            errorMs
        );


        /*
         ==================================================
         Abort後のResource Timing
         少し待ってから再取得
         ==================================================
        */

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              300
            )
        );


        const resourceAfterAbort =
          getResourceTiming(
            GAS_URL
          );


        const afterAbortBrowserState =
          getBrowserState();


        let diagnosis =
          "判定不能";


        if (
          resourceAfterAbort &&
          resourceAfterAbort.responseStart > 0
        ) {

          diagnosis =
            "HTTP応答開始までブラウザ側で確認済み。GAS応答受信処理以降を確認する必要あり";

        } else if (
          resourceAfterAbort &&
          resourceAfterAbort.requestStart > 0
        ) {

          diagnosis =
            "HTTP request開始まではブラウザ側で確認済み。request開始後～response開始前を疑う";

        } else if (
          resourceAfterAbort &&
          resourceAfterAbort.connectStart > 0
        ) {

          diagnosis =
            "接続開始まではブラウザ側で確認済み。接続～request開始付近を疑う";

        } else if (
          resourceAfterAbort &&
          resourceAfterAbort.fetchStart > 0
        ) {

          diagnosis =
            "fetch処理開始はブラウザ側で確認済み。request開始以前またはブラウザのResource Timing制限の可能性";

        } else if (
          afterAbortBrowserState.online === false
        ) {

          diagnosis =
            "TIMEOUT後のnavigator.onLine=false";

        } else {

          diagnosis =
            "GAS HTTP応答なし。ブラウザResource Timingにも通信進行が記録されていない";

        }


        msgDiv.innerText =
          "📩 送信確認中";


        showDiagnostic([

          "【送信診断】TIMEOUT",

          "送信開始 → TIMEOUT：" +
            Math.round(
              errorTime
            ) +
            " ms",

          "fetch開始 → TIMEOUT：" +
            Math.round(
              errorTime -
              (
                fetchStart -
                measureStart
              )
            ) +
            " ms",

          "15秒以内にGASからHTTP応答なし",

          "answerId：取得できず",

          "━━━━━━━━━━━━━━",

          "【今回の重要判定】",

          diagnosis,

          "━━━━━━━━━━━━━━",

          ...browserStateLines(
            afterAbortBrowserState
          ),

          ...resourceTimingLines(
            resourceAfterAbort
          ),

          "AbortController：" +
            "実行済み",

          "fetch呼出開始時刻：" +
            fetchStartMs,

          "TIMEOUT時刻：" +
            errorMs,

          "TIMEOUT時URL：" +
            url

        ]);


        /*
         ==================================================
         TIMEOUT診断保存
         ==================================================
        */

        const diagnostic = {

          result:
            "TIMEOUT",

          sendStartMs:
            sendStartMs,

          fetchStartMs:
            fetchStartMs,

          errorMs:
            errorMs,

          elapsedMs:
            Math.round(
              errorTime
            ),

          fetchElapsedMs:
            Math.round(
              errorTime -
              (
                fetchStart -
                measureStart
              )
            ),

          player:
            player,

          selected:
            selected,

          number:
            sendNumber,

          tagStage:
            tagStage,

          diagnosis:
            diagnosis,

          browserState:
            afterAbortBrowserState,

          resourceTiming:
            resourceAfterAbort,

          errorName:
            error &&
            error.name
              ? error.name
              : "",

          errorMessage:
            String(error),

          timeoutUrl:
            url

        };


        saveLastDiagnostic(
          diagnostic
        );


        saveSendRecord(
          diagnostic
        );


      } else {


        /*
         ==================================================
         通常通信ERROR
         ==================================================
        */

        console.error(
          "【SEND通信ERROR】",
          "時間=" +
            Math.round(
              errorTime
            ) +
            "ms",
          "error=" +
            String(error)
        );


        const errorBrowserState =
          getBrowserState();


        const errorResourceTiming =
          getResourceTiming(
            GAS_URL
          );


        msgDiv.innerText =
          "📩 送信しました！";


        showDiagnostic([

          "【送信診断】通信ERROR",

          "送信開始 → ERROR：" +
            Math.round(
              errorTime
            ) +
            " ms",

          "error：" +
            String(error),

          "error.name：" +
            (
              error &&
              error.name
                ? error.name
                : "取得不可"
            ),

          "answerId：取得できず",

          ...browserStateLines(
            errorBrowserState
          ),

          ...resourceTimingLines(
            errorResourceTiming
          )

        ]);


        saveLastDiagnostic({

          result:
            "ERROR",

          sendStartMs:
            sendStartMs,

          fetchStartMs:
            fetchStartMs,

          errorMs:
            errorMs,

          elapsedMs:
            Math.round(
              errorTime
            ),

          errorMessage:
            String(error),

          errorName:
            error &&
            error.name
              ? error.name
              : "",

          player:
            player,

          selected:
            selected,

          number:
            sendNumber,

          tagStage:
            tagStage,

          browserState:
            errorBrowserState,

          resourceTiming:
            errorResourceTiming

        });

      }


      /*
       ====================================================
       履歴保存
       ====================================================
      */

      saveSendRecord({

        time:
          startTime,

        sendStartMs:
          sendStartMs,

        errorTimeMs:
          errorMs,

        player:
          player,

        selected:
          selected,

        dog:
          dog,

        number:
          sendNumber,

        tagStage:
          tagStage,

        sendToError:
          Math.round(
            errorTime
          ),

        errorMessage:
          String(error),

        result:
          isTimeout
            ? "TIMEOUT"
            : "ERROR"

      });


      /*
       ====================================================
       エラー時も10秒表示
       ====================================================
      */

      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        10000
      );

    }
  );

}


send();

</script>

</html>
