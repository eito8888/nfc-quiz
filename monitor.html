<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クイズモニター</title>

<style>
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h1 {
  margin: 20px 0;
  font-size: 36px;
  color: #333;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding: 10px;
}

.cell {
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  padding: 15px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.answerLine {
  margin-top: 10px;
  color: green;
  font-size: 16px;
  font-weight: bold;
}

img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  margin-top: 10px;
}

.score-container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  padding: 30px;
}

.score-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.score-table th {
  background-color: #ff9800;
  color: white;
  font-size: 24px;
  padding: 15px;
}

.score-table th:first-child {
  border-radius: 10px 0 0 0;
}

.score-table th:last-child {
  border-radius: 0 10px 0 0;
}

.score-table td {
  padding: 18px 20px;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 1px solid #eee;
  color: #333;
}

.score-table tr:nth-child(even) {
  background-color: #fafafa;
}

.score-num {
  color: #e65100;
  font-size: 32px;
}
</style>

</head>

<body>

<h1 id="mainTitle">クイズ</h1>

<div id="displayArea"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";


/* =========================================================
   写真先読み
   ========================================================= */

const preloadedImages = new Map();

function preloadImage(src) {

  if (!src || preloadedImages.has(src)) {
    return;
  }

  const img = new Image();

  img.src = src;

  preloadedImages.set(src, img);
}


/* =========================================================
   原因追及用
   ========================================================= */

if (!window.seenAnswerIds) {
  window.seenAnswerIds = new Set();
}

if (!window.diagnosticAnswers) {
  window.diagnosticAnswers = new Map();
}

if (!window.monitorTimingSent) {
  window.monitorTimingSent = new Set();
}

if (typeof window.monitorInitialized === "undefined") {
  window.monitorInitialized = false;
}


/* =========================================================
   Monitor計測をGASへ保存
   ※既存の通信。新規追加ではない
   ========================================================= */

function sendMonitorTiming(
  answerId,
  monitorFetchMs,
  trueDisplayMs,
  photoDisplayMs
) {

  if (!answerId) {
    return;
  }

  if (window.monitorTimingSent.has(answerId)) {
    return;
  }

  const url =
    GAS_URL +
    "?event=monitorTiming" +
    "&answerId=" +
    encodeURIComponent(answerId) +
    "&monitorFetchMs=" +
    encodeURIComponent(monitorFetchMs) +
    "&trueDisplayMs=" +
    encodeURIComponent(trueDisplayMs) +
    "&photoDisplayMs=" +
    encodeURIComponent(photoDisplayMs) +
    "&_=" +
    Date.now();

  fetch(url, {
    method: "GET",
    cache: "no-store"
  })
  .then(() => {

    window.monitorTimingSent.add(answerId);

    console.log(
      "【原因追及 timing_log送信完了】",
      "answerId=" + answerId
    );

  })
  .catch(error => {

    console.error(
      "【原因追及 timing_log送信エラー】",
      error
    );

  });
}


/* =========================================================
   メイン処理
   ========================================================= */

async function load() {

  const loadStart =
    performance.now();

  try {

    /* -----------------------------------------
       ① GAS通信
       ----------------------------------------- */

    const fetchStart =
      performance.now();

    const res =
      await fetch(
        GAS_URL + "?_=" + Date.now(),
        {
          cache: "no-store"
        }
      );

    const fetchEnd =
      performance.now();


    /* -----------------------------------------
       ② JSON解析
       ----------------------------------------- */

    const data =
      await res.json();

    const jsonEnd =
      performance.now();

    const gasFetchTime =
      fetchEnd - fetchStart;

    const jsonTime =
      jsonEnd - fetchEnd;

    const dataReceiveTime =
      jsonEnd - loadStart;

    const monitorFetchMs =
      Date.now();


    console.log(
      "【診断 LOAD/GAS】",
      "load開始→fetch開始=" +
        Math.round(fetchStart - loadStart) +
        "ms",
      "fetch=" +
        Math.round(gasFetchTime) +
        "ms",
      "JSON=" +
        Math.round(jsonTime) +
        "ms",
      "load開始→JSON完了=" +
        Math.round(dataReceiveTime) +
        "ms",
      "HTTP=" +
        res.status
    );


    const displayArea =
      document.getElementById(
        "displayArea"
      );

    const currentStage =
      Number(data.currentStage);


    /* -----------------------------------------
       写真先読み
       ----------------------------------------- */

    if (data.questions) {

      data.questions.forEach(q => {

        const stage =
          String(q[0]).trim();

        const img =
          q[5];

        if (
          stage ===
          String(currentStage).trim()
          &&
          img
        ) {

          preloadImage(
            "images/" + img
          );

        }

      });

    }


    /* =====================================================
       Stage = 0
       ===================================================== */

    if (currentStage === 0) {

      document
        .getElementById("mainTitle")
        .innerText =
          "🎉 イベント結果発表 🎉";

      if (
        !data.scoreList ||
        data.scoreList.length === 0
      ) {

        displayArea.innerHTML =
          `<div class="score-container">
             <h2>まだ回答データがありません</h2>
           </div>`;

        return;
      }

      let tableRows = "";

      data.scoreList.forEach(item => {

        tableRows += `
          <tr>
            <td style="text-align: left; padding-left: 50px;">
              ${item.player}
            </td>

            <td style="text-align: right; padding-right: 50px;">
              <span class="score-num">
                ${item.total}
              </span> 点
            </td>
          </tr>
        `;

      });

      displayArea.innerHTML = `
        <div class="score-container">

          <table class="score-table">

            <thead>
              <tr>
                <th style="text-align: left; padding-left: 50px;">
                  ニックネーム
                </th>

                <th style="text-align: right; padding-right: 50px;">
                  合計得点
                </th>
              </tr>
            </thead>

            <tbody>
              ${tableRows}
            </tbody>

          </table>

        </div>
      `;

      return;
    }


    /* =====================================================
       Stage > 0
       ===================================================== */

    let stageTitle =
      "クイズ";

    let correctMap = {};

    const newDiagnostics = [];


    /* =====================================================
       回答データ
       ===================================================== */

    if (data.answers) {

      data.answers.forEach(row => {

        const player =
          String(row[0]).trim();

        const selected =
          String(row[1]).trim();

        const correct =
          row[3];

        const stage =
          String(row[4]).trim();

        const answerId =
          String(row[7] || "").trim();

        const isCorrect =
          (
            correct === true ||
            correct === "TRUE" ||
            correct === "true"
          );


        if (!isCorrect) {
          return;
        }


        const key =
          stage + "-" + selected;


        if (!correctMap[key]) {

          correctMap[key] =
            player;

        }


        /* 新しい回答だけ診断対象 */

        if (
          answerId &&
          !window.seenAnswerIds.has(answerId)
        ) {

          const diagnostic = {

            answerId:
              answerId,

            player:
              player,

            selected:
              selected,

            stage:
              stage,

            key:
              key,

            monitorFetchMs:
              monitorFetchMs,

            trueDisplayMs:
              0,

            photoDisplayMs:
              0,

            answerDetectedPerf:
              0,

            gasRecordToDetectMs:
              null,

            trueDisplayPerf:
              0,

            photoDisplayPerf:
              0,

            trueLogged:
              false,

            photoLogged:
              false

          };


          window.diagnosticAnswers.set(
            answerId,
            diagnostic
          );


          newDiagnostics.push(
            diagnostic
          );


          const answerDetectedPerf =
            performance.now();

          const answerDetectedWallClock =
            Date.now();

          let gasRecordToDetectMs =
            null;

          const gasRecordTime =
            new Date(row[6]).getTime();

          if (
            Number.isFinite(gasRecordTime)
          ) {

            gasRecordToDetectMs =
              answerDetectedWallClock -
              gasRecordTime;

          }


          diagnostic.answerDetectedPerf =
            answerDetectedPerf;

          diagnostic.gasRecordToDetectMs =
            gasRecordToDetectMs;


          console.log(
            "【原因追及 START】",
            "番号=" + selected,
            "player=" + player,
            "answerId=" + answerId,
            "GAS回答記録時刻=" + row[6],
            "Monitor GAS取得=" +
              Math.round(gasFetchTime) +
              "ms",
            "GAS記録→Monitor検知=" +
              (
                gasRecordToDetectMs === null
                ? "計算不可"
                : Math.round(
                    gasRecordToDetectMs
                  ) + "ms"
              )
          );

        }

      });


      /* 初回loadでは既存回答を計測しない */

      if (!window.monitorInitialized) {

        data.answers.forEach(row => {

          const answerId =
            String(row[7] || "").trim();

          if (answerId) {

            window.seenAnswerIds.add(
              answerId
            );

          }

        });

        newDiagnostics.length = 0;

        window.diagnosticAnswers.clear();

        window.monitorInitialized = true;

        console.log(
          "【原因追及】初回読み込み完了。既存回答は計測対象外"
        );

      }

    }


    /* =====================================================
       HTML構築
       ===================================================== */

    const htmlBuildStart =
      performance.now();

    let gridHTML =
      '<div class="grid">';


    if (data.questions) {

      data.questions.forEach(q => {

        const stage =
          String(q[0]).trim();

        const number =
          String(q[1]).trim();

        const title =
          q[3];

        const name =
          q[4];

        const img =
          q[5];


        if (
          stage !==
          String(currentStage).trim()
        ) {

          return;

        }


        stageTitle =
          title || "クイズ";


        const key =
          stage + "-" + number;


        let cellContent =
          `<div class="title">
             【${number}】${name}
           </div>`;


        if (correctMap[key]) {

          cellContent += `
            <div class="answerLine">
              ✅正解 → ${correctMap[key]}
            </div>
          `;


          if (img) {

            const imageSrc =
              "images/" + img;

            cellContent +=
              `<img
                src="${imageSrc}"
                data-monitor-image="${imageSrc}"
                data-answer-key="${key}"
              >`;

          }

        }


        gridHTML +=
          `<div class="cell">
             ${cellContent}
           </div>`;

      });

    }


    gridHTML +=
      "</div>";


    const htmlBuildEnd =
      performance.now();


    /* =====================================================
       画面反映
       ===================================================== */

    const renderStart =
      performance.now();

    displayArea.innerHTML =
      gridHTML;

    document
      .getElementById("mainTitle")
      .innerText =
        stageTitle;

    const renderEnd =
      performance.now();


    const trueDisplayMs =
      Date.now();

    const trueDisplayPerf =
      performance.now();


    /* =====================================================
       TRUE記録
       ===================================================== */

    newDiagnostics.forEach(
      diagnostic => {

        diagnostic.trueDisplayMs =
          trueDisplayMs;

        diagnostic.trueDisplayPerf =
          trueDisplayPerf;

        diagnostic.trueLogged =
          true;

        console.log(
          "【原因追及 TRUE】"
        );

        console.log(
          "番号=" +
            diagnostic.selected
        );

        console.log(
          "answerId=" +
            diagnostic.answerId
        );

        console.log(
          "TRUE表示時刻=" +
            trueDisplayMs
        );

        console.log(
          "Monitor取得時刻=" +
            diagnostic.monitorFetchMs
        );

      }
    );


    /* =====================================================
       写真
       ===================================================== */

    const imageElements =
      displayArea.querySelectorAll(
        "img[data-monitor-image]"
      );


    imageElements.forEach(
      img => {

        const imageSrc =
          img.getAttribute(
            "data-monitor-image"
          );

        const answerKey =
          img.getAttribute(
            "data-answer-key"
          );


        let diagnostic =
          null;


        for (
          let i = 0;
          i < newDiagnostics.length;
          i++
        ) {

          if (
            newDiagnostics[i].key ===
            answerKey
          ) {

            diagnostic =
              newDiagnostics[i];

            break;

          }

        }


        const imageStart =
          performance.now();


        const reportImageLoad =
          () => {

            if (!diagnostic) {
              return;
            }

            if (
              diagnostic.photoLogged
            ) {
              return;
            }


            diagnostic.photoLogged =
              true;


            const imageEnd =
              performance.now();

            const imageLoadTime =
              imageEnd -
              imageStart;

            const totalTime =
              imageEnd -
              loadStart;

            const photoDisplayMs =
              Date.now();

            const photoDisplayPerf =
              performance.now();


            diagnostic.photoDisplayMs =
              photoDisplayMs;

            diagnostic.photoDisplayPerf =
              photoDisplayPerf;


            console.log(
              "==============================="
            );

            console.log(
              "【原因追及 PHOTO】"
            );

            console.log(
              "番号=" +
                diagnostic.selected
            );

            console.log(
              "answerId=" +
                diagnostic.answerId
            );

            console.log(
              "Monitor取得=" +
                diagnostic.monitorFetchMs
            );

            console.log(
              "TRUE=" +
                diagnostic.trueDisplayMs
            );

            console.log(
              "写真=" +
                photoDisplayMs
            );

            console.log(
              "TRUE→写真=" +
                Math.round(
                  photoDisplayPerf -
                  (
                    diagnostic.trueDisplayPerf ||
                    trueDisplayPerf
                  )
                ) +
                "ms"
            );


            console.log(
              "【原因追及 区間判定】",
              "GAS記録→Monitor検知=" +
                (
                  diagnostic.gasRecordToDetectMs === null
                  ? "計算不可"
                  : Math.round(
                      diagnostic.gasRecordToDetectMs
                    ) + "ms"
                ),
              "Monitor fetch=" +
                Math.round(
                  fetchEnd -
                  fetchStart
                ) +
                "ms",
              "回答検知→TRUE=" +
                (
                  diagnostic.answerDetectedPerf
                  ? Math.round(
                      trueDisplayPerf -
                      diagnostic.answerDetectedPerf
                    ) + "ms"
                  : "計算不可"
                ),
              "TRUE→写真=" +
                Math.round(
                  photoDisplayPerf -
                  (
                    diagnostic.trueDisplayPerf ||
                    trueDisplayPerf
                  )
                ) +
                "ms"
            );


            console.log(
              "写真待ち=" +
                Math.round(
                  imageLoadTime
                ) +
                "ms"
            );

            console.log(
              "HTML構築=" +
                Math.round(
                  htmlBuildEnd -
                  htmlBuildStart
                ) +
                "ms"
            );

            console.log(
              "画面反映=" +
                Math.round(
                  renderEnd -
                  renderStart
                ) +
                "ms"
            );

            console.log(
              "【原因追及 END】"
            );


            sendMonitorTiming(
              diagnostic.answerId,
              diagnostic.monitorFetchMs,
              diagnostic.trueDisplayMs,
              diagnostic.photoDisplayMs
            );


            if (
              imageLoadTime >= 5000 ||
              totalTime >= 5000
            ) {

              console.warn(
                "【異常PHOTO計測】",
                imageSrc,
                "HTML構築=" +
                  Math.round(
                    htmlBuildEnd -
                    htmlBuildStart
                  ) +
                  "ms",
                "画面反映=" +
                  Math.round(
                    renderEnd -
                    renderStart
                  ) +
                  "ms",
                "画像読み込み=" +
                  Math.round(
                    imageLoadTime
                  ) +
                  "ms",
                "load開始から=" +
                  Math.round(
                    totalTime
                  ) +
                  "ms"
              );

            }

          };


        if (img.complete) {

          reportImageLoad();

        } else {

          img.addEventListener(
            "load",
            reportImageLoad,
            {
              once: true
            }
          );


          img.addEventListener(
            "error",
            () => {

              console.error(
                "【PHOTOエラー】",
                imageSrc,
                "画像load開始から=" +
                  Math.round(
                    performance.now() -
                    imageStart
                  ) +
                  "ms"
              );

            },
            {
              once: true
            }
          );

        }

      }
    );


    /* =====================================================
       新回答を既知として登録
       ===================================================== */

    newDiagnostics.forEach(
      diagnostic => {

        window.seenAnswerIds.add(
          diagnostic.answerId
        );

      }
    );


    /* =====================================================
       LOAD全体
       ===================================================== */

    const loadEnd =
      performance.now();

    console.log(
      "【LOAD全体】",
      "load開始→画面反映=" +
        Math.round(
          loadEnd -
          loadStart
        ) +
        "ms",
      "fetch開始→完了=" +
        Math.round(
          fetchEnd -
          fetchStart
        ) +
        "ms",
      "load開始→JSON完了=" +
        Math.round(
          jsonEnd -
          loadStart
        ) +
        "ms"
    );


 } catch (error) {

  console.error(
    "データ取得エラー:",
    error
  );

  const displayArea =
    document.getElementById(
      "displayArea"
    );

  if (displayArea) {
    displayArea.innerHTML = "";
  }

} 

}


/* =========================================================
   モニター更新
   1秒ごと
   ========================================================= */

async function monitorLoop() {

  await load();

  setTimeout(
    monitorLoop,
    1000
  );

}

monitorLoop();

</script>

</body>
</html>
