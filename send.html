<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...（診断OFF TEST）</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding-top:25px;
  margin:0;
}

h1{
  font-size:42px;
  margin:0 0 18px;
}

#msg{
  font-size:38px;
  font-weight:bold;
  margin-top:10px;
}

#debug{
  margin:18px auto 0;
  font-size:24px;
  line-height:1.22;
  font-weight:bold;
  white-space:pre-line;
  text-align:left;
  padding:0 12px;
  max-width:900px;
}
</style>
</head>

<body>

<h1 id="msg">📡 送信中…</h1>
<div id="debug"></div>

<script>

/* TEST版：診断機能を完全停止。通常送信・5秒再通信・画面遷移は現行版のまま。 */

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msgDiv =
  document.getElementById("msg");

const debugDiv =
  document.getElementById("debug");

const player =
  localStorage.getItem("player");

const selected =
  localStorage.getItem("selectedNumber");

const params =
  new URLSearchParams(location.search);

const dog =
  params.get("dog");

const number =
  params.get("number");

const tagStage =
  params.get("stage");

const sendNumber =
  number || dog;

const requestId =
  (crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : (
        "r_" +
        Date.now() +
        "_" +
        Math.random().toString(36).slice(2)
      );

const sendKey =
  "sending_" +
  requestId;



/* ========================================================
   メイン送信
   ======================================================== */

function send(){

  const measureStart =
    performance.now();

  const sendStartMs =
    Date.now();

  console.log(
    "【SEND開始】",
    sendStartMs,
    player,
    selected,
    sendNumber,
    tagStage
  );

  msgDiv.innerText =
    "📡 送信中…";

  /* 二重送信防止 */
  if(
    sessionStorage.getItem(sendKey) === "sending"
  ){
    return;
  }

  sessionStorage.setItem(
    sendKey,
    "sending"
  );



/* ======================================================
     fetch開始
     ====================================================== */

  const fetchStart =
    performance.now();

  const fetchStartMs =
    Date.now();


  const sendToFetchMs =
    Math.max(
      0,
      Math.round(
        fetchStartMs -
        sendStartMs
      )
    );


  console.log(
    "【SEND送信→fetch開始】",
    sendToFetchMs +
      " ms"
  );


  /* ======================================================
     GAS URL
     ====================================================== */

  const url =
    `${GAS_URL}` +
    `?player=${encodeURIComponent(player)}` +
    `&selected=${encodeURIComponent(selected)}` +
    `&number=${encodeURIComponent(sendNumber)}` +
    `&tagStage=${encodeURIComponent(tagStage)}` +
    `&clientSendMs=${encodeURIComponent(sendStartMs)}` +
    `&requestId=${encodeURIComponent(requestId)}` +
    `&_=${Date.now()}`;



  /*
   * 5秒ショック療法
   *
   * 通常の通信は従来どおり1本だけ。
   * 5秒経過してもHTTP responseが来ない場合だけ、
   * 同じrequestIdで1回だけ再通信する。
   */
  let retryFired =
    false;

  let retryStartMs =
    0;

  let retryTimerId =
    0;

  const retryUrl =
    url +
    `&retry=1` +
    `&_retry=${Date.now()}`;

  window.__sendResponseRoute =
    "";

  window.__sendActiveFetchStart =
    fetchStart;

  window.__sendActiveUrl =
    url;


  /* ======================================================
     15秒警告

     重要：
     fetchそのものは中断しない。

     15秒経過してもGASのHTTP応答を待ち続け、
     実際にresponseが返ってきた時点で
     answerIdを取得する。
     ====================================================== */

  const timeoutId =
    setTimeout(
      () => {

        /* test版：診断通信は一切行わず、表示だけ残す */
        msgDiv.innerText =
          "📩 送信確認中…";

      },
      10000
    );


  /* ======================================================
     メインGAS通信
     ====================================================== */

  /*
   * 通常のメイン通信
   */
  const primaryFetch =
    fetch(
      url,
      {
        method:"GET",
        cache:"no-store"
      }
    ).then(
      response => ({
        response,
        route:"primary",
        fetchStartPerf:fetchStart,
        targetUrl:url
      })
    );


  /*
   * 5秒ショック療法。
   *
   * 5秒以内にprimaryFetchが返れば、この再通信は発生しない。
   * 5秒を超えた場合だけ、同じrequestIdで1回だけ再通信する。
   *
   * retry側で通信エラーになっても、primary側が後から返る可能性を残す。
   */
  const retryFetch =
    new Promise(
      resolve => {

        retryTimerId =
          setTimeout(
            () => {

              retryFired =
                true;

              retryStartMs =
                Date.now();

              const retryFetchStart =
                performance.now();


              console.log(
                "【5秒ショック療法】再通信開始",
                retryStartMs,
                requestId
              );


              fetch(
                retryUrl,
                {
                  method:"GET",
                  cache:"no-store"
                }
              )
              .then(
                response => {

                  resolve({

                    response,

                    route:"retry",

                    fetchStartPerf:
                      retryFetchStart,

                    targetUrl:
                      retryUrl

                  });

                }
              )
              .catch(
                error => {

                  console.log(
                    "【5秒ショック療法】再通信ERROR",
                    error
                  );

                }
              );

            },
            5000
          );

      }
    );


  /*
   * 先にresponseを返した通信を採用する。
   */
  Promise.race([
    primaryFetch,
    retryFetch
  ])


  /* ======================================================
     HTTP response受信
     ====================================================== */

  .then(
    packet => {

      const response =
        packet.response;

      window.__sendResponseRoute =
        packet.route;

      window.__sendActiveFetchStart =
        packet.fetchStartPerf;

      window.__sendActiveUrl =
        packet.targetUrl;


      const responseMs =
        Date.now();

      const responseElapsed =
        performance.now() -
        measureStart;


      window.__sendResponseMs =
        responseMs;

      window.__sendResponseElapsed =
        responseElapsed;

      window.__sendResponseStatus =
        response.status;


      clearTimeout(
        timeoutId
      );

      clearTimeout(
        retryTimerId
      );


      console.log(
        "【SEND GAS応答】",
        response.status,
        responseMs,
        responseElapsed
      );


      if(
        !response.ok
      ){

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      return response.json();

    }
  )


  /* ======================================================
     JSON解析完了
     ====================================================== */

  .then(
    data => {

      /* TEST版：診断処理は行わず、通常の成功表示だけ実行 */
      msgDiv.innerText =
        "📩 送信しました！";

      setTimeout(
        () => {
          location.href =
            "player.html";
        },
        1500
      );

    }
  )


  /* ======================================================
     通信ERROR
     ====================================================== */

  .catch(
    error => {

      clearTimeout(
        timeoutId
      );

      clearTimeout(
        retryTimerId
      );


      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      msgDiv.innerText =
        "📩 送信確認中";


      /*
       * 現在と同じ1.5秒後に戻る。
       */

      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        1500
      );

    }
  );

}


send();

</script>

</body>
</html>
