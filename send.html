<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding-top: 70px;
}

h1 {
  font-size: 52px;
  font-weight: bold;
}

#msg {
  font-size: 46px;
  font-weight: bold;
  margin-top: 40px;
}
</style>
</head>

<body>

<h1>📡 送信中…</h1>
<div id="msg"></div>

<script>
/* ★あなたのGAS URL */
const GAS_URL =
"https://script.google.com/macros/s/AKfycbysC8_DE3KENuaTbOynEviquqjhPVcSCxXo6zIREjkKnVrYrHdLey4vH0G8ARhHPPOo/exec";

/* 保存された情報 */
const player   = localStorage.getItem("player");
const selected = localStorage.getItem("selectedNumber");

/* NFCタグから渡される dog番号 */
const dog = new URLSearchParams(location.search).get("dog");

/* 表示エリア */
const msgDiv = document.getElementById("msg");

/* 番号未選択なら終了 */
if (!selected) {

  msgDiv.innerText = "⚠ 番号が選ばれていません";

  /* 2秒後に戻る */
  setTimeout(() => {
    window.location.replace(
      "https://eito8888.github.io/nfc-quiz/player.html"
    );
  }, 2000);

} else {

  /* 送信処理 */
  async function send() {

    const res = await fetch(
      `${GAS_URL}?player=${player}&selected=${selected}&dog=${dog}`
    );

    const data = await res.json();

    /* 判定表示 */
    if (data.result === "correct") {
      msgDiv.innerText = "🎉 正解！";
    } else {
      msgDiv.innerText = "❌ 不正解";
    }

    /* ★2秒後に必ず番号画面へ戻る */
    setTimeout(() => {

      window.location.replace(
        "https://eito8888.github.io/nfc-quiz/player.html"
      );

    }, 2000);
  }

  send();
}
</script>

</body>
</html>
