```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クイズモニター</title>

<style>
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h1 {
  margin: 20px 0;
  font-size: 36px;
  color: #333;
}

/* 通常問題表示用グリッド */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding: 10px;
}

.cell {
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  padding: 15px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.answerLine {
  margin-top: 10px;
  color: green;
  font-size: 16px;
  font-weight: bold;
}

img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  margin-top: 10px;
}

/* Stage=0 合計スコア表示用スタイル */
.score-container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  padding: 30px;
}

.score-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.score-table th {
  background-color: #ff9800;
  color: white;
  font-size: 24px;
  padding: 15px;
}

.score-table th:first-child {
  border-radius: 10px 0 0 0;
}

.score-table th:last-child {
  border-radius: 0 10px 0 0;
}

.score-table td {
  padding: 18px 20px;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 1px solid #eee;
  color: #333;
}

.score-table tr:nth-child(even) {
  background-color: #fafafa;
}

.score-num {
  color: #e65100;
  font-size: 32px;
}
</style>

</head>

<body>

<h1 id="mainTitle">クイズ</h1>

<div id="displayArea"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

/* =========================================================
   写真先読み
   ========================================================= */

const preloadedImages = new Map();

function preloadImage(src) {
  if (!src || preloadedImages.has(src)) return;

  const img = new Image();
  img.src = src;
  preloadedImages.set(src, img);
}


/* =========================================================
   メイン処理
   ========================================================= */

async function load() {

  const loadStart = performance.now();

  try {

    /* -----------------------------------------
       ① GAS通信時間を計測
       ----------------------------------------- */

    const fetchStart = performance.now();

    const res = await fetch(GAS_URL);

    const fetchEnd = performance.now();

    /* -----------------------------------------
       ② JSON解析時間を計測
       ----------------------------------------- */

    const data = await res.json();

    const jsonEnd = performance.now();

    const gasFetchTime = fetchEnd - fetchStart;
    const jsonTime = jsonEnd - fetchEnd;
    const dataReceiveTime = jsonEnd - loadStart;

    console.log(
      "【MONITOR計測】",
      "GAS取得=" + Math.round(gasFetchTime) + "ms",
      "JSON解析=" + Math.round(jsonTime) + "ms",
      "データ受信完了=" + Math.round(dataReceiveTime) + "ms"
    );


    const displayArea = document.getElementById("displayArea");
    const currentStage = Number(data.currentStage);


    /* -----------------------------------------
       現在ステージの写真を事前読み込み
       ----------------------------------------- */

    if (data.questions) {

      data.questions.forEach(q => {

        const stage = String(q[0]).trim();
        const img = q[5];

        if (
          stage === String(currentStage).trim() &&
          img
        ) {
          preloadImage("images/" + img);
        }

      });

    }


    /* =====================================================
       Stage = 0
       結果発表画面
       ===================================================== */

    if (currentStage === 0) {

      document.getElementById("mainTitle").innerText =
        "🎉 イベント結果発表 🎉";

      if (!data.scoreList || data.scoreList.length === 0) {

        displayArea.innerHTML =
          `<div class="score-container">
             <h2>まだ回答データがありません</h2>
           </div>`;

        return;
      }


      let tableRows = "";

      data.scoreList.forEach(item => {

        tableRows += `
          <tr>
            <td style="text-align: left; padding-left: 50px;">
              ${item.player}
            </td>
            <td style="text-align: right; padding-right: 50px;">
              <span class="score-num">${item.total}</span> 点
            </td>
          </tr>
        `;

      });


      displayArea.innerHTML = `
        <div class="score-container">
          <table class="score-table">
            <thead>
              <tr>
                <th style="text-align: left; padding-left: 50px;">
                  ニックネーム
                </th>
                <th style="text-align: right; padding-right: 50px;">
                  合計得点
                </th>
              </tr>
            </thead>

            <tbody>
              ${tableRows}
            </tbody>

          </table>
        </div>
      `;

      return;
    }


    /* =====================================================
       Stage > 0
       通常の問題画面
       ===================================================== */

    let stageTitle = "クイズ";

    if (!window.lastCorrectKeys) window.lastCorrectKeys = new Set();
    let correctMap = {};


    /* -----------------------------------------
       正解データマップ作成
       ----------------------------------------- */

    if (data.answers) {

      data.answers.forEach(row => {

        const player =
          String(row[0]).trim();

        const selected =
          String(row[1]).trim();

        const correct =
          row[3];

        const stage =
          String(row[4]).trim();

        const isCorrect =
          (
            correct === true ||
            correct === "TRUE" ||
            correct === "true"
          );


        if (isCorrect) {

          const key =
            stage + "-" + selected;

          if (!correctMap[key]) {
            correctMap[key] = player;
          }

        }

      });

    }

/* =====================================================
   新しい回答の検知時間を計測
   ===================================================== */

if (!window.answerKeys) {
  window.answerKeys = new Set();

  if (data.answers) {
    data.answers.forEach(row => {
      window.answerKeys.add(
        row.map(v => String(v)).join("|")
      );
    });
  }

} else {

  if (data.answers) {

    data.answers.forEach(row => {

      const key =
        row.map(v => String(v)).join("|");

      if (!window.answerKeys.has(key)) {

        console.log(
          "【新回答検知】",
          "player=" + row[0],
          "selected=" + row[1],
          "dog=" + row[2],
          "correct=" + row[3],
          "stage=" + row[4],
          "検知時刻=" +
            Math.round(performance.now()) +
            "ms",
          "今回load開始から=" +
            Math.round(performance.now() - loadStart) +
            "ms"
        );

        window.answerKeys.add(key);
      }

    });

  }

}

    /* =====================================================
       HTML構築開始時間
       ===================================================== */

    const htmlBuildStart = performance.now();


    let gridHTML = '<div class="grid">';


    if (data.questions) {

      data.questions.forEach(q => {

        const stage =
          String(q[0]).trim();

        const number =
          String(q[1]).trim();

        const title =
          q[3];

        const name =
          q[4];

        const img =
          q[5];


        if (
          stage !== String(currentStage).trim()
        ) {
          return;
        }


        stageTitle =
          title || "クイズ";


        const key =
          stage + "-" + number;


        let cellContent =
          `<div class="title">【${number}】${name}</div>`;


        if (correctMap[key]) {

          cellContent += `
            <div class="answerLine">
              ✅正解 → ${correctMap[key]}
            </div>
          `;


          if (img) {

            const imageSrc =
              "images/" + img;


            cellContent +=
              `<img src="${
                preloadedImages.get(imageSrc)?.src ||
                imageSrc
              }"
              data-monitor-image="${imageSrc}">`;

          }

        }


        gridHTML +=
          `<div class="cell">${cellContent}</div>`;

      });

    }


    gridHTML += '</div>';


    const htmlBuildEnd =
      performance.now();


    /* =====================================================
       画面を書き換える
       ===================================================== */

    const renderStart =
      performance.now();

    displayArea.innerHTML =
      gridHTML;

    document.getElementById("mainTitle").innerText =
      stageTitle;

    const renderEnd =
      performance.now();


    /* =====================================================
       画像読み込み時間を計測
       ===================================================== */

    const imageElements =
      displayArea.querySelectorAll(
        "img[data-monitor-image]"
      );


    imageElements.forEach(img => {

      const imageSrc =
        img.getAttribute("data-monitor-image");

      const imageStart =
        performance.now();

const reportImageLoad = () => {

  const imageEnd =
    performance.now();

  const imageLoadTime =
    imageEnd - imageStart;

  const totalTime =
    imageEnd - loadStart;

  if (imageLoadTime >= 5000 || totalTime >= 5000) {

    console.warn(
      "【異常PHOTO計測】",
      imageSrc,
      "表示用HTML作成=" +
        Math.round(htmlBuildEnd - htmlBuildStart) +
        "ms",
      "画面反映=" +
        Math.round(renderEnd - renderStart) +
        "ms",
      "画像読み込み=" +
        Math.round(imageLoadTime) +
        "ms",
      "load開始から=" +
        Math.round(totalTime) +
        "ms"
    );

  }

};


      if (img.complete) {

        reportImageLoad();

      } else {

        img.addEventListener(
          "load",
          reportImageLoad,
          { once: true }
        );

        img.addEventListener(
          "error",
          () => {
            console.error(
              "【PHOTOエラー】",
              imageSrc
            );
          },
          { once: true }
        );

      }

    });


    /* =====================================================
       今回のload全体時間
       ===================================================== */

    const loadEnd =
      performance.now();

    console.log(
      "【LOAD全体】",
      "load開始→画面反映=" +
        Math.round(loadEnd - loadStart) +
        "ms"
    );


  } catch (error) {

    console.error(
      "データ取得エラー:",
      error
    );

  }

}


/* =========================================================
   モニター更新
   1秒ごと
   ========================================================= */

async function monitorLoop() {

  await load();

  setTimeout(
    monitorLoop,
    1000
  );

}

monitorLoop();

</script>

</body>
</html>
