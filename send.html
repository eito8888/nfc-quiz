<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>送信中</title>
</head>

<body>

<h2 id="msg">送信中...</h2>
<p id="sub"></p>

<button id="backBtn" onclick="back()" style="display:none;">
戻る
</button>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const params = new URLSearchParams(location.search);

const dog = Number(params.get("dog"));
const chosen = Number(localStorage.getItem("selectedNumber"));
const player = localStorage.getItem("player") || "参加者";

const msg = document.getElementById("msg");
const sub = document.getElementById("sub");
const backBtn = document.getElementById("backBtn");

function back() {
  location.href = "player.html?v=" + Date.now();
}

async function send() {

  const stage = localStorage.getItem("stage");

  msg.innerText =
  "stage=" + stage +
  " selected=" + chosen +
  " dog=" + dog;

  console.log("stage:", stage);

  // ↓ ここから元の処理（そのまま）
  if (!dog || !chosen) {
    msg.innerText = "値取得エラー";
    backBtn.style.display = "inline-block";
    return;
  }

  try {

const res = await fetch(
  `${GAS_URL}?player=${player}&selected=${chosen}&dog=${dog}&stage=${stage}`
);

    const text = await res.text();

    msg.innerText = "✅送信完了";
    sub.innerText = "2秒後に戻ります";

    setTimeout(back, 2000);

  } catch (err) {

    msg.innerText = "⚠ 通信エラー";
    sub.innerText = "もう一度タグをかざしてください";

    backBtn.style.display = "inline-block";
  }
}

send();

</script>

</body>
</html>
