<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クイズモニター</title>

<style>
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h1 {
  margin: 20px 0;
  font-size: 36px;
  color: #333;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding: 10px;
}

.cell {
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  padding: 15px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.answerLine {
  margin-top: 10px;
  color: green;
  font-size: 16px;
  font-weight: bold;
}

img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  margin-top: 10px;
}

.score-container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  padding: 30px;
}

.score-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.score-table th {
  background-color: #ff9800;
  color: white;
  font-size: 24px;
  padding: 15px;
}

.score-table th:first-child {
  border-radius: 10px 0 0 0;
}

.score-table th:last-child {
  border-radius: 0 10px 0 0;
}

.score-table td {
  padding: 18px 20px;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 1px solid #eee;
  color: #333;
}

.score-table tr:nth-child(even) {
  background-color: #fafafa;
}

.score-num {
  color: #e65100;
  font-size: 32px;
}
</style>
</head>

<body>

<h1 id="mainTitle">クイズ</h1>

<div id="displayArea"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";


const preloadedImages = new Map();

function preloadImage(src) {

  if (!src || preloadedImages.has(src)) {
    return;
  }

  const img = new Image();

  img.src = src;

  preloadedImages.set(src, img);
}


if (!window.seenAnswerIds) {
  window.seenAnswerIds = new Set();
}

if (!window.diagnosticAnswers) {
  window.diagnosticAnswers = new Map();
}

if (!window.monitorTimingSent) {
  window.monitorTimingSent = new Set();
}

if (typeof window.monitorInitialized === "undefined") {
  window.monitorInitialized = false;
}


function sendMonitorTiming(
  answerId,
  monitorFetchMs,
  trueDisplayMs,
  photoDisplayMs
) {

  if (!answerId) {
    return;
  }

  if (
    window.monitorTimingSent.has(answerId)
  ) {
    return;
  }

  const url =
    GAS_URL +
    "?event=monitorTiming" +
    "&answerId=" +
    encodeURIComponent(answerId) +
    "&monitorFetchMs=" +
    encodeURIComponent(monitorFetchMs) +
    "&trueDisplayMs=" +
    encodeURIComponent(trueDisplayMs) +
    "&photoDisplayMs=" +
    encodeURIComponent(photoDisplayMs) +
    "&_=" +
    Date.now();

  fetch(
    url,
    {
      method: "GET",
      cache: "no-store"
    }
  )
  .then(
    () => {

      window.monitorTimingSent.add(
        answerId
      );

      console.log(
        "【原因追及 timing_log送信完了】",
        answerId
      );

    }
  )
  .catch(
    error => {

      console.error(
        "【原因追及 timing_log送信エラー】",
        error
      );

    }
  );
}


async function load() {

  const loadStart =
    performance.now();

  try {

    const fetchStart =
      performance.now();

    const fetchStartWallClock =
      Date.now();


    console.log(
      "【MONITOR fetch開始】",
      new Date(
        fetchStartWallClock
      ).toLocaleTimeString()
    );


    const res =
      await fetch(
        GAS_URL,
        {
          cache: "no-store"
        }
      );


    const fetchEnd =
      performance.now();

    const fetchEndWallClock =
      Date.now();


    console.log(
      "【MONITOR HTTP response】",
      res.status,
      "時間=" +
      Math.round(
        fetchEnd - fetchStart
      ) +
      "ms"
    );


    if (!res.ok) {

      throw new Error(
        "HTTP " + res.status
      );

    }


    const jsonStart =
      performance.now();


    const data =
      await res.json();


    const jsonEnd =
      performance.now();


    const gasFetchTime =
      fetchEnd -
      fetchStart;

    const jsonTime =
      jsonEnd -
      jsonStart;


    const monitorFetchMs =
      fetchEndWallClock;


    console.log(
      "【MONITOR取得完了】",
      "fetch=" +
      Math.round(gasFetchTime) +
      "ms",
      "JSON=" +
      Math.round(jsonTime) +
      "ms",
      "全体=" +
      Math.round(
        jsonEnd - loadStart
      ) +
      "ms"
    );


    const displayArea =
      document.getElementById(
        "displayArea"
      );


    const currentStage =
      Number(
        data.currentStage
      );


    /*
     * 写真先読み
     */

    if (data.questions) {

      data.questions.forEach(
        q => {

          const stage =
            String(q[0]).trim();

          const img =
            q[5];

          if (
            stage ===
            String(currentStage).trim()
            &&
            img
          ) {

            preloadImage(
              "images/" + img
            );

          }

        }
      );

    }


    /*
     * Stage 0
     */

    if (
      currentStage === 0
    ) {

      document
        .getElementById(
          "mainTitle"
        )
        .innerText =
        "🎉 イベント結果発表 🎉";


      let tableRows = "";


      if (
        data.scoreList &&
        data.scoreList.length > 0
      ) {

        data.scoreList.forEach(
          item => {

            tableRows += `
              <tr>
                <td style="
                  text-align:left;
                  padding-left:50px;
                ">
                  ${item.player}
                </td>

                <td style="
                  text-align:right;
                  padding-right:50px;
                ">
                  <span class="score-num">
                    ${item.total}
                  </span>
                  点
                </td>
              </tr>
            `;

          }
        );

      }


      const scoreHTML =
        data.scoreList &&
        data.scoreList.length > 0
        ?

        `
        <div class="score-container">

          <table class="score-table">

            <thead>

              <tr>

                <th style="
                  text-align:left;
                  padding-left:50px;
                ">
                  ニックネーム
                </th>

                <th style="
                  text-align:right;
                  padding-right:50px;
                ">
                  合計得点
                </th>

              </tr>

            </thead>

            <tbody>
              ${tableRows}
            </tbody>

          </table>

        </div>
        `

        :

        `
        <div class="score-container">
          <h2>
            まだ回答データがありません
          </h2>
        </div>
        `;


      const scoreSignature =
        JSON.stringify(
          data.scoreList || []
        );


      if (
        window.lastScoreSignature !==
        scoreSignature
      ) {

        displayArea.innerHTML =
          scoreHTML;

        window.lastScoreSignature =
          scoreSignature;

      }


      return;

    }


    /*
     * Stage > 0
     */

    let stageTitle =
      "クイズ";


    const correctMap =
      {};


    const newDiagnostics =
      [];


    /*
     * answers確認
     */

    if (data.answers) {

      data.answers.forEach(
        row => {

          if (!row) {
            return;
          }


          const player =
            String(
              row[0] || ""
            ).trim();


          const selected =
            String(
              row[1] || ""
            ).trim();


          const correct =
            row[3];


          const stage =
            String(
              row[4] || ""
            ).trim();


          const answerId =
            String(
              row[7] || ""
            ).trim();


          const isCorrect =
            correct === true ||
            correct === "TRUE" ||
            correct === "true";


          /*
           * 正解を画面表示用に保存
           */

          if (
            isCorrect &&
            stage ===
            String(currentStage).trim()
          ) {

            const key =
              stage +
              "-" +
              selected;


            if (
              !correctMap[key]
            ) {

              correctMap[key] =
                player;

            }

          }


          /*
           * 新しいanswerId
           */

          if (
            answerId &&
            !window.seenAnswerIds.has(
              answerId
            )
          ) {

            const key =
              stage +
              "-" +
              selected;


            const diagnostic = {

              answerId:
                answerId,

              player:
                player,

              selected:
                selected,

              stage:
                stage,

              key:
                key,

              monitorFetchMs:
                monitorFetchMs,

              trueDisplayMs:
                0,

              photoDisplayMs:
                0,

              answerDetectedPerf:
                performance.now(),

              gasRecordToDetectMs:
                null,

              trueDisplayPerf:
                0,

              photoDisplayPerf:
                0,

              trueLogged:
                false,

              photoLogged:
                false

            };


            window.diagnosticAnswers.set(
              answerId,
              diagnostic
            );


            newDiagnostics.push(
              diagnostic
            );


            const gasRecordTime =
              new Date(
                row[6]
              ).getTime();


            if (
              Number.isFinite(
                gasRecordTime
              )
            ) {

              diagnostic.gasRecordToDetectMs =
                Date.now() -
                gasRecordTime;

            }


            console.log(
              "【原因追及 START】",
              "番号=" + selected,
              "answerId=" + answerId,
              "GAS回答記録=" + row[6],
              "GAS記録→Monitor検知=" +
              (
                diagnostic.gasRecordToDetectMs === null
                ?
                "計算不可"
                :
                Math.round(
                  diagnostic.gasRecordToDetectMs
                ) + "ms"
              )
            );

          }

        }
      );


      /*
       * 初回読み込み時は既存回答を計測しない
       */

      if (
        !window.monitorInitialized
      ) {

        data.answers.forEach(
          row => {

            const answerId =
              String(
                row[7] || ""
              ).trim();


            if (answerId) {

              window.seenAnswerIds.add(
                answerId
              );

            }

          }
        );


        newDiagnostics.length =
          0;


        window.diagnosticAnswers.clear();


        window.monitorInitialized =
          true;


        console.log(
          "【原因追及】初回読み込み完了"
        );

      }

    }


    /*
     * 問題タイトル
     */

    if (data.questions) {

      data.questions.forEach(
        q => {

          if (!q) {
            return;
          }

          const stage =
            String(q[0]).trim();

          if (
            stage ===
            String(currentStage).trim()
          ) {

            stageTitle =
              q[3] ||
              "クイズ";

            return;

          }

        }
      );

    }


    /*
     * 現在ステージだけを使って
     * 描画内容の変更を判定
     */

    const currentQuestions =
      (data.questions || [])
      .filter(
        q =>
          q &&
          String(q[0]).trim() ===
          String(currentStage).trim()
      );


    const renderSignature =
      JSON.stringify({

        stage:
          currentStage,

        title:
          stageTitle,

        questions:
          currentQuestions.map(
            q => [
              q[1],
              q[3],
              q[4],
              q[5]
            ]
          ),

        answers:
          Object.keys(
            correctMap
          )
          .sort()
          .map(
            key => [
              key,
              correctMap[key]
            ]
          )

      });


    const needRender =
      window.lastRenderSignature !==
      renderSignature;


    const htmlBuildStart =
      performance.now();


    /*
     * 画面内容が変わった時だけ
     * innerHTMLを書き換える
     */

    if (needRender) {

      let gridHTML =
        '<div class="grid">';


      currentQuestions.forEach(
        q => {

          const stage =
            String(q[0]).trim();

          const number =
            String(q[1]).trim();

          const title =
            q[3] || "";

          const name =
            q[4] || "";

          const img =
            q[5] || "";


          const key =
            stage +
            "-" +
            number;


          gridHTML +=
            `<div class="cell">

              <div class="title">
                【${number}】${name}
              </div>`;


          if (
            correctMap[key]
          ) {

            gridHTML +=
              `
              <div class="answerLine">
                ✅正解 → ${correctMap[key]}
              </div>
              `;


            if (img) {

              const imageSrc =
                "images/" +
                img;


              gridHTML +=
                `
                <img
                  src="${imageSrc}"
                  data-monitor-image="${imageSrc}"
                  data-answer-key="${key}"
                >
                `;

            }

          }


          gridHTML +=
            "</div>";

        }
      );


      gridHTML +=
        "</div>";


      const renderStart =
        performance.now();


      displayArea.innerHTML =
        gridHTML;


      document
        .getElementById(
          "mainTitle"
        )
        .innerText =
        stageTitle;


      const renderEnd =
        performance.now();


      window.lastRenderSignature =
        renderSignature;


      console.log(
        "【MONITOR画面更新】",
        "HTML構築=" +
        Math.round(
          performance.now() -
          htmlBuildStart
        ) +
        "ms",
        "画面反映=" +
        Math.round(
          renderEnd -
          renderStart
        ) +
        "ms"
      );

    }


    /*
     * TRUE表示
     */

    const trueDisplayMs =
      Date.now();

    const trueDisplayPerf =
      performance.now();


    newDiagnostics.forEach(
      diagnostic => {

        diagnostic.trueDisplayMs =
          trueDisplayMs;

        diagnostic.trueDisplayPerf =
          trueDisplayPerf;

        diagnostic.trueLogged =
          true;


        console.log(
          "【原因追及 TRUE】",
          "番号=" +
          diagnostic.selected,
          "answerId=" +
          diagnostic.answerId,
          "TRUE=" +
          trueDisplayMs,
          "Monitor取得→TRUE=" +
          Math.round(
            trueDisplayPerf -
            diagnostic.answerDetectedPerf
          ) +
          "ms"
        );

      }
    );


    /*
     * 写真
     */

    const imageElements =
      displayArea.querySelectorAll(
        "img[data-monitor-image]"
      );


    imageElements.forEach(
      img => {

        const imageSrc =
          img.getAttribute(
            "data-monitor-image"
          );


        const answerKey =
          img.getAttribute(
            "data-answer-key"
          );


        let diagnostic =
          null;


        /*
         * 今回新しく検知した回答だけ
         * 計測対象にする
         */

        for (
          let i = 0;
          i < newDiagnostics.length;
          i++
        ) {

          if (
            newDiagnostics[i].key ===
            answerKey
          ) {

            diagnostic =
              newDiagnostics[i];

            break;

          }

        }


        /*
         * 今回の新回答に関係ない画像には
         * listenerを追加しない
         */

        if (!diagnostic) {
          return;
        }


        const imageStart =
          performance.now();


        let reported =
          false;


        const reportImageLoad =
          () => {

            if (reported) {
              return;
            }


            if (
              diagnostic.photoLogged
            ) {

              reported =
                true;

              return;

            }


            reported =
              true;


            diagnostic.photoLogged =
              true;


            const imageEnd =
              performance.now();


            const imageLoadTime =
              imageEnd -
              imageStart;


            const totalTime =
              imageEnd -
              loadStart;


            const photoDisplayMs =
              Date.now();


            const photoDisplayPerf =
              performance.now();


            diagnostic.photoDisplayMs =
              photoDisplayMs;


            diagnostic.photoDisplayPerf =
              photoDisplayPerf;


            console.log(
              "==============================="
            );


            console.log(
              "【原因追及 PHOTO】",
              "番号=" +
              diagnostic.selected,
              "answerId=" +
              diagnostic.answerId
            );


            console.log(
              "Monitor取得=" +
              diagnostic.monitorFetchMs
            );


            console.log(
              "TRUE=" +
              diagnostic.trueDisplayMs
            );


            console.log(
              "写真=" +
              photoDisplayMs
            );


            console.log(
              "GAS記録→Monitor検知=" +
              (
                diagnostic.gasRecordToDetectMs === null
                ?
                "計算不可"
                :
                Math.round(
                  diagnostic.gasRecordToDetectMs
                ) + "ms"
              )
            );


            console.log(
              "Monitor fetch=" +
              Math.round(
                fetchEnd -
                fetchStart
              ) +
              "ms"
            );


            console.log(
              "回答検知→TRUE=" +
              (
                diagnostic.answerDetectedPerf
                ?
                Math.round(
                  trueDisplayPerf -
                  diagnostic.answerDetectedPerf
                ) + "ms"
                :
                "計算不可"
              )
            );


            console.log(
              "TRUE→写真=" +
              Math.round(
                photoDisplayPerf -
                (
                  diagnostic.trueDisplayPerf ||
                  trueDisplayPerf
                )
              ) +
              "ms"
            );


            console.log(
              "写真待ち=" +
              Math.round(
                imageLoadTime
              ) +
              "ms"
            );


            console.log(
              "load開始→写真=" +
              Math.round(
                totalTime
              ) +
              "ms"
            );


            console.log(
              "【原因追及 END】"
            );


            /*
             * 既存のmonitorTiming記録
             */

            sendMonitorTiming(
              diagnostic.answerId,
              diagnostic.monitorFetchMs,
              diagnostic.trueDisplayMs,
              diagnostic.photoDisplayMs
            );


            if (
              imageLoadTime >= 5000 ||
              totalTime >= 5000
            ) {

              console.warn(
                "【異常PHOTO計測】",
                imageSrc,
                "画像読み込み=" +
                Math.round(
                  imageLoadTime
                ) +
                "ms",
                "load開始から=" +
                Math.round(
                  totalTime
                ) +
                "ms"
              );

            }

          };


        /*
         * すでに読み込み済み
         */

        if (
          img.complete &&
          img.naturalWidth > 0
        ) {

          reportImageLoad();

          return;

        }


        /*
         * 未読み込み
         */

        img.addEventListener(
          "load",
          reportImageLoad,
          {
            once: true
          }
        );


        img.addEventListener(
          "error",
          () => {

            if (!reported) {

              reported =
                true;

              console.error(
                "【PHOTOエラー】",
                imageSrc,
                "画像開始から=" +
                Math.round(
                  performance.now() -
                  imageStart
                ) +
                "ms"
              );

            }

          },
          {
            once: true
          }
        );

      }
    );


    /*
     * 今回の新回答を既知にする
     */

    newDiagnostics.forEach(
      diagnostic => {

        window.seenAnswerIds.add(
          diagnostic.answerId
        );

      }
    );


    const loadEnd =
      performance.now();


    console.log(
      "【LOAD全体】",
      "load開始→完了=" +
      Math.round(
        loadEnd -
        loadStart
      ) +
      "ms",
      "fetch=" +
      Math.round(
        fetchEnd -
        fetchStart
      ) +
      "ms",
      "JSON=" +
      Math.round(
        jsonEnd -
        fetchEnd
      ) +
      "ms"
    );


  } catch (error) {

    console.error(
      "【MONITOR データ取得エラー】",
      error
    );

  }

}


async function monitorLoop() {

  await load();

  setTimeout(
    monitorLoop,
    1000
  );

}


monitorLoop();

</script>

</body>
</html>
