<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クイズモニター</title>

<style>
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h1 {
  margin: 20px 0;
  font-size: 36px;
  color: #333;
}

/* 通常問題表示用グリッド */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding: 10px;
}

.cell {
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  padding: 15px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.answerLine {
  margin-top: 10px;
  color: green;
  font-size: 16px;
  font-weight: bold;
}

img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  margin-top: 10px;
  display: block;
}

/* Stage=0 合計スコア表示用スタイル */
.score-container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  padding: 30px;
}

.score-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.score-table th {
  background-color: #ff9800;
  color: white;
  font-size: 24px;
  padding: 15px;
}

.score-table th:first-child {
  border-radius: 10px 0 0 0;
}

.score-table th:last-child {
  border-radius: 0 10px 0 0;
}

.score-table td {
  padding: 18px 20px;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 1px solid #eee;
  color: #333;
}

.score-table tr:nth-child(even) {
  background-color: #fafafa;
}

.score-num {
  color: #e65100;
  font-size: 32px;
}
</style>

</head>

<body>

<h1 id="mainTitle">クイズ</h1>

<div id="displayArea"></div>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

/*
 * GASが一時的に非常に遅くなった場合に、
 * monitor.htmlまで何十秒も待ち続けないための上限。
 */
const FETCH_TIMEOUT_MS = 5000;

/*
 * 画像の先読み状態
 */
let preloadedStage = null;
let preloadedImages = new Map();

/*
 * 直前に画面へ表示した内容。
 * 内容が変わっていない場合はDOMを作り直さない。
 */
let lastRenderSignature = "";


/* ==========================================
   画像を先読み・デコードする
   ========================================== */

function preloadImages(questions, currentStage) {

  if (preloadedStage === currentStage) {
    return;
  }

  preloadedStage = currentStage;
  preloadedImages = new Map();

  questions.forEach(q => {

    const stage = String(q[0]).trim();
    const img = q[5];

    if (stage !== String(currentStage).trim()) {
      return;
    }

    if (!img) {
      return;
    }

    const src = "images/" + img;

    /*
     * 同じ画像を二重に先読みしない
     */
    if (preloadedImages.has(src)) {
      return;
    }

    const image = new Image();

    image.decoding = "async";
    image.src = src;

    /*
     * decode()が使えるブラウザでは、
     * ダウンロード後のデコードまで準備する。
     *
     * エラー時もPromiseを拒否状態で残さない。
     * 先読み失敗がmonitorLoopを止めないため。
     */
    const readyPromise =
      image.decode
        ? image.decode().catch(() => {})
        : Promise.resolve();

    preloadedImages.set(src, {
      image: image,
      ready: readyPromise
    });

  });
}


/* ==========================================
   GASからデータを取得
   ========================================== */

async function fetchData() {

  const controller = new AbortController();

  const timer = setTimeout(() => {
    controller.abort();
  }, FETCH_TIMEOUT_MS);

  try {

    const res = await fetch(GAS_URL, {
      signal: controller.signal,
      cache: "no-store"
    });

    if (!res.ok) {
      throw new Error("GAS response status: " + res.status);
    }

    const data = await res.json();

    return data;

  } finally {

    clearTimeout(timer);

  }
}


/* ==========================================
   正解データからMapを作る
   ========================================== */

function buildCorrectMap(answers) {

  const correctMap = {};

  if (!Array.isArray(answers)) {
    return correctMap;
  }

  answers.forEach(row => {

    const player = String(row[0]).trim();
    const selected = String(row[1]).trim();
    const correct = row[3];
    const stage = String(row[4]).trim();

    const isCorrect =
      (
        correct === true ||
        correct === "TRUE" ||
        correct === "true"
      );

    if (!isCorrect) {
      return;
    }

    const key = stage + "-" + selected;

    /*
     * 同じ問題に複数人が正解した場合は、
     * 現在の仕様どおり最初のプレイヤーを表示。
     */
    if (!correctMap[key]) {
      correctMap[key] = player;
    }

  });

  return correctMap;
}


/* ==========================================
   通常問題画面を作る
   ========================================== */

function renderQuiz(data, currentStage) {

  const displayArea =
    document.getElementById("displayArea");

  const correctMap =
    buildCorrectMap(data.answers);

  let stageTitle = "クイズ";

  let gridHTML = '<div class="grid">';

  data.questions.forEach(q => {

    const stage = String(q[0]).trim();
    const number = String(q[1]).trim();
    const title = q[3];
    const name = q[4];
    const img = q[5];

    if (stage !== String(currentStage).trim()) {
      return;
    }

    stageTitle = title || "クイズ";

    const key = stage + "-" + number;

    let cellContent =
      `<div class="title">【${number}】${name}</div>`;

    if (correctMap[key]) {

      cellContent += `
        <div class="answerLine">
          ✅正解 → ${correctMap[key]}
        </div>
      `;

      if (img) {

        /*
         * 画像先読み済みでも、通常のimgとして表示する。
         * ブラウザのキャッシュを利用できるため、
         * 先読みが完了していれば表示時の通信を避けられる。
         */
        cellContent += `
          <img
            src="images/${img}"
            loading="eager"
            decoding="async"
            alt=""
          >
        `;

      }

    }

    gridHTML += `
      <div class="cell">
        ${cellContent}
      </div>
    `;

  });

  gridHTML += "</div>";

  displayArea.innerHTML = gridHTML;

  document.getElementById("mainTitle").innerText =
    stageTitle;
}


/* ==========================================
   Stage = 0 結果発表画面
   ========================================== */

function renderScore(data) {

  const displayArea =
    document.getElementById("displayArea");

  document.getElementById("mainTitle").innerText =
    "🎉 イベント結果発表 🎉";

  if (
    !data.scoreList ||
    data.scoreList.length === 0
  ) {

    displayArea.innerHTML =
      `<div class="score-container">
        <h2>まだ回答データがありません</h2>
      </div>`;

    return;
  }

  let tableRows = "";

  data.scoreList.forEach(item => {

    tableRows += `
      <tr>
        <td style="text-align: left; padding-left: 50px;">
          ${item.player}
        </td>

        <td style="text-align: right; padding-right: 50px;">
          <span class="score-num">
            ${item.total}
          </span> 点
        </td>
      </tr>
    `;

  });

  displayArea.innerHTML = `
    <div class="score-container">

      <table class="score-table">

        <thead>
          <tr>
            <th style="text-align: left; padding-left: 50px;">
              ニックネーム
            </th>

            <th style="text-align: right; padding-right: 50px;">
              合計得点
            </th>
          </tr>
        </thead>

        <tbody>
          ${tableRows}
        </tbody>

      </table>

    </div>
  `;
}


/* ==========================================
   画面更新が必要か判定
   ========================================== */

function makeRenderSignature(data, currentStage) {

  if (currentStage === 0) {

    return JSON.stringify({
      stage: 0,
      scoreList: data.scoreList || []
    });

  }

  const correctMap =
    buildCorrectMap(data.answers);

  const stageQuestions =
    Array.isArray(data.questions)
      ? data.questions.filter(q =>
          String(q[0]).trim() ===
          String(currentStage).trim()
        )
      : [];

  return JSON.stringify({
    stage: currentStage,
    questions: stageQuestions,
    correctMap: correctMap
  });
}


/* ==========================================
   メインload
   ========================================== */

async function load() {

  try {

    const data = await fetchData();

    /*
     * GASから正常なデータが返ってきた場合だけ
     * currentStageを使って処理する。
     */
    const currentStage =
      Number(data.currentStage);

    if (!Number.isFinite(currentStage)) {
      throw new Error("currentStage is invalid");
    }


    /*
     * Stage > 0 の場合は先に画像先読みを開始。
     *
     * ここでは画像の完了を待たない。
     * 画面更新を画像待ちで止めないため。
     */
    if (currentStage > 0) {

      preloadImages(
        data.questions,
        currentStage
      );

    }


    /*
     * 内容が変わっていない場合、
     * DOMを作り直さない。
     *
     * これにより1.5秒ごとの監視で、
     * 写真を何度も再配置することを防ぐ。
     */
    const signature =
      makeRenderSignature(
        data,
        currentStage
      );

    if (signature === lastRenderSignature) {
      return;
    }


    /*
     * ここから先は本当に画面が変わった場合だけ。
     */
    lastRenderSignature = signature;


    if (currentStage === 0) {

      renderScore(data);

      return;
    }


    renderQuiz(
      data,
      currentStage
    );


  } catch (error) {

    /*
     * 通信が失敗・タイムアウトしても、
     * 現在表示されている画面は消さない。
     *
     * 次のmonitorLoopで再取得する。
     */

    if (error.name === "AbortError") {

      console.warn(
        "GASへの通信が5秒以内に完了しなかったため、今回の取得を中止しました。現在の画面を維持します。"
      );

    } else {

      console.warn(
        "今回のGAS取得に失敗しました。現在の画面を維持します。",
        error
      );

    }

  }
}


/* ==========================================
   監視ループ
   ========================================== */

async function monitorLoop() {

  await load();

  /*
   * load()が終わってから1.5秒後に次の確認。
   *
   * 前のload()が終わる前に次のload()を開始しない。
   */
  setTimeout(
    monitorLoop,
    1500
  );

}


/* ==========================================
   開始
   ========================================== */

monitorLoop();

</script>

</body>
</html>
