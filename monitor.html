<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>犬クイズ モニター</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  h1 {
    margin: 15px;
    font-size: clamp(22px, 3vw, 40px);
  }

  /* ★画面サイズに応じて自動調整 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    padding: 18px;
  }

  /* ★枠も自動で大きさ調整 */
  .cell {
    border: 2px solid #999;
    border-radius: 14px;
    padding: 12px;

    min-height: 200px;

    font-size: clamp(16px, 2vw, 26px);

    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
  }

  /* 番号＋犬名 横並び */
  .title {
    font-weight: bold;
    font-size: clamp(18px, 2.4vw, 30px);
    margin-bottom: 6px;
  }

  /* 正解表示 */
  .answered {
    font-weight: bold;
  }

  .answerLine {
    margin-top: 6px;
    font-size: clamp(16px, 2vw, 24px);
  }

  /* ★写真は絶対はみ出さない */
  img {
    margin-top: 10px;
    width: 100%;
    height: 120px;
    object-fit: contain;
    border-radius: 10px;
  }
</style>
</head>

<body>

<h1>🐶 犬クイズ</h1>
<div id="grid" class="grid"></div>

<script>
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbysC8_DE3KENuaTbOynEviquqjhPVcSCxXo6zIREjkKnVrYrHdLey4vH0G8ARhHPPOo/exec";

async function load() {

  const res = await fetch(GAS_URL + "?mode=monitor");
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  data.questions.forEach(q => {

    const num  = q[0];
    const name = q[1];
    const img  = q[2];

    const div = document.createElement("div");
    div.className = "cell";

    /* 通常表示 */
    div.innerHTML = `
      <div class="title">【${num}】 ${name}</div>
    `;

    /* 正解していたら追加 */
    if (data.correctMap[num]) {

      div.classList.add("answered");

      div.innerHTML += `
        <div class="answerLine">
          ✅ 正解！ → ${data.correctMap[num]}
        </div>
      `;

      if (img) {
        div.innerHTML += `<img src="images/${img}">`;
      }
    }

    grid.appendChild(div);
  });
}

/* 初回 */
load();

/* ★1.5秒ごとに更新（少し速く） */
setInterval(load, 1500);
</script>

</body>
</html>
