<script>

const GAS_URL = "あなたのGAS URL";

/* ★ パラメータ取得（安全版） */
const params = new URLSearchParams(location.search);

const dog = Number(params.get("dog"));
const chosen = Number(localStorage.getItem("selectedNumber"));
const player = localStorage.getItem("player") || "参加者";

/* 表示 */
const msg = document.getElementById("msg");
const sub = document.getElementById("sub");
const backBtn = document.getElementById("backBtn");

function back() {
  location.href = "player.html?v=" + Date.now();
}

async function send() {

  /* ★ デバッグ表示 */
  console.log("dog:", dog);
  console.log("chosen:", chosen);

  if (!dog || !chosen) {
    msg.innerText = "値取得エラー（dog または 選択番号）";
    backBtn.style.display = "inline-block";
    return;
  }

  try {

    await fetch(
      `${GAS_URL}?player=${player}&selected=${chosen}&dog=${dog}`
    );

    msg.innerText = "✅送信完了";
    sub.innerText = "2秒後に戻ります";

    setTimeout(back, 2000);

  } catch (err) {

    msg.innerText = "⚠ 通信できませんでした";
    sub.innerText = "もう一度タグをかざしてください";

    backBtn.style.display = "inline-block";
  }
}

send();

</script>
