<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信画面</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 40px;
  }

  #msg {
    font-size: 34px;
    font-weight: bold;
    margin-top: 60px;
  }

  #sub {
    font-size: 18px;
    margin-top: 20px;
    color: #555;
  }

  button {
    font-size: 26px;
    padding: 15px 30px;
    border-radius: 15px;
    margin-top: 40px;
  }
</style>
</head>

<body>

<div id="msg">送信中…</div>
<div id="sub"></div>

<button onclick="back()" style="display:none;" id="backBtn">
戻る
</button>

<script>

/* ★あなたのGAS URL */
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbysC8_DE3KENuaTbOynEviquqjhPVcSCxXo6zIREjkKnVrYrHdLey4vH0G8ARhHPPOo/exec";

/* ★NFCタグ番号（旧dog） */
const dog = new URLSearchParams(location.search).get("dog");

/* ★選択番号 */
const chosen = localStorage.getItem("selectedNumber");

/* ★現在ステージ */
const stage = localStorage.getItem("currentStage");

/* ★プレイヤー名 */
const player = localStorage.getItem("player") || "参加者";

const msg = document.getElementById("msg");
const sub = document.getElementById("sub");
const backBtn = document.getElementById("backBtn");

function back() {
  location.href = "player.html?v=" + Date.now();
}

async function send() {

  if (!chosen) {
    msg.innerText = "番号が選ばれていません";
    backBtn.style.display = "inline-block";
    return;
  }

  try {

    await fetch(
      `${GAS_URL}?player=${player}&selected=${chosen}&dog=${dog}`
);

    msg.innerText = "✅送信完了";
    sub.innerText = "2秒後に戻ります";

    setTimeout(back, 2000);

  } catch (err) {

    msg.innerText = "⚠ 通信できませんでした";
    sub.innerText = "もう一度タグをかざしてください";
    backBtn.style.display = "inline-block";
  }
}

send();

</script>

</body>
</html>
