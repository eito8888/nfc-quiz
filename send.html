<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding-top: 60px;
}

h1 {
  font-size: 52px;
}

#msg {
  font-size: 50px;
  font-weight: bold;
  margin-top: 40px;
}

#debug {
  margin-top: 40px;
  font-size: 28px;
  line-height: 1.6;
  font-weight: bold;
}
</style>
</head>

<body>

<h1 id="msg">📡 送信中…</h1>

<div id="debug"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msgDiv = document.getElementById("msg");
const debugDiv = document.getElementById("debug");

const player = localStorage.getItem("player");
const selected = localStorage.getItem("selectedNumber");

const params = new URLSearchParams(location.search);

const dog = params.get("dog");
const number = params.get("number");
const tagStage = params.get("stage");

const sendNumber = number || dog;

const sendKey =
  "sending_" +
  String(player || "") + "_" +
  String(selected || "") + "_" +
  String(sendNumber || "") + "_" +
  String(tagStage || "");

function showDebug(text) {
  debugDiv.innerText = text;
}

function send() {

  const measureStart = performance.now();

  showDebug("計測開始");

  if (sessionStorage.getItem(sendKey) === "sending") {
    showDebug("二重送信防止");
    return;
  }

  sessionStorage.setItem(sendKey, "sending");

  const url =
    `${GAS_URL}?player=${encodeURIComponent(player)}` +
    `&selected=${encodeURIComponent(selected)}` +
    `&number=${encodeURIComponent(sendNumber)}` +
    `&tagStage=${encodeURIComponent(tagStage)}` +
    `&_=${Date.now()}`;

  const fetchStart = performance.now();

  fetch(url, {
    method: "GET",
    cache: "no-store"
  })
  .then((response) => {

    const responseTime =
      performance.now() - measureStart;

    sessionStorage.setItem(sendKey, "sent");

    msgDiv.innerText = "📩 送信しました！";

    const displayTime =
      performance.now() - measureStart;

    showDebug(
      "fetch開始 → GAS応答：約 " +
      (responseTime - (fetchStart - measureStart)).toFixed(0) +
      " ms\n" +
      "送信開始 → GAS応答：約 " +
      responseTime.toFixed(0) +
      " ms\n" +
      "送信開始 →「送信しました」表示：約 " +
      displayTime.toFixed(0) +
      " ms"
    );

    setTimeout(() => {
      location.href = "player.html";
    }, 1500);

  })
  .catch((error) => {

    const errorTime =
      performance.now() - measureStart;

    sessionStorage.setItem(sendKey, "sent");

    msgDiv.innerText = "📩 送信しました！";

    showDebug(
      "通信ERROR\n" +
      "送信開始 → ERROR：約 " +
      errorTime.toFixed(0) +
      " ms"
    );

    setTimeout(() => {
      location.href = "player.html";
    }, 1500);

  });
}

send();

</script>

</body>
</html>
