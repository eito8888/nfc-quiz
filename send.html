<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>送信中...</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding-top:30px;
  margin:0;
}

#msg{
  font-size:42px;
  font-weight:bold;
  margin:0 0 18px;
}

#debug{
  font-size:20px;
  line-height:1.35;
  white-space:pre-line;
  text-align:left;
  padding:0 12px;
  max-width:900px;
  margin:auto;
}
</style>
</head>

<body>

<div id="msg">📡 送信中…</div>
<div id="debug"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msgDiv =
document.getElementById("msg");

const debugDiv =
document.getElementById("debug");


/* =========================================================
   基本情報
   ========================================================= */

const player =
localStorage.getItem("player") || "";

const storedSelected =
localStorage.getItem("selectedNumber") || "";


const params =
new URLSearchParams(location.search);

const urlNumber =
params.get("number") || "";

const dog =
params.get("dog") || "";

const tagStage =
params.get("stage") || "";


/* =========================================================
   ★今回の重要変更
   送信番号を1つに確定する
   =========================================================

   URLのnumberが存在する場合は、
   それを今回の送信番号として使用。

   localStorageの古いselectedNumberを
   別の番号として送らない。
*/

const sendNumber =
urlNumber || dog || storedSelected;


/*
   GASには
   selected と number の両方が必要。

   今回の送信対象番号を
   両方に統一する。
*/

const selectedForSend =
sendNumber;


/* =========================================================
   二重送信防止
   ========================================================= */

const sendKey =
"sending_" +
String(player) +
"_" +
String(sendNumber) +
"_" +
String(tagStage);


if(
  sessionStorage.getItem(sendKey) ===
  "sending"
){

  msgDiv.innerText =
    "📩 送信しました！";

  debugDiv.innerText =
    "二重送信防止";

}else{

  sessionStorage.setItem(
    sendKey,
    "sending"
  );

  send();

}


/* =========================================================
   診断保存
   ========================================================= */

function saveSendRecord(record){

  try{

    const key =
      "NFC_SEND_HISTORY";

    let history =
      JSON.parse(
        localStorage.getItem(key) || "[]"
      );

    history.push(record);

    if(history.length > 100){

      history =
        history.slice(-100);

    }

    localStorage.setItem(
      key,
      JSON.stringify(history)
    );

  }catch(e){

    console.error(
      "診断保存ERROR",
      e
    );

  }

}


/* =========================================================
   送信しました時刻をGASへ通知
   ========================================================= */

function sendSentDisplay(
  answerId,
  sentDisplayMs
){

  if(!answerId){

    return;

  }


  const url =
    GAS_URL +
    "?event=sentDisplay" +
    "&answerId=" +
    encodeURIComponent(answerId) +
    "&sentDisplayMs=" +
    encodeURIComponent(sentDisplayMs) +
    "&player=" +
    encodeURIComponent(player) +
    "&number=" +
    encodeURIComponent(sendNumber) +
    "&stage=" +
    encodeURIComponent(tagStage) +
    "&_=" +
    Date.now();


  /*
     ★重要

     「送信しました」の表示後に
     この通信を待たない。

     ゲーム本線とは完全に分離。
  */

  fetch(
    url,
    {
      method:"GET",
      cache:"no-store",
      keepalive:true
    }
  )
  .then(
    response => {

      console.log(
        "【SEND sentDisplay成功】",
        response.status
      );

    }
  )
  .catch(
    error => {

      console.error(
        "【SEND sentDisplay失敗】",
        error
      );

    }
  );

}


/* =========================================================
   メイン送信
   ========================================================= */

function send(){

  const sendStartPerf =
    performance.now();

  const sendStartMs =
    Date.now();


  msgDiv.innerText =
    "📡 送信中…";


  /*
     fetch開始
  */

  const fetchStartPerf =
    performance.now();

  const fetchStartMs =
    Date.now();


  const sendToFetchMs =
    fetchStartMs -
    sendStartMs;


  console.log(
    "【SEND開始】",
    "player=" + player,
    "storedSelected=" + storedSelected,
    "urlNumber=" + urlNumber,
    "sendNumber=" + sendNumber,
    "stage=" + tagStage
  );


  /*
     ★送信番号の診断

     localStorageとURLが違っていた場合も
     記録する。
  */

  const numberMismatch =
    storedSelected &&
    urlNumber &&
    String(storedSelected) !==
    String(urlNumber);


  if(numberMismatch){

    console.warn(
      "【番号不一致検知】",
      "localStorage=" + storedSelected,
      "URL=" + urlNumber,
      "送信=" + sendNumber
    );

  }


  const url =
    GAS_URL +
    "?player=" +
    encodeURIComponent(player) +
    "&selected=" +
    encodeURIComponent(selectedForSend) +
    "&number=" +
    encodeURIComponent(sendNumber) +
    "&tagStage=" +
    encodeURIComponent(tagStage) +
    "&clientSendMs=" +
    encodeURIComponent(sendStartMs) +
    "&_=" +
    Date.now();


  /*
     ★15秒Abortは使用しない
  */

  fetch(
    url,
    {
      method:"GET",
      cache:"no-store"
    }
  )

  .then(
    response => {

      const responseMs =
        Date.now();

      const responsePerf =
        performance.now();


      window.__responseMs =
        responseMs;

      window.__responseStatus =
        response.status;


      if(!response.ok){

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      return response.json()
        .then(
          data => {

            return {
              data:data,
              responseMs:responseMs,
              responsePerf:responsePerf
            };

          }
        );

    }
  )

  .then(
    result => {

      const data =
        result.data;


      const responseMs =
        result.responseMs;


      const jsonEndMs =
        Date.now();

      const jsonEndPerf =
        performance.now();


      const answerId =
        String(
          data.answerId || ""
        ).trim();


      const sendToResponseMs =
        responseMs -
        sendStartMs;


      const sendToJsonMs =
        jsonEndMs -
        sendStartMs;


      const fetchMs =
        jsonEndPerf -
        fetchStartPerf;


      const gasReceiveMs =
        Number(
          data.gasReceiveMs
        ) || 0;


      const gasCompleteMs =
        Number(
          data.gasCompleteMs
        ) || 0;


      const gasInternalMs =
        (
          gasReceiveMs &&
          gasCompleteMs
        )
        ?
        gasCompleteMs -
        gasReceiveMs
        :
        0;


      const fetchToGasReceiveMs =
        gasReceiveMs
        ?
        gasReceiveMs -
        fetchStartMs
        :
        0;


      const sendToGasReceiveMs =
        gasReceiveMs
        ?
        gasReceiveMs -
        sendStartMs
        :
        0;


      const gasCompleteToResponseMs =
        gasCompleteMs
        ?
        responseMs -
        gasCompleteMs
        :
        0;


      /*
      =====================================================
      ★送信しました表示
      =====================================================
      */

      const sentDisplayMs =
        Date.now();


      const sendToSentMs =
        sentDisplayMs -
        sendStartMs;


      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      /*
         ★先に画面表示
      */

      msgDiv.innerText =
        "📩 送信しました！";


      /*
         ★送信→送信しました
           を即時に画面表示
      */

      debugDiv.innerText =
        "送信開始 → 送信しました：" +
        sendToSentMs +
        " ms\n\n" +

        "送信開始 → HTTP応答：" +
        sendToResponseMs +
        " ms\n\n" +

        "fetch開始 → GAS受信：" +
        fetchToGasReceiveMs +
        " ms\n\n" +

        "GAS受信 → GAS処理完了：" +
        gasInternalMs +
        " ms\n\n" +

        "番号：" +
        sendNumber;


      /*
      =====================================================
      ★timing_log用
      =====================================================
      */

      sendSentDisplay(
        answerId,
        sentDisplayMs
      );


      /*
      =====================================================
      ローカル診断
      =====================================================
      */

      saveSendRecord({

        result:
          "GAS_RESPONSE",

        pageStartMs:
          performance.timeOrigin,

        sendStartMs:
          sendStartMs,

        fetchStartMs:
          fetchStartMs,

        responseMs:
          responseMs,

        jsonEndMs:
          jsonEndMs,

        sentDisplayMs:
          sentDisplayMs,

        sendToFetchMs:
          sendToFetchMs,

        sendToResponseMs:
          sendToResponseMs,

        sendToSentMs:
          sendToSentMs,

        fetchMs:
          Math.round(fetchMs),

        fetchToGasReceiveMs:
          Math.round(
            fetchToGasReceiveMs
          ),

        sendToGasReceiveMs:
          Math.round(
            sendToGasReceiveMs
          ),

        gasInternalMs:
          Math.round(
            gasInternalMs
          ),

        gasCompleteToResponseMs:
          Math.round(
            gasCompleteToResponseMs
          ),

        answerId:
          answerId,

        player:
          player,

        selected:
          selectedForSend,

        storedSelected:
          storedSelected,

        urlNumber:
          urlNumber,

        number:
          sendNumber,

        tagStage:
          tagStage,

        numberMismatch:
          numberMismatch,

        httpStatus:
          window.__responseStatus

      });


      /*
      =====================================================
      ★2.5秒だけ表示
      =====================================================
      */

      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        2500
      );

    }
  )

  .catch(
    error => {

      const errorMs =
        Date.now();

      const errorElapsed =
        errorMs -
        sendStartMs;


      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      /*
         通信エラーでも
         ゲームを止めない
      */

      msgDiv.innerText =
        "📩 送信しました！";


      debugDiv.innerText =
        "送信開始 → 通信終了：" +
        errorElapsed +
        " ms\n\n" +

        "通信エラー：" +
        String(error) +
        "\n\n" +

        "番号：" +
        sendNumber;


      saveSendRecord({

        result:
          "ERROR",

        sendStartMs:
          sendStartMs,

        errorMs:
          errorMs,

        elapsedMs:
          errorElapsed,

        error:
          String(error),

        player:
          player,

        selected:
          selectedForSend,

        storedSelected:
          storedSelected,

        urlNumber:
          urlNumber,

        number:
          sendNumber,

        tagStage:
          tagStage,

        numberMismatch:
          numberMismatch

      });


      /*
         2.5秒後に次へ
      */

      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        2500
      );

    }
  );

}

</script>

</body>
</html>
