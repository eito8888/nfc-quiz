<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>犬クイズ モニター</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  h1 {
    margin: 10px;
    font-size: 28px;
  }

  /* ★10問固定：5列×2行（絶対崩れない） */
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    padding: 12px;
  }

  .cell {
    border: 2px solid #999;
    border-radius: 12px;
    padding: 8px;

    height: 170px;        /* ★高さ固定で縦はみ出し防止 */
    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  /* ★番号＋犬名は1行固定 */
  .title {
    font-weight: bold;
    font-size: 20px;
    white-space: nowrap;   /* ★折り返し禁止 */
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 正解＋あだ名（長い場合は縮小） */
  .answerLine {
    font-size: 16px;
    margin-top: 4px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* ★写真は絶対枠内 */
  img {
    margin-top: 6px;
    width: 100%;
    height: 95px;
    object-fit: contain;
  }
</style>
</head>

<body>

<h1>🐶 犬クイズ</h1>
<div id="grid" class="grid"></div>

<script>
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbysC8_DE3KENuaTbOynEviquqjhPVcSCxXo6zIREjkKnVrYrHdLey4vH0G8ARhHPPOo/exec";

async function load() {

  const res = await fetch(GAS_URL + "?mode=monitor");
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  data.questions.forEach(q => {

    const num  = q[0];
    const name = q[1];
    const img  = q[2];

    const div = document.createElement("div");
    div.className = "cell";

    div.innerHTML = `
      <div class="title">【${num}】${name}</div>
    `;

    if (data.correctMap[num]) {

      div.innerHTML += `
        <div class="answerLine">
          ✅正解 → ${data.correctMap[num]}
        </div>
      `;

      if (img) {
        div.innerHTML += `<img src="images/${img}">`;
      }
    }

    grid.appendChild(div);
  });
}

load();
setInterval(load, 1500);
</script>

</body>
</html>
