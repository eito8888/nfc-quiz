<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding-top: 60px;
}

h1 {
  font-size: 46px;
}

#msg {
  font-size: 40px;
  font-weight: bold;
  margin-top: 30px;
}
</style>
</head>

<body>

<h1>📡 送信中...</h1>
<div id="msg"></div>

<script>
/* ★あなたのGAS URL */
const GAS_URL =
"https://script.google.com/macros/s/AKfycbysC8_DE3KENuaTbOynEviquqjhPVcSCxXo6zIREjkKnVrYrHdLey4vH0G8ARhHPPOo/exec";

/* 保存された情報 */
const player = localStorage.getItem("player");
const selected = localStorage.getItem("selectedNumber");

/* NFCタグの dog番号 */
const dog = new URLSearchParams(location.search).get("dog");

/* 番号未選択なら戻す */
if (!selected) {
  document.getElementById("msg").innerText =
    "⚠ 番号が選ばれていません";
}

/* 送信 */
async function send() {

  const res = await fetch(
    `${GAS_URL}?player=${player}&selected=${selected}&dog=${dog}`
  );

  const data = await res.json();

  if (data.result === "correct") {
    document.getElementById("msg").innerText = "🎉 正解！";
  } else {
    document.getElementById("msg").innerText = "❌ 不正解";
  }

  /* ★2秒後に戻る */
  setTimeout(() => {
    location.href = "player.html";
  }, 2000);
}

send();
</script>

</body>
</html>
