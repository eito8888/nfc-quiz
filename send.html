<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信中...</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding-top:25px;
  margin:0;
}

h1{
  font-size:42px;
  margin:0 0 18px;
}

#msg{
  font-size:38px;
  font-weight:bold;
  margin-top:10px;
}

#debug{
  margin:18px auto 0;
  font-size:24px;
  line-height:1.22;
  font-weight:bold;
  white-space:pre-line;
  text-align:left;
  padding:0 12px;
  max-width:900px;
}
</style>
</head>

<body>

<h1 id="msg">📡 送信中…</h1>
<div id="debug"></div>

<script>

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzVLGhB3AqoptBJiGCFk6fAj19xz7NK4cAL-FZYJnADRREf4aXlC4nRHvTUyfS0IgAh/exec";

const msgDiv =
  document.getElementById("msg");

const debugDiv =
  document.getElementById("debug");

const player =
  localStorage.getItem("player");

const selected =
  localStorage.getItem("selectedNumber");

const params =
  new URLSearchParams(location.search);

const dog =
  params.get("dog");

const number =
  params.get("number");

const tagStage =
  params.get("stage");

const sendNumber =
  number || dog;

const sendKey =
  "sending_" +
  String(player || "") +
  "_" +
  String(selected || "") +
  "_" +
  String(sendNumber || "") +
  "_" +
  String(tagStage || "");

const requestId =
  (crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : (
        "r_" +
        Date.now() +
        "_" +
        Math.random().toString(36).slice(2)
      );

let timeoutWarningMs = 0;


/* ========================================================
   ローカル診断保存
   ======================================================== */

function saveSendRecord(record){

  try{

    const key =
      "NFC_SEND_HISTORY";

    let history =
      JSON.parse(
        localStorage.getItem(key) || "[]"
      );

    history.push(record);

    if(history.length > 100){

      history =
        history.slice(-100);

    }

    localStorage.setItem(
      key,
      JSON.stringify(history)
    );

  }catch(e){

    console.error(
      "【診断保存ERROR】",
      e
    );

  }

}


function saveLastDiagnostic(record){

  try{

    localStorage.setItem(
      "NFC_LAST_DIAGNOSTIC",
      JSON.stringify(record)
    );

  }catch(e){

    console.error(
      "【診断保存ERROR】",
      e
    );

  }

}


function showDiagnostic(lines){

  debugDiv.innerText =
    lines.join("\n");

}


function ms(v){

  return (
    typeof v === "number" &&
    Number.isFinite(v)
  )
    ? Math.round(v)
    : "取得不可";

}


/* ========================================================
   ブラウザ状態
   ======================================================== */

function getBrowserState(){

  let c = null;

  try{

    c =
      navigator.connection ||
      navigator.mozConnection ||
      navigator.webkitConnection;

  }catch(e){}

  return {

    online:
      navigator.onLine,

    visibility:
      document.visibilityState,

    readyState:
      document.readyState,

    effectiveType:
      c && c.effectiveType
        ? c.effectiveType
        : "",

    downlink:
      c && typeof c.downlink === "number"
        ? c.downlink
        : null,

    rtt:
      c && typeof c.rtt === "number"
        ? c.rtt
        : null,

    saveData:
      c && typeof c.saveData === "boolean"
        ? c.saveData
        : null,

    userAgent:
      navigator.userAgent

  };

}


function browserLines(s){

  return [

    "【スマホ・ブラウザ状態】",

    "navigator.onLine：" +
      String(s.online),

    "画面状態：" +
      String(s.visibility),

    "document.readyState：" +
      String(s.readyState),

    "通信方式：" +
      (
        s.effectiveType ||
        "取得不可"
      ),

    "推定下り速度：" +
      (
        s.downlink !== null
          ? s.downlink + " Mbps"
          : "取得不可"
      ),

    "推定RTT：" +
      (
        s.rtt !== null
          ? s.rtt + " ms"
          : "取得不可"
      ),

    "SaveData：" +
      (
        s.saveData !== null
          ? String(s.saveData)
          : "取得不可"
      )

  ];

}


/* ========================================================
   Resource Timing

   GASは途中でリダイレクトする場合があるため、
   GAS_URLそのものだけでなく
   script.google.com / script.googleusercontent.com
   のGAS通信も候補にする。
   ======================================================== */

function getResourceTiming(target){

  try{

    const entries =
      performance.getEntriesByType(
        "resource"
      );

    const list =
      entries.filter(e => {

        const name =
          String(e.name || "");

        return (
          name.indexOf(target) === 0 ||
          name.indexOf(
            "https://script.google.com/"
          ) === 0 ||
          name.indexOf(
            "https://script.googleusercontent.com/"
          ) === 0
        );

      });

    if(!list.length){

      return null;

    }

    list.sort(
      (a,b) =>
        b.startTime - a.startTime
    );

    const e =
      list[0];

    return {

      name:
        e.name || "",

      startTime:
        e.startTime,

      duration:
        e.duration,

      redirectStart:
        e.redirectStart,

      redirectEnd:
        e.redirectEnd,

      workerStart:
        e.workerStart,

      fetchStart:
        e.fetchStart,

      domainLookupStart:
        e.domainLookupStart,

      domainLookupEnd:
        e.domainLookupEnd,

      connectStart:
        e.connectStart,

      connectEnd:
        e.connectEnd,

      secureConnectionStart:
        e.secureConnectionStart,

      requestStart:
        e.requestStart,

      responseStart:
        e.responseStart,

      responseEnd:
        e.responseEnd,

      transferSize:
        e.transferSize,

      encodedBodySize:
        e.encodedBodySize,

      decodedBodySize:
        e.decodedBodySize,

      nextHopProtocol:
        e.nextHopProtocol || "",

      initiatorType:
        e.initiatorType || ""

    };

  }catch(e){

    return null;

  }

}


function resourceLines(rt){

  if(!rt){

    return [

      "【ブラウザ通信計測】",

      "Resource Timing：記録なし"

    ];

  }

  return [

    "【ブラウザ通信計測】",

    "Resource URL：" +
      (
        rt.name
          ? rt.name
          : "取得不可"
      ),

    "Resource開始：" +
      ms(rt.startTime) +
      " ms",

    "Resource duration：" +
      ms(rt.duration) +
      " ms",

    "fetchStart：" +
      ms(rt.fetchStart) +
      " ms",

    "DNS開始：" +
      ms(rt.domainLookupStart) +
      " ms",

    "DNS終了：" +
      ms(rt.domainLookupEnd) +
      " ms",

    "接続開始：" +
      ms(rt.connectStart) +
      " ms",

    "接続終了：" +
      ms(rt.connectEnd) +
      " ms",

    "TLS開始：" +
      ms(rt.secureConnectionStart) +
      " ms",

    "HTTP request開始：" +
      ms(rt.requestStart) +
      " ms",

    "HTTP response開始：" +
      ms(rt.responseStart) +
      " ms",

    "HTTP response終了：" +
      ms(rt.responseEnd) +
      " ms",

    "転送サイズ：" +
      ms(rt.transferSize) +
      " bytes",

    "protocol：" +
      (
        rt.nextHopProtocol ||
        "取得不可"
      ),

    "initiator：" +
      (
        rt.initiatorType ||
        "取得不可"
      )

  ];

}


/* ========================================================
   clientTiming送信

   メインの送信fetchとは完全に別処理。
   これがメイン送信を待たせることはない。
   ======================================================== */

function sendClientTiming(d){

  try{

    const rt =
      d.resourceTiming || null;

    const bs =
      d.browserState ||
      getBrowserState();

    const p =
      new URLSearchParams();

    p.set(
      "event",
      "clientTiming"
    );

    p.set(
      "requestId",
      d.requestId || requestId
    );

    if(d.answerId){

      p.set(
        "answerId",
        d.answerId
      );

    }

    p.set(
      "sendStartMs",
      d.sendStartMs || ""
    );

    p.set(
      "fetchStartMs",
      d.fetchStartMs || ""
    );

    p.set(
      "responseMs",
      d.responseMs || ""
    );

    p.set(
      "jsonEndMs",
      d.jsonEndMs || ""
    );

    p.set(
      "sentDisplayMs",
      d.sentDisplayMs || ""
    );

    p.set(
      "timeoutMs",
      d.timeoutMs || ""
    );

    p.set(
      "httpStatus",
      d.httpStatus || ""
    );

    p.set(
      "online",
      bs.online === undefined
        ? ""
        : String(bs.online)
    );

    p.set(
      "visibility",
      bs.visibility || ""
    );

    p.set(
      "effectiveType",
      bs.effectiveType || ""
    );

    p.set(
      "downlink",
      bs.downlink === null ||
      bs.downlink === undefined
        ? ""
        : String(bs.downlink)
    );

    p.set(
      "rtt",
      bs.rtt === null ||
      bs.rtt === undefined
        ? ""
        : String(bs.rtt)
    );

    p.set(
      "diagnosis",
      d.diagnosis || ""
    );

    p.set(
      "errorName",
      d.errorName || ""
    );

    p.set(
      "errorMessage",
      d.errorMessage || ""
    );


    if(rt){

      [
        "duration",
        "domainLookupStart",
        "domainLookupEnd",
        "connectStart",
        "connectEnd",
        "secureConnectionStart",
        "requestStart",
        "responseStart",
        "responseEnd",
        "transferSize"
      ].forEach(k => {

        if(
          rt[k] !== undefined &&
          rt[k] !== null
        ){

          p.set(
            k,
            String(rt[k])
          );

        }

      });


      p.set(
        "protocol",
        rt.nextHopProtocol || ""
      );

      p.set(
        "initiator",
        rt.initiatorType || ""
      );

    }


    fetch(
      GAS_URL +
      "?" +
      p.toString() +
      "&_=" +
      Date.now(),
      {
        method:"GET",
        cache:"no-store",
        keepalive:true,
        priority:"low"
      }
    )
    .catch(
      e =>
        console.error(
          "【SEND clientTiming送信エラー】",
          e
        )
    );

  }catch(e){

    console.error(
      "【SEND clientTiming構築ERROR】",
      e
    );

  }

}


/* ========================================================
   メイン送信
   ======================================================== */

function send(){

  const measureStart =
    performance.now();

  const sendStartMs =
    Date.now();

  const startTime =
    new Date(
      sendStartMs
    ).toISOString();

  const browserState =
    getBrowserState();


  console.log(
    "【SEND開始】",
    sendStartMs,
    player,
    selected,
    sendNumber,
    tagStage
  );


  msgDiv.innerText =
    "📡 送信中…";


  /* 二重送信防止 */

  if(
    sessionStorage.getItem(
      sendKey
    ) === "sending"
  ){

    debugDiv.innerText =
      "二重送信防止";

    return;

  }

  sessionStorage.setItem(
    sendKey,
    "sending"
  );


  /* ======================================================
     fetch開始
     ====================================================== */

  const fetchStart =
    performance.now();

  const fetchStartMs =
    Date.now();


  const sendToFetchMs =
    Math.max(
      0,
      Math.round(
        fetchStartMs -
        sendStartMs
      )
    );


  console.log(
    "【SEND送信→fetch開始】",
    sendToFetchMs +
      " ms"
  );


  /* ======================================================
     GAS URL
     ====================================================== */

  const url =
    `${GAS_URL}` +
    `?player=${encodeURIComponent(player)}` +
    `&selected=${encodeURIComponent(selected)}` +
    `&number=${encodeURIComponent(sendNumber)}` +
    `&tagStage=${encodeURIComponent(tagStage)}` +
    `&clientSendMs=${encodeURIComponent(sendStartMs)}` +
    `&requestId=${encodeURIComponent(requestId)}` +
    `&_=${Date.now()}`;


  let timeoutFired =
    false;


  /* ======================================================
     15秒警告

     重要：
     fetchそのものは中断しない。

     15秒経過してもGASのHTTP応答を待ち続け、
     実際にresponseが返ってきた時点で
     answerIdを取得する。
     ====================================================== */

  const timeoutId =
    setTimeout(
      () => {

        timeoutFired =
          true;

        timeoutWarningMs =
          Date.now();

        const elapsed =
          performance.now() -
          measureStart;

        const rt =
          getResourceTiming(
            GAS_URL
          );

        const bs =
          getBrowserState();


        let diagnosis =
          "判定不能";


        if(
          rt &&
          rt.responseStart > 0
        ){

          diagnosis =
            "HTTP response開始まで進行済み";

        }else if(
          rt &&
          rt.requestStart > 0
        ){

          diagnosis =
            "HTTP request開始済み。response待ちを疑う";

        }else if(
          rt &&
          rt.connectStart > 0
        ){

          diagnosis =
            "接続開始済み。接続→requestを疑う";

        }else if(
          rt &&
          rt.fetchStart > 0
        ){

          diagnosis =
            "fetch開始済み。request以前またはTiming制限";

        }else if(
          bs.online === false
        ){

          diagnosis =
            "TIMEOUT警告時点でnavigator.onLine=false";

        }else{

          diagnosis =
            "HTTP response未受信。Resource Timingにも進行記録なし";

        }


        /*
         * スマホ画面表示は現在と同じ。
         */

        msgDiv.innerText =
          "📩 送信確認中…";


        showDiagnostic([

          "【送信診断】15秒経過（通信は継続中）",

          "送信開始 → 15秒警告：" +
            Math.round(elapsed) +
            " ms",

          "fetch開始 → 15秒警告：" +
            Math.round(
              performance.now() -
              fetchStart
            ) +
            " ms",

          "HTTP response：まだ受信していません",

          "answerId：まだ取得していません",

          "【今回の重要判定】" +
            diagnosis,

          ...browserLines(bs),

          ...resourceLines(rt)

        ]);


        /*
         * 15秒時点の診断をGASへ送る。
         *
         * ここでもメインfetchは待たない。
         */

        sendClientTiming({

          requestId,

          sendStartMs,

          fetchStartMs,

          responseMs:0,

          jsonEndMs:0,

          sentDisplayMs:0,

          timeoutMs:
            timeoutWarningMs,

          httpStatus:"",

          diagnosis,

          browserState:bs,

          resourceTiming:rt,

          errorName:"",

          errorMessage:""

        });


      },
      15000
    );


  /* ======================================================
     メインGAS通信
     ====================================================== */

  fetch(
    url,
    {
      method:"GET",
      cache:"no-store"
    }
  )


  /* ======================================================
     HTTP response受信
     ====================================================== */

  .then(
    response => {

      const responseMs =
        Date.now();

      const responseElapsed =
        performance.now() -
        measureStart;


      window.__sendResponseMs =
        responseMs;

      window.__sendResponseElapsed =
        responseElapsed;

      window.__sendResponseStatus =
        response.status;


      clearTimeout(
        timeoutId
      );


      console.log(
        "【SEND GAS応答】",
        response.status,
        responseMs,
        responseElapsed
      );


      if(
        !response.ok
      ){

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      return response.json();

    }
  )


  /* ======================================================
     JSON解析完了
     ====================================================== */

  .then(
    data => {

      const jsonEnd =
        performance.now();

      const jsonEndMs =
        Date.now();


      const fetchTime =
        jsonEnd -
        fetchStart;


      const responseElapsed =
        window.__sendResponseElapsed ||
        0;


      const gasReceiveMs =
        Number(
          data.gasReceiveMs
        ) || 0;


      const gasCompleteMs =
        Number(
          data.gasCompleteMs
        ) || 0;


      const answerId =
        String(
          data.answerId || ""
        ).trim();


      const gasInternalMs =
        (
          gasReceiveMs &&
          gasCompleteMs
        )
          ? gasCompleteMs -
            gasReceiveMs
          : 0;


      /* fetch開始→GAS受信 */

      const fetchToGasReceiveMs =
        gasReceiveMs &&
        fetchStartMs
          ? Math.max(
              0,
              Math.round(
                gasReceiveMs -
                fetchStartMs
              )
            )
          : 0;


      /* 送信開始→GAS受信 */

      const sendToGasReceiveMs =
        gasReceiveMs
          ? Math.max(
              0,
              Math.round(
                gasReceiveMs -
                sendStartMs
              )
            )
          : 0;


      /* GAS完了→HTTP response */

      const gasCompleteToResponseMs =
        gasCompleteMs &&
        window.__sendResponseMs
          ? Math.round(
              window.__sendResponseMs -
              gasCompleteMs
            )
          : 0;


      /* GAS内部を除いたfetch時間 */

      const gasOutsideMs =
        Math.max(
          0,
          Math.round(
            fetchTime -
            gasInternalMs
          )
        );


      /* 送信しました表示 */

      const sentDisplayMs =
        Date.now();

      const sendDisplayTime =
        performance.now() -
        measureStart;


      /* HTTP response→JSON完了 */

      const jsonParseMs =
        Math.max(
          0,
          Math.round(
            jsonEnd -
            (
              measureStart +
              responseElapsed
            )
          )
        );


      const rt =
        getResourceTiming(
          GAS_URL
        );


      const bs =
        getBrowserState();


      const status =
        window.__sendResponseStatus;


      /* ==================================================
         正常表示
         ================================================== */

      msgDiv.innerText =
        "📩 送信しました！";


      showDiagnostic([

        "【今回の送信診断】",

        "answerId：" +
          answerId,

        "送信開始 → fetch開始：" +
          sendToFetchMs +
          " ms",

        "fetch開始 → GAS受信：" +
          fetchToGasReceiveMs +
          " ms",

        "fetch開始 → GAS応答：" +
          Math.round(fetchTime) +
          " ms",

        "送信開始 → GAS受信（目安）：" +
          sendToGasReceiveMs +
          " ms",

        "GAS受信 → GAS処理完了：" +
          Math.round(gasInternalMs) +
          " ms",

        "GAS処理完了 → HTTP応答（目安）：" +
          gasCompleteToResponseMs +
          " ms",

        "GAS外の時間：" +
          gasOutsideMs +
          " ms",

        "送信開始 →「送信しました」：" +
          Math.round(sendDisplayTime) +
          " ms",

        "HTTP：" +
          status,

        "JSON解析：" +
          jsonParseMs +
          " ms",

        ...browserLines(bs),

        ...resourceLines(rt)

      ]);


      /* ==================================================
         ローカル診断保存
         ================================================== */

      const diagnostic = {

        result:
          "GAS_RESPONSE",

        time:
          startTime,

        requestId,

        sendStartMs,

        fetchStartMs,

        responseMs:
          window.__sendResponseMs ||
          0,

        jsonEndMs,

        sentDisplayMs,

        answerId,

        player,

        selected,

        dog,

        number:
          sendNumber,

        tagStage,

        fetchMs:
          Math.round(fetchTime),

        sendToFetchMs,

        fetchToGasReceiveMs,

        gasInternalMs:
          Math.round(
            gasInternalMs
          ),

        sendToGasReceiveMs,

        gasCompleteToResponseMs,

        gasOutsideMs,

        sendToDisplayMs:
          Math.round(
            sendDisplayTime
          ),

        httpStatus:
          status,

        jsonParseMs,

        browserState:
          bs,

        resourceTiming:
          rt

      };


      saveLastDiagnostic(
        diagnostic
      );

      saveSendRecord(
        diagnostic
      );


      /* ==================================================
         timing_logへclientTiming送信
         ================================================== */

      if(answerId){

        sendClientTiming({

          requestId,

          answerId,

          sendStartMs,

          fetchStartMs,

          responseMs:
            window.__sendResponseMs ||
            0,

          jsonEndMs,

          sentDisplayMs,

          timeoutMs:
            timeoutWarningMs,

          httpStatus:
            status,

          diagnosis:
            timeoutFired
              ? "15秒警告後にHTTP response受信・answerId取得"
              : "正常",

          browserState:
            bs,

          resourceTiming:
            rt,

          errorName:"",

          errorMessage:""

        });

      }


      /*
       * 現在と同じ1.5秒後にplayer.htmlへ戻る。
       */

      setTimeout(
        () => {

          location.href =
            "player.html";

        },
        1500
      );

    }
  )


  /* ======================================================
     通信ERROR
     ====================================================== */

  .catch(
    error => {

      clearTimeout(
        timeoutId
      );


      const errorTime =
        performance.now() -
        measureStart;


      const errorMs =
        Date.now();


      sessionStorage.setItem(
        sendKey,
        "sent"
      );


      const rt =
        getResourceTiming(
          GAS_URL
        );


      const bs =
        getBrowserState();


      msgDiv.innerText =
        "📩 送信確認中";


      showDiagnostic([

        "【送信診断】通信ERROR",

        "送信開始 → ERROR：" +
          Math.round(errorTime) +
          " ms",

        "error：" +
          String(error),

        "error.name：" +
          (
            error &&
            error.name
              ? error.name
              : "取得不可"
          ),

        "answerId：取得できず",

        ...browserLines(bs),

        ...resourceLines(rt)

      ]);


      saveLastDiagnostic({

        result:
          "ERROR",

        time:
          startTime,

        requestId,

        sendStartMs,

        fetchStartMs,

        errorMs,

        elapsedMs:
          Math.round(
            errorTime
          ),

        errorMessage:
          String(error),

        errorName:
          (
            error &&
            error.name
              ? error.name
              : ""
          ),

        player,

        selected,

        number:
          sendNumber,

        tagStage,

        browserState:
          bs,

        resourceTiming:
          rt

      });


      sendClientTiming({

        requestId,

        sendStartMs,

        fetchStartMs,

        responseMs:0,

        jsonEndMs:0,

        sentDisplayMs:0,

        timeoutMs:
          timeoutWarningMs,

        httpStatus:"",

        diagnosis:
          "HTTP通信ERROR",

        browserState:
          bs,

        resourceTiming:
          rt,

        errorName:
          (
            error &&
            error.name
              ? error.name
              : ""
          ),

        errorMessage:
          String(error)

      });


      /*
       * 現在と同じ1.5秒後に戻る。
       */

      setTimeout(
